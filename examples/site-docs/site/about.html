<script>
try { var theme = localStorage.getItem('pneuma-space-theme'), lang = localStorage.getItem('pneuma-space-lang'); } catch (e) {}

document.documentElement.lang = lang || (/^zh/i.test(navigator.language) ? 'zh' : 'en');
</script>
