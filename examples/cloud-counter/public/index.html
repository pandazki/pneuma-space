<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your private counter</title>
<style>:root{color-scheme:light dark}body{font:16px/1.6 system-ui;margin:0;min-height:100dvh;display:grid;place-items:center;background:light-dark(#f4f3ef,#141817);color:light-dark(#25332b,#e4ece7)}main{padding:32px;max-width:28rem}h1{font-size:28px;line-height:1.2}#count{font:600 80px/1.2 ui-monospace,monospace;margin:24px 0}button{font:600 16px system-ui;border:0;border-radius:999px;padding:14px 24px;background:#245b40;color:#fff;cursor:pointer}button:focus-visible{outline:3px solid #91bca1;outline-offset:4px}button:disabled{opacity:.5}p{color:light-dark(#56645c,#a7b5ac)}#status{min-height:2em}</style></head>
<body><main><p id="who">Your private application</p><h1>A count that stays.</h1><div id="count" aria-live="polite">…</div><button id="increment" disabled>Add one</button><p>The saved count survives a new release.</p><p id="status" role="status"></p></main>
<script>const count=document.querySelector('#count'),button=document.querySelector('button'),status=document.querySelector('#status');async function update(method='GET'){button.disabled=true;status.textContent='';try{const response=await fetch('/api/count',{method});if(!response.ok)throw new Error('Could not save. Please try again.');const data=await response.json();count.textContent=data.count;document.querySelector('#who').textContent=data.name+' · Release '+data.release;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}}button.onclick=()=>update('POST');update();</script></body></html>
