<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2e9"><title>Little Shelf · a place for good ideas</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div class="frame"><header class="top"><a class="brand" href="/" aria-label="Little Shelf home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6h7v20H6zM16 10h7v16h-7zM25 4h3v22h-3zM4 28h26"/></svg>little shelf<span class="brand-dot">.</span></a><span class="private">Your private corner of the internet</span><a class="workspace" href="__PNEUMA_SPACE_CONTROL__/dashboard" target="_blank" rel="noopener">Workspace ↗</a></header>
<main><div class="intro"><div><h1>Keep a little<br><em>of what moves you.</em></h1><p>Ideas worth keeping. Pages worth returning to.<br>A small space, entirely yours.</p></div><button class="primary" id="new">＋ Add something</button></div>
<div class="tools"><div class="filters" role="group" aria-label="Filter your shelf"><button data-category="All" aria-pressed="true">All entries</button><button data-category="Ideas" aria-pressed="false">Ideas</button><button data-category="Reading" aria-pressed="false">Reading</button><button data-category="Life" aria-pressed="false">Life</button></div><label class="search"><span class="sr-only">Search your shelf</span><input id="search" type="search" placeholder="Find a little something…"></label></div>
<div class="collection-head"><span id="count" role="status">Opening your shelf…</span><button class="quiet" id="archive" aria-pressed="false">View archive</button></div><p id="message" class="message" role="status" hidden></p><div id="shelf" class="shelf" aria-live="polite"></div>
<footer><span id="saved">A few examples to make this space yours.</span><span>Small by design. Saved for later.</span></footer></main></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="entry-form"><div class="dialog-head"><h2 id="editor-title">Add to your shelf</h2><button class="icon-button" id="close" type="button" aria-label="Close editor">×</button></div><label>Title<input id="title" required maxlength="80" placeholder="A thought worth coming back to"></label><div class="form-row"><label>Collection<select id="category"><option>Ideas</option><option>Reading</option><option>Life</option></select></label><label>Link <span class="optional">optional</span><input id="url" type="url" maxlength="500" placeholder="https://"></label></div><label>A little context<textarea id="note" maxlength="400" rows="4" placeholder="What made this worth saving?"></textarea></label><p id="form-message" role="alert" hidden></p><div class="form-actions"><button id="delete" class="quiet delete" type="button" hidden>Delete entry</button><span></span><button id="save" class="primary" type="submit">Save to shelf</button></div></form></dialog>
</body></html>
