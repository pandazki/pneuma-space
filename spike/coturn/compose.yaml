services:
  gateway:
    image: node:24-alpine
    command: ["sleep", "infinity"]
  coturn:
    image: coturn/coturn:4.6
    profiles: ["rtc"]
    command:
      - --use-auth-secret
      - --static-auth-secret=${PNEUMA_RTC_SECRET}
      - --realm=pneuma
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --no-cli
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"
