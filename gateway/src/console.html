<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PneumaSpace</title>
<script>
(() => {
  const root = document.documentElement;
  const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const media = matchMedia('(prefers-color-scheme: dark)');
  const apply = () => { root.dataset.theme = stored('pneuma-space-theme') ?? (media.matches ? 'dark' : 'light'); };
  apply();
  media.addEventListener('change', apply);
  const lang = stored('pneuma-space-lang') ?? navigator.language;
  root.lang = lang.startsWith('zh') ? 'zh' : 'en';
})();
</script>

function t(key, vars) {
  let text = I18N[lang][key];
  if (text === undefined) {
    console.error(`missing i18n key ${key}`);
    text = key;
  }
  return vars ? text.replace(/\{(\w+)\}/g, (_, name) => vars[name]) : text;
}
const locale = () => (lang === 'zh' ? 'zh-CN' : 'en-US');
const nf = (n) => new Intl.NumberFormat(locale()).format(n);
const pct = (n) => new Intl.NumberFormat(locale(), { style: 'percent', maximumFractionDigits: 1 }).format(n);
const ms = (v) => (v == null ? '-' : v >= 1000 ? `${new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(v / 1000)} s` : `${nf(Math.round(v))} ms`);
const clock = (v, seconds) => new Intl.DateTimeFormat(locale(), { hour: '2-digit', minute: '2-digit', second: seconds ? '2-digit' : undefined, hour12: false }).format(v);
const stamp = (v) => new Intl.DateTimeFormat(locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(v);

function bytes(n) {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${new Intl.NumberFormat(locale(), { maximumFractionDigits: i > 2 ? 1 : 0 }).format(n)} ${units[i]}`;
}

function duration(span) {
  const s = Math.max(0, Math.floor(span / 1000));
  const parts = [['d', Math.floor(s / 86400)], ['h', Math.floor(s / 3600) % 24], ['m', Math.floor(s / 60) % 60], ['s', s % 60]];
  const first = parts.findIndex(([, n]) => n > 0);
  return parts.slice(first < 0 ? 3 : first, (first < 0 ? 3 : first) + 2).map(([unit, n]) => t(`dur.${unit}`, { n })).join(' ');
}

function ago(v) {
  if (v == null) return h('span', { class: 'muted' }, t('never'));
  const s = Math.round((v - Date.now()) / 1000);
  const [n, unit] = Math.abs(s) < 60 ? [s, 'second'] : Math.abs(s) < 3600 ? [Math.round(s / 60), 'minute'] : Math.abs(s) < 86400 ? [Math.round(s / 3600), 'hour'] : [Math.round(s / 86400), 'day'];
  return h('time', { datetime: new Date(v).toISOString(), title: stamp(v) }, new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' }).format(n, unit));
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? '' : value);
  }
  el.append(...children.flat(Infinity).filter((c) => c != null && c !== false));
  return el;
}

function svg(tag, attrs = {}, ...children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) if (value != null) el.setAttribute(key, value);
  el.append(...children);
  return el;
}

async function api(method, path, body, contentType = 'application/json') {
  const response = await fetch(path, {
    method,
    headers: body === undefined ? {} : { 'content-type': contentType },
    body: body === undefined || contentType !== 'application/json' ? body : JSON.stringify(body),
  });
  const text = await response.text();
  if (response.headers.get('content-type')?.startsWith('text/plain')) return text;
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw Object.assign(new Error(data?.error ?? `${response.status} ${response.statusText}`), { status: response.status });
  return data;
}

// Live overview (ADR 0015): consecutive snapshots are diffed in the browser and the diff drives every animation.

const METRICS_MS = 2000;
const APPS_MS = 5000;
const SPAN_MS = 15 * 60_000;
const AHEAD_MS = 60_000;
const KEEP_EVENTS = 600;
const TAIL_ROWS = 300;
const FRESH_ROWS = 40;
/** The awake timeline draws only the apps whose state changed most recently (ADR 0016). */
const TIMELINE_ROWS = 10;
const ACTIVE = ['waking', 'awake', 'draining', 'stopping'];
const INSTANCE_EVENTS = ['waking', 'awake', 'draining', 'stopping', 'asleep', 'removed'];
const MARKS = {
  publish: { test: (e) => e.ev === 'publish', color: 'var(--ink-2)' },
  wake: { test: (e) => e.ev === 'awake' && typeof e.ms === 'number', color: 'var(--accent)' },
  wakeFailed: { test: (e, model) => model.wakeFailures.has(e), color: 'var(--red)' },
  deliveryFailed: { test: (e) => e.ev === 'delivery.failed', color: 'var(--red)' },
};

/** Everything the overview knows, folded from snapshots: the event history by seq and each app's state transitions. */
function liveModel() {
  return { startedAt: null, lastSeq: 0, horizon: 0, events: [], transitions: new Map(), wakeFailures: new WeakSet(), metrics: null, apps: [], appsAt: 0, rates: new Map() };
}

function absorbMetrics(model, m) {
  const initial = model.startedAt === null;
  const restarted = !initial && m.gateway.startedAt !== model.startedAt;
  if (restarted) model.lastSeq = 0;
  model.startedAt = m.gateway.startedAt;
  const fresh = m.events.filter((e) => e.seq > model.lastSeq);
  const missed = !initial && fresh.length ? fresh[0].seq - model.lastSeq - 1 : 0;
  const lost = m.events.length > 0 && m.events[0].seq > model.lastSeq + 1;
  const reset = initial || restarted || lost;
  if (reset) {
    model.horizon = lost ? m.events[0].t : m.gateway.startedAt;
    for (const [name, list] of model.transitions) {
      const kept = list.filter((s) => s.t >= model.horizon);
      if (kept.length) model.transitions.set(name, kept); else model.transitions.delete(name);
    }
  }
  if (fresh.length) model.lastSeq = fresh.at(-1).seq;
  for (const e of fresh) {
    if (!e.app || !INSTANCE_EVENTS.includes(e.ev)) continue;
    const list = model.transitions.get(e.app) ?? [];
    // As in metrics.ts: a failed `docker stop` after a drain also emits asleep with an error, but after stopping.
    const failed = e.ev === 'asleep' && e.error !== undefined && list.at(-1)?.state === 'waking';
    if (failed) model.wakeFailures.add(e);
    list.push({ state: e.ev === 'removed' ? 'none' : e.ev, t: e.t, ms: e.ms, error: e.error, failed });
    let old = 0;
    while (old < list.length - 1 && list[old + 1].t < e.t - SPAN_MS) old++;
    list.splice(0, old);
    model.transitions.set(e.app, list);
  }
  model.events.push(...fresh);
  model.events.splice(0, Math.max(0, model.events.length - KEEP_EVENTS));
  model.metrics = m;
  return { initial, fresh, missed, restarted, reset };
}

/** The listing is the authority for every known app's current state unless an event seen for the app is newer than the request. */
function absorbApps(model, apps, asked) {
  const before = new Map(model.apps.map((a) => [a.name, a]));
  const listed = new Map(apps.map((a) => [a.name, a]));
  for (const a of apps) {
    const prev = before.get(a.name);
    if (prev && model.appsAt) model.rates.set(a.name, Math.max(0, a.requests - prev.requests) / ((asked - model.appsAt) / 1000));
  }
  for (const name of new Set([...listed.keys(), ...model.transitions.keys()])) {
    const a = listed.get(name);
    const state = a?.instance ?? 'none';
    const list = model.transitions.get(name) ?? [];
    const last = list.at(-1);
    const t = a?.since ?? asked;
    if (last ? last.state === state || t < last.t : state === 'none') continue;
    list.push({ state, t });
    model.transitions.set(name, list);
  }
  model.apps = apps;
  model.appsAt = asked;
}

/** Before the ring's horizon nothing is known; an app's state before its first transition is known only when that transition is a wake. */
const knownFrom = (list, horizon) => (list[0].state === 'waking' ? Math.min(horizon, list[0].t) : list[0].t);

const stateOf = (model, name) => model.transitions.get(name)?.at(-1)?.state ?? 'none';

/** One band per awake period, from the wake to the stop; draining and stopping are its tail. */
function segments(list, from, now) {
  const out = [];
  let band = null;
  list.forEach((s, i) => {
    const end = list[i + 1]?.t ?? now;
    if (ACTIVE.includes(s.state)) {
      band ??= { state: 'awake', from: s.t, tail: null };
      if (s.state === 'draining' || s.state === 'stopping') band.tail ??= s.t;
      if (typeof s.ms === 'number') band.ms = s.ms;
      band.to = end;
      band.open = i === list.length - 1;
      return;
    }
    if (band) out.push(band);
    band = null;
    if (s.failed) out.push({ state: 'fail', from: s.t, to: s.t, error: s.error, t: s.t });
  });
  if (band) out.push(band);
  return out.filter((b) => b.to >= from).map((b) => ({ ...b, from: Math.max(from, b.from), tail: b.tail && Math.max(from, b.tail) }));
}

const since = (v) => t('ago', { d: duration(Date.now() - v) });

/** Text that changes with the clock alone; refreshed once a second instead of re-rendering. */
function ticking(fn) {
  const el = h('span', { 'data-tick': '' });
  el.tick = () => { el.textContent = fn(); };
  el.tick();
  return el;
}

/** replaceChildren that, like h(), flattens arrays and skips null and false. */
function fill(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
}

/** Removing the class later matters only under prefers-reduced-motion, where the highlight is static. */
function flash(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  clearTimeout(el.flashed);
  el.flashed = setTimeout(() => el.classList.remove(cls), 1600);
}

/** The live indicator of a polling page: on, paused by the operator, or offline after a failed poll. `lastKey` names the latest arrival. */
function liveHeader(lastKey, onResume) {
  const dot = h('span', { class: 'dot' });
  const text = h('span');
  const button = h('button', { class: 'btn', type: 'button', onclick: () => {
    mode = mode === 'paused' ? 'on' : 'paused';
    render();
    if (mode === 'on') onResume();
  } });
  const el = h('div', { class: 'live', 'data-live': 'on', role: 'status' }, dot, text, button);
  let mode = 'on';
  let last = null;
  let restartedAt = null;
  const render = () => {
    el.dataset.live = mode;
    fill(button, t(mode === 'paused' ? 'live.resume' : 'live.pause'));
    fill(text,
      h('b', {}, t(`live.${mode}`)),
      mode === 'on' ? [' · ', ticking(() => (last ? t(lastKey, { ago: since(last) }) : t('live.none')))] : null,
      restartedAt && Date.now() - restartedAt < 120_000 ? h('span', { class: 'note' }, ` · ${t('live.restarted', { time: clock(restartedAt, true) })}`) : null);
  };
  render();
  return {
    el,
    restarted(at) { restartedAt = at; },
    seen(at) { last = at ?? last; render(); },
    beat() { flash(dot, 'beat'); },
    /** A poll that skips while paused or while its previous run is still out. */
    guarded(fn) {
      let busy = false;
      return async () => {
        if (mode === 'paused' || busy) return;
        busy = true;
        try {
          await fn();
          if (mode === 'offline') { mode = 'on'; render(); }
        } catch {
          mode = 'offline';
          render();
        } finally {
          busy = false;
        }
      };
    },
  };
}

function seatsCard() {
  const value = h('span', { class: 'kv' });
  const sub = h('div', { class: 'ks' });
  const fleet = h('div', { class: 'ks' });
  const grid = h('div', { class: 'seats', role: 'list' });
  const cells = Array.from({ length: AWAKE_GATE }, () => h('div', { class: 'seat', role: 'listitem', onclick: (e) => { const app = e.currentTarget.dataset.app; if (app) location.hash = `#/apps/${encodeURIComponent(app)}`; } }));
  grid.append(...cells);
  const el = h('div', { class: 'card', 'data-section': 'seats' }, h('div', { class: 'kh' }, h('span', { class: 'l' }, t('seats.title')), h('span', { class: 'ks', style: 'margin:0' }, t('seats.gate', { n: AWAKE_GATE }))), value, sub, grid, fleet);
  const seatOf = new Map();
  let shown = null;
  return {
    el,
    render(model, animate) {
      const names = new Set([...model.transitions.keys()].filter((n) => ACTIVE.includes(stateOf(model, n))));
      for (const name of seatOf.keys()) if (!names.has(name)) seatOf.delete(name);
      const taken = new Set(seatOf.values());
      const overflow = [];
      for (const name of [...names].sort()) {
        if (seatOf.has(name)) continue;
        const free = cells.findIndex((_, i) => !taken.has(i));
        if (free < 0) { overflow.push(name); continue; }
        seatOf.set(name, free);
        taken.add(free);
      }
      const byIndex = new Map([...seatOf].map(([name, i]) => [i, name]));
      cells.forEach((cell, i) => {
        const name = byIndex.get(i);
        const state = name ? stateOf(model, name) : 'free';
        cell.classList.remove('ignite');
        if (animate && state === 'awake' && cell.dataset.state !== 'awake') flash(cell, 'ignite');
        cell.dataset.state = state;
        if (name) cell.dataset.app = name; else delete cell.dataset.app;
        cell.title = name ? `${name} · ${t(`st.${state}`)}` : t('seats.free');
      });
      const count = (state) => [...names].filter((n) => stateOf(model, n) === state).length;
      const next = `${names.size}`;
      if (shown !== next) {
        fill(value, nf(names.size), h('small', {}, `/ ${AWAKE_GATE}`));
        if (animate && shown !== null) flash(value, 'bump');
        shown = next;
      }
      fill(sub, t('k.awakeSub', { waking: count('waking'), draining: count('draining'), stopping: count('stopping') }),
        overflow.length ? h('span', { class: 'over' }, ` · ${t('seats.over', { n: overflow.length })}`) : null);
      const f = model.metrics.fleet;
      fill(fleet, t('seats.fleet', { registered: nf(f.apps.registered), active: nf(f.activeLast24h), removed: nf(f.apps.removed) }));
    },
  };
}

function gateCard() {
  const value = h('span', { class: 'kv' });

  const latest = h('div', { class: 'ks' });

  let lastSeq = null;
  let shown = null;
  return {
    el,
    render(model, animate) {
      const w = model.metrics.wakes.last1h;
      if (shown !== w.count) {
        fill(value, nf(w.count));

        shown = w.count;
      }
      fill(sub, t('gate.sub', { p50: ms(w.p50Ms), p95: ms(w.p95Ms), failures: nf(w.failures) }));
      const wakes = model.events.filter((e) => MARKS.wake.test(e) || MARKS.wakeFailed.test(e, model)).slice(-40);
      const top = Math.max(COLD_START_GATE_MS * 1.25, ...wakes.map((e) => (e.ms ?? 0) * 1.08));

      lastSeq = model.lastSeq;
      fill(latest, newest
        ? [newest.ms === undefined ? h('span', { class: 'over' }, t('gate.failed')) : t('gate.latest', { ms: ms(newest.ms) }), ' · ', newest.app ?? '', ' · ', ticking(() => since(newest.t))]
        : t('gate.none'));
    },
  };
}

/**
 * `cap` keeps the apps that changed most recently; `shows` narrows the rows; with `pick`, a row click picks the app
 * (and `pick.is` marks it) instead of opening its project.
 */
function timeline({ cap = Infinity, shows = () => true, pick = null } = {}) {
  const body = h('div', { class: 'card tl', 'data-section': 'timeline' });
  const note = h('span', { class: 'muted', style: 'font-size:12px' });
  const rendered = new Set();
  return {
    el: body,
    note,
    render(model, animate) {
      const now = Date.now();
      const from = now - SPAN_MS;
      const span = SPAN_MS + AHEAD_MS;
      const pct = (v) => `${(((v - from) / span) * 100).toFixed(3)}%`;
      const noData = (until) => (until > from ? h('div', { class: 'nodata', style: `width:${pct(Math.min(until, now))}`, title: t('tl.nodata') }) : null);
      const listed = new Map(model.apps.map((a) => [a.name, a]));
      const rows = [...model.transitions.entries()]
        .map(([name, list]) => {
          const known = Math.max(from, knownFrom(list, model.horizon));
          return { name, list, known, segs: segments(list, known, now) };
        })
        .filter((r) => r.segs.length && listed.has(r.name) && listed.get(r.name).status !== 'purging');
      const any = rows.length > 0;
      rows.splice(0, rows.length, ...rows.filter((r) => shows(r.name)));
      note.textContent = rows.length > cap ? t('tl.cut', { n: cap, total: nf(rows.length) }) : '';
      rows.sort((a, b) => b.list.at(-1).t - a.list.at(-1).t).splice(cap);
      rows.sort((a, b) => (a.name < b.name ? -1 : 1));
      const axis = h('div', { class: 'tl-row axis' }, h('span', {}),
        h('div', { class: 'track' }, h('div', { class: 'ahead', style: `left:${pct(now)}` }), noData(Math.max(from, model.horizon)),
          [15, 10, 5].map((n) => h('span', { class: n === 15 ? 'tick first' : 'tick', style: `left:${pct(now - n * 60_000)}` }, t('tl.minus', { n }))),
          h('span', { class: 'tick now', style: `left:${pct(now)}` }, t('tl.now'))),
        h('span', {}));
      if (!rows.length) {
        rendered.clear();
        return void fill(body, axis, h('div', { class: 'empty' }, t(any ? 'empty.filtered' : 'tl.empty')));
      }
      const present = new Set(rows.map((r) => r.name));
      for (const name of rendered) if (!present.has(name)) rendered.delete(name);
      fill(body, axis, ...rows.map(({ name, list, known, segs }) => {
        const state = stateOf(model, name);
        const a = listed.get(name);
        const lastWake = [...list].reverse().find((s) => s.state === 'awake' && typeof s.ms === 'number' && s.t >= known);
        const block = (cls, a, b, title) => h('div', { class: `band ${cls}`, style: `left:${pct(a)};width:calc(${pct(b)} - ${pct(a)})`, title });
        const bands = segs.map((s) => (s.state === 'fail'
          ? h('div', { class: 'band fail', style: `left:${pct(s.t)}`, title: `${t('mk.wakeFailed')} ${clock(s.t, true)} · ${s.error}` })
          : [
            block('', s.from, s.tail ?? s.to, `${t('st.awake')} ${clock(s.from, true)} – ${s.open && !s.tail ? t('tl.now') : clock(s.tail ?? s.to, true)}${s.ms ? ` · ${t('tl.wake', { ms: ms(s.ms) })}` : ''}`),
            s.tail ? block('tail', s.tail, s.to, `${t('st.draining')} ${clock(s.tail, true)} – ${s.open ? t('tl.now') : clock(s.to, true)}`) : null,
          ]));
        const plan = state === 'awake' && a?.sleepsAt && a.instance === 'awake' && a.sleepsAt > now
          ? h('div', { class: 'band plan', style: `left:${pct(now)};width:calc(${pct(Math.min(a.sleepsAt, now + AHEAD_MS))} - ${pct(now)})`, title: t('tl.sleepsAt', { time: clock(a.sleepsAt, true) }) })
          : null;
        const label = lastWake ? h('span', { class: `ms${(lastWake.t - from) / span < 0.12 ? ' after' : ''}${lastWake.ms > COLD_START_GATE_MS ? ' slow' : ''}`, style: `left:${pct(lastWake.t)}` }, ms(lastWake.ms)) : null;
        const leases = a && ACTIVE.includes(state) ? leaseChips(a.leases) : null;
        const rate = model.rates.get(name);
        const why = state === 'awake' && a?.instance === 'awake' && a.sleepsAt
          ? ticking(() => (a.sleepsAt > Date.now() ? t('tl.sleepsIn', { d: duration(a.sleepsAt - Date.now() + 999) }) : t('tl.sleepingNow')))
          : ACTIVE.includes(state) ? null
            : h('span', { class: 'muted' }, ticking(() => t('tl.asleep', { d: duration(Date.now() - list.at(-1).t) })));
        const open = (e) => {
          if (e.target.closest('a')) return;
          if (pick) pick.set(name); else location.hash = `#/apps/${encodeURIComponent(name)}`;
        };
        const row = h('div', { class: `tl-row${ACTIVE.includes(state) ? '' : ' dim'}${pick?.is(name) ? ' picked' : ''}`, 'data-href': `#/apps/${encodeURIComponent(name)}`, title: pick ? t(pick.is(name) ? 'rt.unpick' : 'rt.pick', { name }) : null, onclick: open },
          h('div', { class: 'tl-name' }, h('span', { class: `st ${tone(state === 'none' ? 'asleep' : state)}`, title: t(`st.${state}`) }, t(`st.${state}`)), appLink(name)),
          h('div', { class: 'track' }, h('div', { class: 'ahead', style: `left:${pct(now)}` }), noData(known), bands, plan, label),
          h('div', { class: 'tl-meta' },
            rate > 0 && ACTIVE.includes(state) ? h('span', { class: 'num' }, t('tl.rate', { n: new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(rate) })) : null,
            leases,
            why && h('span', { class: state === 'awake' && a?.sleepsAt && a.sleepsAt - now < 10_000 ? 'soon' : '' }, why)));
        if (animate && !rendered.has(name)) row.classList.add('enter');
        rendered.add(name);
        return row;
      }));
    },
  };
}

// Charts

/** Sums minute buckets into bins: 1 h by minute, 6 h by 5 min, 24 h by 15 min. Latency bins take the median of minute medians. */
function binned(series, key, minutes) {
  const step = minutes === 60 ? 1 : minutes === 360 ? 5 : 15;
  const values = series[key].slice(-minutes);
  const out = [];
  for (let i = 0; i < values.length; i += step) {
    const chunk = values.slice(i, i + step);
    if (key === 'wakeP50Ms') {
      const present = chunk.filter((v) => v != null).sort((a, b) => a - b);
      out.push(present.length ? present[Math.floor(present.length / 2)] : null);
    } else out.push(chunk.reduce((a, b) => a + b, 0));
  }
  return { values: out, step };
}

function niceMax(v) {
  if (v <= 4) return 4;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

/** One crosshair for every chart on the page: hovering one draws the line on all. */
const crosshair = {
  charts: new Set(),
  at(i) { for (const c of this.charts) c.cross(i); },
  reset() { for (const c of this.charts) c.observer.disconnect(); this.charts.clear(); },
};

/** layers: [{ key, color, kind: 'area' | 'bar' | 'line', axis: 'left' | 'right' }]; marks: keys of MARKS drawn in the lane above the plot. */
function chartCard(attrs, titleKey, layers, marks, extra = () => null) {
  const el = h('div', { class: 'inset chart', ...attrs });
  const tip = h('div', { class: 'tip', hidden: true });
  const plot = h('div', { style: 'position:relative' });
  const legend = h('span', { style: 'display:inline-flex;gap:10px;flex-wrap:wrap' });
  const note = h('div', { class: 'legend', style: 'padding:6px 4px 0' });
  let model = null;
  let cross = () => {};
  const id = `c${Math.random().toString(36).slice(2, 8)}`;
  const draw = () => {
    if (!model) return;
    const series = model.metrics.series;
    const width = Math.max(260, plot.clientWidth);
    const height = 160;
    const right = layers.some((l) => l.axis === 'right');
    const pad = { l: 34, r: right ? 46 : 8, t: 18, b: 20 };
    const bins = layers.map((l) => ({ ...l, ...binned(series, l.key, win) }));
    const count = bins[0].values.length;
    const step = bins[0].step;
    const start = series.start + (1440 - win) * 60000;
    const binMs = step * 60000;
    const done = Math.min(1, (Date.now() - (start + (count - 1) * binMs)) / binMs);
    const bw = (width - pad.l - pad.r) / count;
    const x = (i) => pad.l + bw * (i + 0.5);
    const maxOf = (axis) => niceMax(Math.max(0, ...bins.filter((l) => (l.axis ?? 'left') === axis).flatMap((l) => l.values.filter((v) => v != null))));
    const max = { left: maxOf('left'), right: right ? maxOf('right') : 1 };
    const y = (v, axis = 'left') => pad.t + (height - pad.t - pad.b) * (1 - v / max[axis]);
    const g = svg('svg', { viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': t(titleKey) });
    const defs = svg('defs');
    for (const [n, l] of bins.entries()) {
      defs.append(svg('pattern', { id: `${id}-${n}`, width: 4, height: 4, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
        svg('rect', { width: 4, height: 4, style: `fill:${l.color};fill-opacity:.12` }),
        svg('line', { x1: 0, y1: 0, x2: 0, y2: 4, style: `stroke:${l.color};stroke-width:1.6` })));
    }
    g.append(defs);
    for (const f of [0, 0.5, 1]) {
      g.append(svg('line', { x1: pad.l, x2: width - pad.r, y1: y(max.left * f), y2: y(max.left * f), style: 'stroke:var(--line-soft)' }));
      g.append(svg('text', { x: pad.l - 6, y: y(max.left * f) + 4, 'text-anchor': 'end' }, nf(max.left * f)));
      if (right) g.append(svg('text', { x: width - pad.r + 6, y: y(max.right * f, 'right') + 4 }, ms(max.right * f)));
    }
    for (const f of [0, 1 / 3, 2 / 3, 1]) {
      const i = Math.min(count - 1, Math.round(f * (count - 1)));
      g.append(svg('text', { x: x(i), y: height - 4, 'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle' }, clock(start + i * binMs)));
    }
    const lastX = x(count - 1) - bw / 2;
    g.append(svg('rect', { x: lastX, y: pad.t, width: Math.max(1, bw * done), height: height - pad.t - pad.b, style: 'fill:var(--stripe)' }));
    for (const [n, l] of bins.entries()) {
      const axis = l.axis ?? 'left';
      const v = l.values;
      if (l.kind === 'bar') {
        v.forEach((value, i) => value > 0 && g.append(svg('rect', {
          x: x(i) - Math.max(1, bw * 0.3), width: Math.max(2, bw * 0.6), y: y(value, axis), height: y(0) - y(value, axis), rx: 1,
          style: i === count - 1 ? `fill:url(#${id}-${n});stroke:${l.color};stroke-width:1` : `fill:${l.color}`,
        })));
        continue;
      }
      const solid = l.kind === 'area' ? count - 1 : count;
      const points = v.slice(0, solid).map((value, i) => (value == null ? null : [x(i), y(value, axis)]));
      const runs = [];
      for (const p of points) if (p) (runs.at(-1)?.open ? runs.at(-1).pts.push(p) : runs.push({ open: true, pts: [p] })); else if (runs.at(-1)) runs.at(-1).open = false;
      for (const { pts } of runs) {
        const line = pts.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
        if (l.kind === 'area' && pts.length > 1) g.append(svg('path', { d: `${line}L${pts.at(-1)[0].toFixed(1)},${y(0)}L${pts[0][0].toFixed(1)},${y(0)}Z`, style: `fill:${l.color};fill-opacity:.1` }));
        if (pts.length === 1) g.append(svg('circle', { cx: pts[0][0], cy: pts[0][1], r: 2, style: `fill:${l.color}` }));
        g.append(svg('path', { d: line, style: `fill:none;stroke:${l.color};stroke-width:${l.kind === 'line' ? 1.5 : 2};stroke-linejoin:round${l.dash ? ';stroke-dasharray:3 3' : ''}` }));
      }
      if (l.kind === 'area' && v[count - 1] > 0) {
        g.append(svg('rect', { x: x(count - 1) - Math.max(1, bw * 0.3), width: Math.max(2, bw * 0.6), y: y(v[count - 1], axis), height: y(0) - y(v[count - 1], axis), rx: 1, style: `fill:url(#${id}-${n});stroke:${l.color};stroke-width:1` }));
      }
    }
    const binOf = (time) => Math.floor((time - start) / binMs);
    const lane = new Map();
    for (const e of model.events) {
      const i = binOf(e.t);
      if (i < 0 || i >= count) continue;
      for (const kind of marks) if (MARKS[kind].test(e, model)) {
        const key = `${i}:${kind}`;
        lane.set(key, { i, kind, n: (lane.get(key)?.n ?? 0) + 1 });
      }
    }
    const offsets = { publish: 0, wake: 0, wakeFailed: 6, deliveryFailed: 6 };
    for (const { i, kind } of lane.values()) {
      const cx = x(i) + (marks.length > 1 ? offsets[kind] - 3 : 0);
      const color = MARKS[kind].color;
      if (kind === 'publish') {
        g.append(svg('line', { x1: x(i), x2: x(i), y1: pad.t, y2: height - pad.b, style: 'stroke:var(--ink-3);stroke-dasharray:2 3' }));
        g.append(svg('path', { d: `M${x(i)},${pad.t - 10}l3.5,3.5l-3.5,3.5l-3.5,-3.5Z`, style: `fill:${color}` }));
      } else if (kind === 'wake') g.append(svg('rect', { x: cx - 1, y: pad.t - 11, width: 2, height: 7, rx: 1, style: `fill:${color}` }));
      else g.append(svg('circle', { cx, cy: pad.t - 7, r: 2.6, style: `fill:${color}` }));
    }
    const line = svg('line', { y1: pad.t - 12, y2: height - pad.b, style: 'stroke:var(--ink-3);stroke-width:1', visibility: 'hidden' });
    g.append(line);
    cross = (i) => {
      if (i == null) return void line.setAttribute('visibility', 'hidden');
      line.setAttribute('x1', x(i));
      line.setAttribute('x2', x(i));
      line.setAttribute('visibility', 'visible');
    };
    const show = (i) => {
      const from = start + i * binMs;
      const here = marks.map((kind) => [kind, lane.get(`${i}:${kind}`)?.n ?? 0]).filter(([, n]) => n > 0);
      fill(tip,
        h('div', { class: 'mono' }, step === 1 ? clock(from) : `${clock(from)}–${clock(from + binMs)}`, i === count - 1 ? ` · ${t('ch.partial')}` : ''),
        ...bins.map((l) => h('div', {}, h('span', { style: `color:${l.color}` }, '● '), `${t(`s.${l.key}`)} `, h('span', { class: 'mono' }, l.key === 'wakeP50Ms' ? ms(l.values[i]) : nf(l.values[i] ?? 0)))),
        ...here.map(([kind, n]) => h('div', {}, h('span', { style: `color:${MARKS[kind].color}` }, '◆ '), `${t(`mk.${kind}`)} `, h('span', { class: 'mono' }, nf(n)))));
      tip.hidden = false;
      const left = x(i) + 12;
      tip.style.left = `${left + tip.offsetWidth > width ? x(i) - tip.offsetWidth - 12 : left}px`;
      tip.style.top = '4px';
    };
    const index = (e) => Math.max(0, Math.min(count - 1, Math.floor((e.clientX - g.getBoundingClientRect().left - pad.l) / bw)));
    g.addEventListener('pointermove', (e) => { const i = index(e); crosshair.at(i); show(i); });
    g.addEventListener('pointerleave', () => { tip.hidden = true; crosshair.at(null); });
    fill(plot, g, tip);
  };
  const chart = { cross: (i) => cross(i), observer: new ResizeObserver(draw) };
  crosshair.charts.add(chart);
  chart.observer.observe(plot);
  el.append(h('header', {}, h('b', {}, t(titleKey)), legend), plot, note);
  return {
    el,
    set(next) {
      model = next;
      fill(legend, ...layers.map((l) => {
        const total = l.key === 'wakeP50Ms' ? null : binned(next.metrics.series, l.key, win).values.reduce((a, b) => a + b, 0);
        return h('span', { class: 'legend' }, h('i', { style: `background:${l.color}` }), t(`s.${l.key}`), total == null ? null : h('span', { class: 'mono' }, nf(total)));
      }));
      fill(note, extra(next));
      note.hidden = !note.childNodes.length;
      draw();
    },
  };
}

// Attention

const SEEN_KEY = 'pneuma-space-seen';
const loadSeen = () => { try { return new Set(JSON.parse(store.get(SEEN_KEY) ?? '[]')); } catch { return new Set(); } };

function attentionItems(model, downSince) {
  const m = model.metrics;
  // The sampler refreshes recentFailures every 10 s; the event carries the same failure within one poll.
  const failed = [
    ...m.deliveries.recentFailures,
    ...model.events.filter((e) => e.ev === 'delivery.failed').map((e) => ({ app: e.app, trigger: e.trigger, attempts: e.attempt, reason: e.reason, at: e.t })),
  ];
  const items = [...new Map(failed.map((d) => [`d:${d.app}:${d.trigger}:${d.at}`, d])).entries()].map(([id, d]) => ({
    id, group: `d:${d.app}:${d.trigger}`, tone: 'red', at: d.at, app: d.app,
    what: t('att.delivery'), why: [t('att.deliveryDetail', { trigger: d.trigger, attempts: d.attempts }), d.reason ? ` · ${d.reason}` : ''].join(''),
  }));
  for (const e of model.events) {
    if (e.error === undefined || e.ev === 'wake-failed' || (e.ev === 'asleep' && !model.wakeFailures.has(e))) continue;
    const wake = e.ev === 'asleep';
    items.push({ id: `e:${e.ev}:${e.app}:${e.t}`, group: `e:${e.ev}:${e.app}`, tone: 'red', at: e.t, app: e.app, what: wake ? t('att.wake') : h('span', { class: 'mono' }, e.ev), why: String(e.error) });
  }
  for (const [name, at] of downSince) items.push({ id: `s:${name}:${at}`, group: `s:${name}`, tone: 'red', at, app: null, what: t('att.service', { name: t(`svc.${name}`) }), why: t('att.serviceDetail') });
  const p95 = m.wakes.last1h.p95Ms;
  if (p95 != null && p95 > COLD_START_GATE_MS) {
    const hour = Math.floor(Date.now() / 3_600_000) * 3_600_000;
    items.push({ id: `p95:${hour}`, group: 'p95', tone: 'orange', at: hour, app: null, what: t('att.p95'), why: t('att.p95Detail', { p95: ms(p95) }) });
  }
  const groups = new Map();
  for (const item of items.sort((a, b) => b.at - a.at)) {
    const first = groups.get(item.group);
    if (first) first.count++;
    else groups.set(item.group, { ...item, count: 1 });
  }
  return [...groups.values()];
}

function attentionInbox() {
  const list = h('div', { class: 'card inbox' });
  const all = h('button', { class: 'linkish', type: 'button', onclick: () => { for (const i of items) seen.add(i.id); save(); paint(false); } }, t('att.allSeen'));
  const el = h('div', { 'data-section': 'attention' }, list);
  const seen = loadSeen();
  const downSince = new Map();
  let items = [];
  let known = null;
  let open = false;
  const save = () => store.set(SEEN_KEY, JSON.stringify([...seen].slice(-300)));
  const row = (i, fresh) => h('div', { class: `item ${i.tone}${seen.has(i.id) ? ' seen' : ''}${fresh ? ' enter' : ''}` },
    h('div', { class: 'what' }, i.what, i.app ? appLink(i.app) : null, i.count > 1 ? h('span', { class: 'chip' }, `×${nf(i.count)}`) : null),
    h('div', { class: 'side', style: 'grid-row: span 2' },
      h('span', { title: stamp(i.at) }, clock(i.at, true)),
      seen.has(i.id) ? null : h('button', { type: 'button', onclick: () => { seen.add(i.id); save(); paint(false); } }, t('att.seen'))),
    h('div', { class: 'why' }, i.why));
  const paint = (animate) => {
    const unseen = items.filter((i) => !seen.has(i.id));
    const done = items.filter((i) => seen.has(i.id));
    const fresh = (i) => animate && known !== null && !known.has(i.id);
    fill(list,
      unseen.length ? unseen.map((i) => row(i, fresh(i))) : h('div', { class: 'empty' }, t('empty.attention')),
      done.length ? h('div', { class: 'item', style: 'display:block;padding:8px 14px' },
        h('button', { class: 'linkish', type: 'button', onclick: () => { open = !open; paint(false); } }, open ? t('att.hideSeen') : t('att.showSeen', { n: done.length }))) : null,
      open ? done.map((i) => row(i, false)) : null);
    all.hidden = unseen.length === 0;
    known = new Set(items.map((i) => i.id));
  };
  return {
    el,
    action: all,
    render(model, animate) {
      for (const [name, s] of Object.entries(model.metrics.services)) {
        if (s.status === 'down' && !downSince.has(name)) downSince.set(name, model.metrics.gateway.lastFlushAt ?? Date.now());
        if (s.status !== 'down') downSince.delete(name);
      }
      items = attentionItems(model, downSince);
      paint(animate);
    },
  };
}

// Event tail

function eventTone(e) {
  if (e.error !== undefined || e.ev === 'delivery.failed') return 'red';
  return tone(e.ev.replace(/^delivery\./, ''));
}

function eventFields(e) {
  return Object.entries(e).filter(([k]) => !['seq', 't', 'ev', 'app'].includes(k))
    .map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' ');
}

const eventText = (e) => `${e.ev} ${e.app ?? ''} ${eventFields(e)}`.toLowerCase();

function eventLine({ item: e }) {
  return h('div', { class: 'ev', title: `#${e.seq} · ${stamp(e.t)}` },
    h('span', { class: 'mono' }, clock(e.t, true)),
    h('span', { class: `st ${eventTone(e)}` }, h('span', { class: 'mono' }, e.ev)),
    e.app ? appLink(e.app) : h('span', { class: 'muted' }, '-'),
    h('span', { class: 'f', title: eventFields(e) }, eventFields(e)));
}

const eventMarks = (diff) => [diff.restarted && t('tail.restart'), diff.missed > 0 && t('tail.gap', { n: nf(diff.missed) })].filter(Boolean);

/**
 * A newest-on-top stream that follows arrivals (ADR 0015): while the pointer is over it or it is scrolled down, new
 * entries wait behind a pill. An entry is `{ item }` or `{ mark }`; a mark (a gap, a restart) shows whatever the filter.
 */
function follow({ line, keep, limit, empty, newKey, attrs = {}, head = null }) {
  const rows = h('div', { class: 'rows' });
  const pill = h('button', { class: 'pill', type: 'button', hidden: true, onclick: () => { rows.scrollTo({ top: 0 }); hovering = false; flush(); } });
  const el = h('div', { ...attrs, class: `card tailbox ${attrs.class ?? ''}` }, pill, head, rows);
  const entries = [];
  const pending = [];
  let match = () => true;
  let hovering = false;
  let changed = () => {};
  const paused = () => hovering || rows.scrollTop > 4;
  const shows = (entry) => entry.mark !== undefined || match(entry.item);
  const node = (entry) => (entry.mark !== undefined ? h('div', { class: 'ev mark' }, entry.mark) : line(entry));
  const rebuild = () => {
    const shown = [];
    for (const entry of entries) {
      if (shown.length >= limit) break;
      if (shows(entry)) shown.push(node(entry));
    }
    fill(rows, shown.length ? shown : h('div', { class: 'empty' }, t(entries.some((e) => e.item) ? 'empty.filtered' : empty)));
    changed();
  };
  const flush = () => {
    pill.hidden = true;
    if (pending.length) {
      const batch = pending.splice(0).reverse();
      entries.unshift(...batch);
      entries.splice(keep);
      for (const old of rows.querySelectorAll('.fresh')) old.classList.remove('fresh');
      const shown = batch.filter(shows).slice(0, limit);
      // A batch held back by a pause arrives at once; flashing hundreds of rows says nothing.
      const nodes = shown.map((entry) => {
        const n = node(entry);
        if (shown.length <= FRESH_ROWS) n.classList.add('fresh');
        return n;
      });
      if (nodes.length) rows.querySelector('.empty')?.remove();
      rows.prepend(...nodes);
      while (rows.children.length > limit) rows.lastChild.remove();
    }
    changed();
  };
  rows.addEventListener('pointerenter', () => { hovering = true; });
  rows.addEventListener('pointerleave', () => { hovering = false; if (!paused()) flush(); });
  rows.addEventListener('scroll', () => { if (!paused()) flush(); }, { passive: true });
  return {
    el,
    /** Items shown, items kept, and how many matching ones wait behind the pill. */
    get counts() {
      return { shown: rows.querySelectorAll(':scope > :not(.mark):not(.empty)').length, kept: entries.filter((e) => e.item).length, waiting: pending.filter((p) => p.item && match(p.item)).length };
    },
    onChange(fn) { changed = fn; },
    setMatch(fn) { match = fn; rebuild(); },
    seed(items) {
      entries.unshift(...[...items].reverse().map((item) => ({ item })));
      entries.splice(keep);
      rebuild();
    },
    push(marks, items) {
      pending.push(...marks.map((mark) => ({ mark })), ...items.map((item) => ({ item })));
      if (!paused()) return flush();
      const n = pending.filter((p) => p.item && match(p.item)).length;
      pill.hidden = !n;
      pill.textContent = `↑ ${t(newKey, { n: nf(n) })}`;
      changed();
    },
  };
}

function eventTail() {
  const stream = follow({ line: eventLine, keep: TAIL_ROWS, limit: TAIL_ROWS, empty: 'empty.events', newKey: 'tail.new', attrs: { 'data-section': 'tail' } });
  const filter = h('input', { type: 'search', name: 'filter', placeholder: t('ev.filter'), 'aria-label': t('ev.filter'), oninput: () => {
    const needle = filter.value.trim().toLowerCase();
    stream.setMatch((e) => !needle || eventText(e).includes(needle));
  } });
  const state = h('span', { class: 'muted' });
  stream.onChange(() => { state.textContent = stream.counts.waiting ? t('tail.paused') : ''; });
  return {
    el: h('div', { 'data-section': 'events' }, h('div', { class: 'tailhead' }, filter, state), stream.el),
    seed: (events) => stream.seed(events),
    push: (diff) => stream.push(eventMarks(diff), diff.fresh),
  };
}

async function overview() {
  const model = liveModel();
  const header = liveHeader('live.last', () => refresh());
  const services = servicesLine();
  const seats = seatsCard();
  const gate = gateCard();
  const host = hostCard();
  const lane = timeline({ cap: TIMELINE_ROWS });
  const inbox = attentionInbox();
  const tail = eventTail();
  const charts = [
    chartCard({ 'data-section': 'traffic' }, 'ch.traffic', [
      { key: 'requests', color: 'var(--accent)', kind: 'area' },
      { key: 'errors', color: 'var(--red)', kind: 'bar' }], ['publish', 'wakeFailed']),
    chartCard({ 'data-section': 'wakes' }, 'ch.wakes', [
      { key: 'wakes', color: 'var(--accent)', kind: 'bar' },
      { key: 'wakeFailures', color: 'var(--red)', kind: 'bar' },
      { key: 'wakeP50Ms', color: 'var(--orange)', kind: 'line', axis: 'right' }], ['wake', 'wakeFailed']),

      { key: 'deliveriesFailed', color: 'var(--red)', kind: 'bar' },
      { key: 'deliveriesRetried', color: 'var(--orange)', kind: 'line', dash: true }], ['deliveryFailed', 'publish'],
    (m) => t('ch.due', { due: nf(m.metrics.deliveries.due), delivering: nf(m.metrics.deliveries.delivering) })),
  ];
  const windows = h('span');
  const renderWindows = () => fill(windows, segmented(WINDOWS.map((w) => [w, t(`win.${w}`)]), win, (w) => {
    win = w;
    store.set('pneuma-space-window', String(w));
    renderWindows();
    if (model.metrics) charts.forEach((c) => c.set(model));
  }));
  renderWindows();

  show(
    h('div', { class: 'head' }, h('div', { class: 'grow' }, h('h1', {}, t('ov.title')), h('p', { class: 'sub' }, t('ov.sub'))), header.el),
    services.el,
    h('section', {}, sectionHead(1, 'sec.fleet', 'sec.fleetDesc'), h('div', { class: 'fleet', 'data-section': 'fleet' }, seats.el, gate.el, host.el)),
    h('section', {}, sectionHead(2, 'sec.timeline', 'sec.timelineDesc', lane.note), lane.el),
    h('section', {}, sectionHead(3, 'sec.activity', 'sec.activityDesc', windows), h('div', { class: 'charts' }, charts.map((c) => c.el))),
    h('div', { class: 'pair' },
      h('section', {}, sectionHead(4, 'sec.attention', 'sec.attentionDesc', inbox.action), inbox.el),
      h('section', {}, sectionHead(5, 'sec.events', 'sec.eventsDesc', h('a', { href: '#/realtime', style: 'font-size:12px' }, `${t('ov.toRealtime')} →`)), tail.el)),
  );

  const pollMetrics = async () => {
    const m = await api('GET', '/api/metrics');
    const diff = absorbMetrics(model, m);
    if (diff.restarted) header.restarted(m.gateway.startedAt);
    if (diff.reset) {
      const asked = Date.now();
      absorbApps(model, await api('GET', '/api/apps'), asked);
    }
    if (diff.initial) tail.seed(diff.fresh);
    else tail.push(diff);
    const moved = diff.initial || diff.fresh.length > 0 || diff.restarted;
    if (moved && !diff.initial) header.beat();
    render(!diff.initial, moved);
  };
  const pollApps = async () => {
    if (!model.metrics) return;
    const asked = Date.now();
    absorbApps(model, await api('GET', '/api/apps'), asked);
    render(true, true);
  };
  let paintedAt = 0;
  const render = (animate, moved) => {
    header.seen(model.events.at(-1)?.t);
    services.render(model.metrics);
    seats.render(model, animate);
    gate.render(model, animate);
    host.render(model.metrics);
    const awake = [...model.transitions.keys()].some((n) => ACTIVE.includes(stateOf(model, n)));
    if (moved || awake || Date.now() - paintedAt > 60_000) {
      lane.render(model, animate);
      paintedAt = Date.now();
    }
    charts.forEach((c) => c.set(model));
    inbox.render(model, animate);
  };
  const refresh = header.guarded(pollMetrics);
  return { loops: [[METRICS_MS, refresh], [APPS_MS, header.guarded(pollApps)]], first: refresh };
}

// Realtime (ADR 0016): the request ring and the event ring, read by cursor, under one filter.

const REQUESTS_MS = 1000;
const REQUEST_PAGE = 1000;
const KEEP_REQUESTS = 5000;
const REQUEST_ROWS = 1000;
const RATE_WINDOW_MS = 10_000;
const HISTORY_S = 60;
const WATERFALL_MS = 30_000;
const FILTER_KEYS = ['app', 'kind', 'status', 'path', 'subject', 'cold', 'error'];
const FILTER_HINTS = ['app:', 'kind:', 'status:5xx', 'path:', 'subject:', 'cold:true', 'error:true'];

/** Whitespace-separated terms: `key:value` or a bare word matched as a substring. */
function parseFilter(text) {
  const terms = {};
  const words = [];
  const unknown = [];
  for (const token of text.toLowerCase().split(/\s+/).filter(Boolean)) {
    const [, key, value] = /^([a-z]+):(.*)$/.exec(token) ?? [];
    if (key === undefined) words.push(token);
    else if (!FILTER_KEYS.includes(key)) unknown.push(key);
    else if (value) (terms[key] ??= []).push(value);
  }
  return { terms, words, unknown };
}

/** Same as the Stats error count: a 5xx, or no answer at all. */
const requestFailed = (r) => r.status === 0 || r.status >= 500;
const lower = (v) => String(v ?? '').toLowerCase();
const statusIs = (status, v) => (/^[1-5]xx$/.test(v) ? Math.floor(status / 100) === Number(v[0]) : String(status) === v);
const requestText = (r) => `${r.app} ${r.kind} ${r.method} ${r.path} ${r.status} ${r.subject ?? ''} ${r.error ?? ''}`.toLowerCase();

const REQUEST_TERMS = {
  app: (r, v) => lower(r.app).startsWith(v),
  kind: (r, v) => r.kind === v,
  status: (r, v) => statusIs(r.status, v),
  path: (r, v) => lower(r.path).includes(v),
  subject: (r, v) => lower(r.subject).includes(v),
  cold: (r, v) => String(r.cold) === v,
  error: (r, v) => String(requestFailed(r)) === v,
};
const EVENT_TERMS = {
  app: (e, v) => lower(e.app).startsWith(v),
  error: (e, v) => String(eventTone(e) === 'red') === v,
};

/** Values of one key are alternatives; keys and bare words must all hold. A key the stream has no field for does not narrow it. */
function matcher(filter, table, text) {
  const terms = Object.entries(filter.terms).filter(([key]) => table[key]);
  return (item) => terms.every(([key, values]) => values.some((v) => table[key](item, v))) && filter.words.every((w) => text(item).includes(w));
}

function filterState() {
  const params = new URLSearchParams(location.hash.split('?')[1] ?? '');
  return { text: params.get('q') ?? '', errors: params.get('errors') === '1', hideStatic: params.get('static') === '0' };
}

function writeFilterState(state) {
  const params = new URLSearchParams();
  if (state.text.trim()) params.set('q', state.text.trim());
  if (state.errors) params.set('errors', '1');
  if (state.hideStatic) params.set('static', '0');
  const query = params.toString();
  history.replaceState(null, '', `#/realtime${query ? `?${query}` : ''}`);
}

const statusTone = (s) => (s === 0 || s >= 500 ? 'red' : s >= 400 ? 'orange' : s >= 300 ? 'muted' : s < 200 ? 'accent' : 'green');
const took = (v) => (v >= 60_000 ? `${new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(v / 60_000)} min` : ms(v));
const reach = (v) => Math.min(1, Math.log10(1 + v) / Math.log10(1 + WATERFALL_MS));
/** The path below the app's address, as the app's routes read it; the full path stays in the detail. */
const appRelative = (r) => (r.path.startsWith(`/apps/${r.app}/`) ? r.path.slice(`/apps/${r.app}`.length) : r.path);

function filterBar(state, onChange) {
  const input = h('input', {
    type: 'search', value: state.text, placeholder: t('rt.placeholder'), 'aria-label': t('rt.filter'), spellcheck: 'false', autocomplete: 'off',
    oninput: () => { state.text = input.value; changed(); },
  });
  const clear = h('button', { class: 'btn', type: 'button', onclick: () => { input.value = state.text = ''; changed(); input.focus(); } }, t('rt.clear'));
  const toggle = (key, label) => {
    const button = h('button', { type: 'button', class: 'tog', 'aria-pressed': String(state[key]), onclick: () => {
      state[key] = !state[key];
      button.setAttribute('aria-pressed', String(state[key]));
      changed();
    } }, h('span', { class: 'ck' }, icon('check')), t(label));
    return button;
  };
  const warn = h('div', { class: 'fwarn', role: 'status' });
  const add = (term) => {
    const tokens = input.value.trim().split(/\s+/).filter(Boolean);
    if (!tokens.includes(term)) tokens.push(term);
    input.value = state.text = tokens.join(' ');
    changed();
    input.focus();
  };
  /** Makes `name` the only app term, or clears it when it already is. */
  const pickApp = (name) => {
    const tokens = input.value.trim().split(/\s+/).filter(Boolean);
    const apps = tokens.filter((x) => x.startsWith('app:'));
    const rest = tokens.filter((x) => !x.startsWith('app:'));
    input.value = state.text = (apps.length === 1 && apps[0] === `app:${name}` ? rest : [...rest, `app:${name}`]).join(' ');
    changed();
  };
  const changed = () => {
    clear.hidden = !state.text;
    const parsed = parseFilter(state.text);
    warn.textContent = parsed.unknown.length ? t('rt.unknown', { keys: parsed.unknown.join(', '), known: FILTER_KEYS.join(' ') }) : '';
    onChange(parsed);
  };
  const el = h('div', { class: 'card fbar', 'data-section': 'filter' },
    h('div', { class: 'fline' },
      h('label', { class: 'q' }, icon('search'), input),
      clear,
      h('span', { class: 'togs' }, toggle('errors', 'rt.errorsOnly'), toggle('hideStatic', 'rt.hideStatic'))),
    h('div', { class: 'fkeys' }, h('span', {}, t('rt.keys')), FILTER_HINTS.map((hint) => h('button', { type: 'button', onclick: () => add(hint) }, hint))),
    warn);
  return { el, add, pickApp, changed };
}

/** Three live numbers and a per-second histogram over the last minute, all over the records the filter keeps. */
function pulseStrip() {
  const cell = (key) => ({ key, v: h('div', { class: 'v' }), s: h('div', { class: 's' }) });
  const cells = [cell('rate'), cell('errors'), cell('sockets')];
  const bars = Array.from({ length: HISTORY_S }, () => {
    const ok = h('b', { class: 'ok' });
    const bad = h('b', { class: 'bad' });
    return { el: h('i', {}, ok, bad), ok, bad };
  });
  const top = h('span', { class: 'num' });
  const scope = h('span', { class: 'on' });
  const el = h('div', { class: 'card pulse', 'data-section': 'pulse' },
    cells.map((c) => h('div', { class: 'pn' }, h('div', { class: 'l' }, t(`rt.${c.key}`)), c.v, c.s)),
    h('div', { class: 'ph' },
      h('div', { class: 'l' }, t('rt.hist'), top, scope),
      h('div', { class: 'hist', 'aria-hidden': 'true' }, bars.map((b) => b.el)),
      h('div', { class: 'haxis' }, h('span', {}, t('rt.ago', { n: HISTORY_S })), h('span', {}, t('rt.ago', { n: HISTORY_S / 2 })), h('span', {}, t('tl.now')))));
  return {
    el,
    render(records, match, sockets, filtered) {
      const now = Date.now();
      const end = Math.floor(now / 1000);
      const bins = bars.map(() => ({ n: 0, bad: 0 }));
      let recent = 0;
      let failed = 0;
      for (let i = records.length - 1; i >= 0; i--) {
        const r = records[i];
        if (r.t < now - HISTORY_S * 1000) break;
        if (!match(r)) continue;
        const bin = bins[Math.min(HISTORY_S - 1, HISTORY_S - 1 - (end - Math.floor(r.t / 1000)))];
        if (bin) {
          bin.n++;
          if (requestFailed(r)) bin.bad++;
        }
        if (r.t >= now - RATE_WINDOW_MS) recent++;
        if (requestFailed(r)) failed++;
      }
      scope.textContent = filtered ? ` · ${t('rt.matching')}` : '';
      const [rate, errors, open] = cells;
      fill(rate.v, new Intl.NumberFormat(locale(), { maximumFractionDigits: 1, minimumFractionDigits: 1 }).format(recent / (RATE_WINDOW_MS / 1000)));
      fill(rate.s, t('rt.rateSub'));
      fill(errors.v, nf(failed));
      errors.v.classList.toggle('bad', failed > 0);
      fill(errors.s, t('rt.errorsSub'));
      fill(open.v, nf(sockets));
      fill(open.s, t('rt.socketsSub'));
      const max = niceMax(Math.max(...bins.map((b) => b.n)));
      top.textContent = ` · ${t('rt.peak', { n: nf(Math.max(...bins.map((b) => b.n))) })}`;
      bins.forEach((b, i) => {
        const bar = bars[i];
        bar.ok.style.height = `${((b.n - b.bad) / max) * 100}%`;
        bar.bad.style.height = `${(b.bad / max) * 100}%`;
        bar.el.classList.toggle('now', i === HISTORY_S - 1);
        bar.el.title = t('rt.histTip', { time: clock((end - (HISTORY_S - 1 - i)) * 1000, true), n: nf(b.n), e: nf(b.bad) });
      });
    },
  };
}

function realtime() {
  const filter = filterState();
  const model = liveModel();
  const page = { cursor: 0, seeded: false, skip: new Set(), records: [], parsed: parseFilter(filter.text) };
  const match = { request: () => true, event: () => true };
  const header = liveHeader('live.lastRequest', () => first());
  const pulse = pulseStrip();
  const column = (key) => h('span', { class: key }, t(`rt.c.${key}`));
  const requestHead = h('div', { class: 'rq hd', 'aria-hidden': 'true' }, ['tm', 'sc', 'mt', 'ap', 'pt', 'du', 'wf', 'sb'].map(column));

  const term = (text) => h('button', { type: 'button', class: 'term', title: t('rt.addFilter'), onclick: (e) => { e.stopPropagation(); bar.add(text); } }, `+ ${text}`);
  const detail = (r) => {
    const row = (key, ...value) => [h('dt', {}, t(`rt.f.${key}`)), h('dd', {}, value)];
    return h('div', { class: 'rqd' }, h('dl', {},
      row('seq', `#${nf(r.seq)}`, h('span', { class: 'muted' }, `${new Intl.DateTimeFormat(locale(), { dateStyle: 'medium' }).format(r.t)} ${clock(r.t, true)}.${String(r.t % 1000).padStart(3, '0')}`)),
      row('app', appLink(r.app), term(`app:${r.app}`)),
      row('kind', r.kind, term(`kind:${r.kind}`)),
      row('request', `${r.method} ${r.path}`),
      row('status', h('span', { class: `sc ${statusTone(r.status)}` }, r.status === 0 ? t('rt.noAnswer') : String(r.status)), term(`status:${r.status === 0 ? 0 : `${Math.floor(r.status / 100)}xx`}`)),
      row(r.kind === 'ws' ? 'open' : 'ms', took(r.ms)),
      row('wait', r.waitMs == null ? '-' : [ms(r.waitMs), h('span', { class: 'muted' }, t('rt.f.waitHint'))]),
      row('cold', r.cold ? [h('span', { class: 'cold' }, t('yes')), term('cold:true')] : t('no')),
      row('subject', r.subject ?? '-', r.subject ? term(`subject:${r.subject}`) : null),
      row('error', r.error ? h('span', { class: 'er' }, r.error) : '-')));
  };
  const requestLine = (entry) => {
    const r = entry.item;
    const failed = requestFailed(r);
    const rel = appRelative(r);
    const wait = r.waitMs ?? 0;
    const width = reach(r.ms) * 100;
    const row = h('div', {
      class: `rq${failed ? ' failed' : ''}`, role: 'button', tabindex: '0', 'aria-expanded': String(Boolean(entry.open)),
      title: r.error ?? null,
      onclick: () => toggle(),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } },
    },
      h('span', { class: 'tm' }, clock(r.t, true)),
      h('span', { class: `sc ${statusTone(r.status)}` }, r.status === 0 ? 'ERR' : String(r.status)),
      h('span', { class: 'mt' }, r.method),
      h('span', { class: 'ap' }, r.app),
      h('span', { class: 'pt' },
        r.kind === 'request' ? null : h('span', { class: `chip k ${r.kind}` }, r.kind),
        r.cold ? h('span', { class: 'cold' }, t('rt.cold', { ms: ms(r.waitMs) })) : null,
        h('span', { class: 'p' }, rel),
        r.error ? h('span', { class: 'er' }, r.error) : null),
      h('span', { class: `du${r.kind !== 'ws' && r.ms > COLD_START_GATE_MS ? ' slow' : ''}` }, took(r.ms)),
      h('span', { class: 'wf', title: r.waitMs == null ? took(r.ms) : `${t('rt.f.wait')} ${ms(r.waitMs)} · ${took(r.ms)}` },
        h('i', { class: `w${r.cold ? ' cold' : ''}`, style: `width:${r.ms ? (width * Math.min(wait, r.ms)) / r.ms : 0}%` }),
        h('i', { class: `r${failed ? ' bad' : r.kind === 'ws' ? ' ch' : ''}`, style: `width:${r.ms ? (width * (r.ms - Math.min(wait, r.ms))) / r.ms : 0}%` })),
      h('span', { class: 'sb' }, r.subject ?? ''));
    const wrap = h('div', { class: `rqx${entry.open ? ' open' : ''}` }, row, entry.open ? detail(r) : null);
    const toggle = () => {
      entry.open = !entry.open;
      const next = requestLine(entry);
      wrap.replaceWith(next);
      next.firstChild.focus({ preventScroll: true });
    };
    return wrap;
  };

  const requests = follow({ line: requestLine, keep: KEEP_REQUESTS, limit: REQUEST_ROWS, empty: 'empty.requests', newKey: 'rt.new', head: requestHead, attrs: { class: 'reqs', 'data-section': 'requests' } });
  const events = follow({ line: eventLine, keep: KEEP_EVENTS, limit: TAIL_ROWS, empty: 'empty.events', newKey: 'tail.new', attrs: { 'data-section': 'events' } });
  const count = (stream) => {
    const el = h('span', { class: 'cnt' });
    stream.onChange(() => {
      const { shown, kept, waiting } = stream.counts;
      fill(el, waiting ? h('span', { class: 'hold' }, t('tail.paused')) : null, t('rt.shown', { shown: nf(shown), kept: nf(kept) }));
    });
    return el;
  };
  const requestCount = count(requests);
  const eventCount = count(events);

  const sockets = () => {
    const names = page.parsed.terms.app;
    return model.apps.filter((a) => !names || names.some((v) => a.name.startsWith(v))).reduce((sum, a) => sum + (a.leases?.channel ?? 0), 0);
  };
  const filtered = () => Boolean(filter.text.trim() || filter.errors || filter.hideStatic);
  /** Apps passing the app terms and, when anything else narrows, owning a matching record or (for error) event in the window. */
  const appShows = () => {
    const { terms, words } = page.parsed;
    const narrowed = words.length > 0 || filter.errors || Object.keys(terms).some((k) => k !== 'app');
    const from = Date.now() - SPAN_MS;
    const owners = new Set();
    if (narrowed) {
      for (const r of page.records) if (r.t >= from && match.request(r)) owners.add(r.app);
      if (filter.errors || terms.error) for (const e of model.events) if (e.app && e.t >= from && match.event(e)) owners.add(e.app);
    }
    return (name) => (!terms.app || terms.app.some((v) => name.startsWith(v))) && (!narrowed || owners.has(name));
  };
  let shows = () => true;
  const lane = timeline({
    shows: (name) => shows(name),
    pick: { set: (name) => bar.pickApp(name), is: (name) => page.parsed.terms.app?.length === 1 && page.parsed.terms.app[0] === name },
  });
  const renderLane = (animate) => {
    shows = appShows();
    lane.render(model, animate);
  };
  const renderPulse = () => pulse.render(page.records, match.request, sockets(), filtered());
  const bar = filterBar(filter, (parsed) => {
    page.parsed = parsed;
    const effective = filter.errors ? { ...parsed, terms: { ...parsed.terms, error: ['true'] } } : parsed;
    const request = matcher(effective, REQUEST_TERMS, requestText);
    match.request = filter.hideStatic ? (r) => r.kind !== 'static' && request(r) : request;
    match.event = matcher(effective, EVENT_TERMS, eventText);
    requests.setMatch(match.request);
    events.setMatch(match.event);
    writeFilterState(filter);
    renderPulse();
    if (model.metrics) renderLane(false);
  });
  bar.changed();

  show(
    h('div', { class: 'head rt-head' }, h('div', { class: 'grow' }, h('h1', {}, t('rt.title')), h('p', { class: 'sub' }, t('rt.sub'))), header.el),
    h('div', { class: 'rt-top' }, pulse.el, bar.el),
    h('section', { class: 'rt-lane' }, sectionHead(1, 'sec.timeline', 'rt.timelineDesc'), lane.el),
    h('section', { class: 'rt-streams' }, h('div', { class: 'rt-grid' },
      h('div', {}, sectionHead(2, 'rt.requests', 'rt.requestsDesc', requestCount), requests.el),
      h('div', {}, sectionHead(3, 'rt.events', 'rt.eventsDesc', eventCount), events.el))),
  );

  const pollRequests = async () => {
    for (let round = 0; round < 3; round++) {
      const batch = await api('GET', `/api/requests?after=${page.cursor}&limit=${REQUEST_PAGE}`);
      const missed = page.seeded && page.cursor > 0 && batch.length ? batch[0].seq - page.cursor - 1 : 0;
      if (batch.length) page.cursor = batch.at(-1).seq;
      const fresh = batch.filter((r) => !page.skip.has(r.seq));
      page.records.push(...fresh);
      page.records.splice(0, Math.max(0, page.records.length - KEEP_REQUESTS));
      if (!page.seeded) requests.seed(fresh);
      else if (fresh.length || missed > 0) {
        requests.push(missed > 0 ? [t('rt.gap', { n: nf(missed), ring: nf(REQUEST_PAGE) })] : [], fresh);
        header.beat();
      }
      page.seeded = true;
      if (batch.length < REQUEST_PAGE) break;
    }
    header.seen(page.records.at(-1)?.t);
    renderPulse();
  };
  const pollMetrics = async () => {
    const m = await api('GET', '/api/metrics');
    const diff = absorbMetrics(model, m);
    if (diff.restarted) {
      header.restarted(m.gateway.startedAt);
      // Records already read from the new process come again once the cursor starts over.
      page.skip = new Set(page.records.filter((r) => r.t >= m.gateway.startedAt).map((r) => r.seq));
      page.cursor = 0;
      requests.push([t('rt.restart')], []);
    }
    if (diff.reset) absorbApps(model, await api('GET', '/api/apps'), Date.now());
    if (diff.initial) events.seed(diff.fresh);
    else events.push(eventMarks(diff), diff.fresh);
    renderLane(!diff.initial);
  };
  const pollApps = async () => {
    if (!model.metrics) return;
    absorbApps(model, await api('GET', '/api/apps'), Date.now());
    renderPulse();
    renderLane(true);
  };
  const polls = [pollMetrics, pollRequests, pollApps].map((fn) => header.guarded(fn));
  const first = () => Promise.all(polls.map((fn) => fn()));
  return { loops: [[METRICS_MS, polls[0]], [REQUESTS_MS, polls[1]], [APPS_MS, polls[2]]], first };
}

const STATE_FILTERS = ['awake', 'waking', 'asleep', 'none', 'registered', 'removed', 'purging'];
let appsFilter = { text: '', state: '' };

async function projects() {
  const count = h('p', { class: 'sub' });
  const body = h('div');
  let apps = [];
  const text = h('input', { type: 'search', value: appsFilter.text, placeholder: t('apps.filter'), 'aria-label': t('apps.filter'), oninput: () => { appsFilter.text = text.value; render(); } });
  const state = h('select', { 'aria-label': t('col.state'), onchange: () => { appsFilter.state = state.value; render(); } },
    h('option', { value: '' }, t('apps.allStates')),
    STATE_FILTERS.map((s) => h('option', { value: s, selected: appsFilter.state === s }, t(`st.${s}`))));
  const render = () => {
    count.textContent = t('apps.count', { n: nf(apps.length) });
    const needle = appsFilter.text.trim().toLowerCase();
    const rows = apps.filter((a) => (!needle || a.name.includes(needle)) && (!appsFilter.state || a.status === appsFilter.state || a.instance === appsFilter.state));
    body.replaceChildren(apps.length === 0
      ? h('div', { class: 'card' }, h('div', { class: 'empty' }, t('apps.empty'), h('div', { style: 'margin-top:12px' }, h('a', { class: 'btn primary', href: '#/publish' }, t('apps.publish')))))
      : table(
        [['col.name'], ['col.status'], ['col.instance'], ['col.since'], ['col.release', 'r'], ['col.capabilities'], ['col.requests', 'r'], ['col.errors', 'r'], ['col.lastAccess']],
        rows.map((a) => ({ href: `#/apps/${encodeURIComponent(a.name)}`, cells: [
          appLink(a.name), status(a.status),
          h('span', { style: 'display:inline-flex;gap:8px;align-items:center' }, status(a.instance), leaseChips(a.leases)),
          a.since == null ? h('span', { class: 'muted' }, '-') : ago(a.since),
          h('span', { class: 'num' }, a.release == null ? '-' : `#${a.release}`),
          a.capabilities.length ? h('span', { class: 'chips' }, a.capabilities.map(chip)) : h('span', { class: 'muted' }, t('routeOnly')),
          h('span', { class: 'num' }, nf(a.requests)), h('span', { class: 'num' }, nf(a.errors)), ago(a.lastAccessAt),
        ] })),
        'empty.filtered'));
  };
  show(
    h('div', { class: 'head' }, h('div', { class: 'grow' }, h('h1', {}, t('apps.title')), count), h('a', { class: 'btn primary', href: '#/publish' }, t('apps.publish'))),
    h('section', {}, h('div', { class: 'toolbar' }, text, state), body),
  );
  return async function update() {
    apps = await api('GET', '/api/apps');
    render();
  };
}

function policyForm(app, effective, reload) {
  const override = app.policyOverride;
  const message = h('div', { class: 'msg', role: 'status' });
  const inputs = Object.fromEntries(POLICY_FIELDS.map((f) => [f, h('input', { type: 'number', min: 1, step: 1, name: f, value: override[f] ?? '', placeholder: String(effective[f]) })]));
  inputs.db_backend = h('select', { name: 'db_backend' },
    h('option', { value: '' }, t('p.default', { v: effective.db_backend })),
    DB_BACKENDS.map((b) => h('option', { value: b, selected: override.db_backend === b }, b)));
  const field = (f) => h('label', { class: 'field' },
    h('span', {}, t(`p.${f}`)), inputs[f],
    h('small', {}, h('span', { class: 'mono' }, f), ' · ', t('p.effective', { v: String(effective[f]) })));
  return h('form', { class: 'card form', onsubmit: async (event) => {
    event.preventDefault();
    message.className = 'msg';
    const patch = {};
    for (const [f, input] of Object.entries(inputs)) {
      const value = input.value === '' ? null : f === 'db_backend' ? input.value : Number(input.value);
      if (value !== (override[f] ?? null)) patch[f] = value;
    }
    if (Object.keys(patch).length === 0) return void (message.textContent = t('p.nothing'));
    try {
      await api('PUT', `${appPath(app.name)}/policy`, patch);
      await reload();
    } catch (error) {
      message.className = 'msg err';
      message.textContent = error.message;
    }
  } },
    h('div', { class: 'fields' }, POLICY_FIELDS.map(field), field('db_backend')),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'submit' }, t('p.save')), h('small', { class: 'muted' }, t('p.dbNote'))),
    message);
}

function logsPanel(name) {
  const pre = h('pre', { class: 'log' });
  const box = h('div', { class: 'inset' }, pre);
  let tail = Number(store.get('pneuma-space-tail')) || 100;
  const load = async () => {
    try {
      const text = await api('GET', `${appPath(name)}/logs?tail=${tail}`);
      pre.replaceChildren(text || h('div', { class: 'empty' }, t('empty.logs')));
      pre.scrollTop = pre.scrollHeight;
    } catch (error) {
      pre.textContent = error.message;
    }
  };
  const picker = h('span');
  const renderPicker = () => picker.replaceChildren(segmented([100, 500, 2000].map((n) => [n, nf(n)]), tail, (n) => {
    tail = n;
    store.set('pneuma-space-tail', String(n));
    renderPicker();
    load();
  }));
  renderPicker();
  load();
  return { box, controls: [picker, h('button', { class: 'btn', type: 'button', onclick: load }, t('logs.refresh'))] };
}

/** One beat per recent state change of the app, oldest on the left. */
function stateStrip(events, name) {
  const changes = events.filter((e) => e.app === name && INSTANCE_EVENTS.includes(e.ev));
  if (!changes.length) return null;
  return h('div', { class: 'beats', role: 'img', 'aria-label': t('d.recent') },
    changes.map((e, i) => {
      const failed = e.ev === 'asleep' && e.error !== undefined && changes[i - 1]?.ev === 'waking';
      return h('i', {
        class: failed ? 'fail' : e.ev,
        title: `${clock(e.t, true)} · ${failed ? t('mk.wakeFailed') : t(`st.${e.ev === 'removed' ? 'none' : e.ev}`)}${typeof e.ms === 'number' ? ` · ${ms(e.ms)}` : ''}`,
      });
    }).slice(-48),
    h('span', { class: 'muted' }, t('d.recent')));
}

async function detail(name) {
  const [d, apps, m, health] = await Promise.all([api('GET', appPath(name)), api('GET', '/api/apps'), api('GET', '/api/metrics'), api('GET', '/api/health')]);
  const { app, releases, bindings, policy, stats, deliveries } = d;
  d.address = `/apps/${app.name}/`;
  const reload = () => route();
  const head = h('div', { class: 'grow' });
  const tiles = h('div', { class: 'tiles four' });
  const renderHead = (row, detailStats, events) => {
    const s = row ?? { instance: d.instance, since: null, leases: null };
    head.replaceChildren(
      h('a', { class: 'back', href: '#/apps' }, `← ${t('d.back')}`),
      h('h1', { class: 'mono', style: 'margin-top:12px' }, app.name),
      h('div', { class: 'meta' },
        status(app.status),
        app.status === 'registered' ? h('a', { href: ingressOrigin(health.ingressPort) + d.address, target: '_blank', rel: 'noopener', class: 'mono', title: t('d.open', { address: d.address }) }, d.address) : h('span', { class: 'mono muted' }, d.address),
        h('span', { style: 'display:inline-flex;gap:8px;align-items:center' }, status(s.instance), s.since != null ? h('span', { class: 'muted' }, t('d.since', { ago: ago(s.since).textContent })) : null, leaseChips(s.leases)),
        h('span', { class: 'muted' }, t('d.owner', { owner: app.owner }))),
      stateStrip(events, app.name));
    tiles.replaceChildren(
      tile(t('d.requests'), nf(detailStats.requests), ''),
      tile(t('d.errors'), nf(detailStats.errors), detailStats.requests ? pct(detailStats.errors / detailStats.requests) : ''),
      tile(t('d.lastAccess'), detailStats.lastAccessAt == null ? t('never') : ago(detailStats.lastAccessAt).textContent, detailStats.lastAccessAt == null ? '' : stamp(detailStats.lastAccessAt)),
      tile(t('d.release'), app.current == null ? '-' : `#${app.current}`, releases.length ? stamp(Math.max(...releases.map((r) => r.publishedAt))) : ''));
  };
  renderHead(apps.find((a) => a.name === app.name), stats, m.events);

  const act = (kind) => async () => {
    if (!(await confirmDialog(t(`d.${kind}Title`, { name: app.name }), t(`d.${kind}Body`), t(`d.${kind}`)))) return;
    try {
      await api('POST', `${appPath(app.name)}/${kind}`);
      if (kind === 'purge') location.hash = '#/apps';
      else await reload();
    } catch (error) {
      actionMessage.textContent = error.message;
    }
  };
  const actionMessage = h('div', { class: 'msg err', role: 'alert' });
  const logs = logsPanel(app.name);
  const current = (r) => r.number === app.current;
  show(
    h('div', { class: 'head' }, head,
      h('div', { style: 'display:grid;gap:8px;justify-items:end' },
        h('div', { class: 'actions' },
          h('a', { class: 'btn', href: `#/publish/${encodeURIComponent(app.name)}` }, t('d.publish')),
          h('button', { class: 'btn danger', type: 'button', disabled: app.status !== 'registered', onclick: act('remove') }, t('d.remove')),
          h('button', { class: 'btn danger', type: 'button', disabled: app.status !== 'removed', title: app.status === 'removed' ? null : t('d.purgeHint'), onclick: act('purge') }, t('d.purge'))),
        actionMessage)),
    h('section', { style: 'padding-top:0;border-top:0' }, tiles),
    h('section', {}, sectionHead(1, 'sec.policy', 'sec.policyDesc'), policyForm(app, policy, reload)),
    h('section', {}, sectionHead(2, 'sec.releases', 'sec.releasesDesc'), table(
      [['col.release', 'r'], ['col.image'], ['col.capabilities'], ['col.bundle'], ['col.published']],
      [...releases].sort((a, b) => b.number - a.number).map((r) => ({ cells: [
        h('span', { class: 'num' }, `#${r.number}`, current(r) ? h('span', { class: 'chip', style: 'margin-left:6px' }, t('r.current')) : null),
        h('span', { class: 'mono', title: r.image ?? '' }, r.image ? r.image.slice(0, 19) : '-'),
        Object.keys(r.manifest.capabilities).length ? h('span', { class: 'chips' }, Object.keys(r.manifest.capabilities).map(chip)) : h('span', { class: 'muted' }, t('routeOnly')),
        h('span', { class: 'mono', title: r.bundle ?? '' }, r.bundle ? r.bundle.slice(0, 12) : '-'),
        h('span', { title: stamp(r.publishedAt) }, ago(r.publishedAt)),
      ] })), 'empty.filtered')),
    h('section', {}, sectionHead(3, 'sec.bindings', 'sec.bindingsDesc'), table(
      [['col.kind'], ['col.provider'], ['col.state']],
      bindings.map((b) => ({ cells: [chip(b.kind), h('span', { class: 'mono' }, b.provider), status(b.state)] })), 'empty.bindings')),
    h('section', {}, sectionHead(4, 'sec.deliveries', 'sec.deliveriesDesc'), table(
      [['col.state'], ['col.trigger'], ['col.attempts', 'r'], ['col.scheduledFor'], ['col.created'], ['col.nextAttempt']],
      deliveries.map((x) => ({ cells: [
        status(x.state), h('span', { class: 'mono' }, x.trigger), h('span', { class: 'num' }, nf(x.attempts)),
        x.scheduledFor == null ? h('span', { class: 'muted' }, t('d.onDemand')) : h('span', { class: 'mono' }, stamp(x.scheduledFor)),
        ago(x.createdAt), x.state === 'due' ? ago(x.nextAttemptAt) : h('span', { class: 'muted' }, '-'),
      ] })), 'empty.deliveries')),
    h('section', {}, sectionHead(5, 'sec.logs', 'sec.logsDesc', ...logs.controls), logs.box),
  );
  return async function update() {
    const [fresh, list, now] = await Promise.all([api('GET', appPath(name)), api('GET', '/api/apps'), api('GET', '/api/metrics')]);
    renderHead(list.find((a) => a.name === app.name), fresh.stats, now.events);
  };
}

const ingressOrigin = (port) => `${location.protocol}//${location.hostname}:${port}`;

const FIELD_OF = [[/^app name/, 'name'], [/^subject/, 'owner'], [/^image|image "/, 'image'], [/^bundle|static is declared/, 'bundle']];

async function publish(prefill) {
  const apps = await api('GET', '/api/apps');
  const existing = new Set(apps.map((a) => a.name));
  const general = h('div', { class: 'msg err', role: 'alert' });
  const hint = (key) => h('small', {}, t(key));
  const err = () => h('small', { class: 'err', hidden: true });
  const make = (key, control, hintKey) => ({ control, error: err(), label: key, hintKey });
  const f = {
    name: make('f.name', h('input', { name: 'name', required: true, pattern: '[a-z][a-z0-9\\-]{0,39}', value: prefill ?? '', placeholder: 'survey', autocomplete: 'off', spellcheck: 'false' }), 'f.nameHint'),
    image: make('f.image', h('input', { name: 'image', placeholder: 'survey:latest', autocomplete: 'off', spellcheck: 'false' })),
    owner: make('f.owner', h('input', { name: 'owner', placeholder: 'user:ana', autocomplete: 'off', spellcheck: 'false' }), 'f.ownerHint'),
    manifest: make('f.manifest', h('textarea', { name: 'manifest', rows: 14, spellcheck: 'false' })),
    bundle: make('f.bundle', h('input', { name: 'bundle', type: 'file', accept: '.tar,application/x-tar' }), 'f.bundleHint'),
  };
  f.manifest.control.value = JSON.stringify(MANIFEST_EXAMPLE, null, 2);
  const label = (k) => h('label', { class: 'field', id: `field-${k}` }, h('span', {}, t(f[k].label)), f[k].control, f[k].hintKey ? hint(f[k].hintKey) : null, f[k].error);
  const fail = (k, text) => {
    f[k].error.textContent = text;
    f[k].error.hidden = false;
    f[k].control.setAttribute('aria-invalid', 'true');
    f[k].control.focus();
  };
  const ownerField = label('owner');
  const syncOwner = () => { ownerField.hidden = existing.has(f.name.control.value); };
  f.name.control.addEventListener('input', syncOwner);
  syncOwner();
  const submit = h('button', { class: 'btn primary', type: 'submit' }, t('f.submit'));

  const form = h('form', { class: 'card form', novalidate: true, onsubmit: async (event) => {
    event.preventDefault();
    general.textContent = '';
    for (const x of Object.values(f)) { x.error.hidden = true; x.control.removeAttribute('aria-invalid'); }
    let manifest;
    try {
      manifest = JSON.parse(f.manifest.control.value);
    } catch (error) {
      return fail('manifest', t('f.badJson', { msg: error.message }));
    }
    const name = f.name.control.value.trim();
    submit.disabled = true;
    submit.textContent = t('f.busy');
    try {
      const file = f.bundle.control.files[0];
      const bundle = file ? (await api('POST', '/api/bundles', file, 'application/x-tar')).bundle : null;
      const body = { image: f.image.control.value.trim() || null, manifest, bundle };
      if (!existing.has(name)) body.owner = f.owner.control.value.trim();
      await api('PUT', `${appPath(name)}/release`, body);
      location.hash = `#/apps/${encodeURIComponent(name)}`;
    } catch (error) {
      const field = !name ? 'name' : error.status === 400 || error.status === 404 ? FIELD_OF.find(([re]) => re.test(error.message))?.[1] ?? (error.status === 400 ? 'manifest' : null) : null;
      if (field) fail(field, error.message);
      else general.textContent = error.message;
    } finally {
      submit.disabled = false;
      submit.textContent = t('f.submit');
    }
  } },
    h('div', { class: 'fields' }, label('name'), label('image'), ownerField),
    label('manifest'),
    label('bundle'),
    h('div', { class: 'actions' }, submit),
    general);

  show(
    h('div', { class: 'head' }, h('div', { class: 'grow' }, h('h1', {}, prefill ? t('pub.titleFor', { name: prefill }) : t('pub.title')), h('p', { class: 'sub' }, t('pub.sub')))),
    h('section', {}, h('div', { class: 'split' }, form,
      h('div', { class: 'card' },
        h('div', { class: 'sh', style: 'margin:0' }, h('div', {}, h('h2', {}, t('pub.existing')), h('p', {}, t('pub.existingDesc')))),
        apps.length ? h('div', { class: 'picks' }, apps.map((a) => h('a', { href: `#/publish/${encodeURIComponent(a.name)}` }, h('span', {}, a.name), status(a.status))))
          : h('div', { class: 'empty' }, t('pub.none'))))),
  );
}

// Shell

function footer(startedAt) {
  document.getElementById('foot').textContent = startedAt ? t('aside.since', { time: stamp(startedAt) }) : '';
}

function shell() {
  const nav = document.querySelector('nav');
  const [, view] = location.hash.split('?')[0].split('/');
  const current = ['apps', 'publish', 'realtime'].includes(view) ? view : 'overview';
  nav.replaceChildren(h('div', { class: 'group' }, t('nav.group')),
    ...[['overview', '#/'], ['realtime', '#/realtime'], ['apps', '#/apps'], ['publish', '#/publish']].map(([key, href]) => h('a', { href, 'aria-current': key === current ? 'page' : null }, t(`nav.${key}`))));
  document.getElementById('brand-sub').textContent = t('brand.sub');
  const theme = root.dataset.theme;
  document.querySelector('.controls').replaceChildren(
    segmented([['light', icon('sun'), t('theme.light')], ['dark', icon('moon'), t('theme.dark')]], theme, (value) => {
      store.set('pneuma-space-theme', value);
      root.dataset.theme = value;
      shell();
    }, 'theme'),
    segmented([['zh', '中'], ['en', 'EN']], lang, (value) => {
      store.set('pneuma-space-lang', value);
      lang = root.lang = value;
      route();
    }, 'language'));
}

/** Each loop runs only while the tab is visible and stops when the route changes. */
function every(loops, gen) {
  const run = (ms, fn) => setTimeout(async () => {
    if (gen !== generation) return;
    if (!document.hidden) await fn().catch(() => {});
    run(ms, fn);
  }, ms);
  for (const [ms, fn] of loops) run(ms, fn);
  document.onvisibilitychange = () => { if (!document.hidden && gen === generation) for (const [, fn] of loops) fn().catch(() => {}); };
}

async function route() {
  const gen = ++generation;
  document.onvisibilitychange = null;
  crosshair.reset();
  shell();
  const [, view, name] = location.hash.split('?')[0].split('/');
  const target = name && decodeURIComponent(name);
  try {
    const live = view === 'apps' && target ? await detail(target)
      : view === 'apps' ? await projects()
        : view === 'publish' ? (await publish(target), null)
          : view === 'realtime' ? realtime()
            : await overview();
    if (gen !== generation) return;
    if (typeof live === 'function') {
      await live();
      if (gen === generation) every([[POLL_MS, live]], gen);
    } else if (live) {
      await live.first();
      if (gen === generation) every(live.loops, gen);
    }
  } catch (error) {
    show(h('div', { class: 'head' }, h('div', { class: 'grow' }, h('p', { class: 'msg err' }, t('err.load', { msg: error.message })), h('p', {}, h('a', { class: 'back', href: '#/apps' }, `← ${t('d.back')}`)))));
  }
}

setInterval(() => { if (!document.hidden) for (const el of document.querySelectorAll('[data-tick]')) el.tick?.(); }, 1000);
addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', shell);
route();
</script>
