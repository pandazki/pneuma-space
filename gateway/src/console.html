<title>PneumaSpace</title>
<script>
(() => {
  const root = document.documentElement;
  const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const media = matchMedia('(prefers-color-scheme: dark)');
  const apply = () => { root.dataset.theme = stored('pneuma-space-theme') ?? (media.matches ? 'dark' : 'light'); };
  apply();
  media.addEventListener('change', apply);
  const lang = stored('pneuma-space-lang') ?? navigator.language;
  root.lang = lang.startsWith('zh') ? 'zh' : 'en';
})();
</script>

* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  font: 14px/21px var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
  background: repeating-linear-gradient(-45deg, transparent 0 7px, var(--stripe) 7px 8px) var(--stripe-bg);
}
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
.frame { display: grid; grid-template-columns: 288px minmax(0, 1fr); max-width: 1568px; min-height: 100vh; margin: 0 auto; background: var(--page); box-shadow: var(--shadow-card); }
aside { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 28px; padding: 72px 28px 28px; border-right: 1px dashed var(--line); }

nav .group { font-size: 11.5px; color: var(--ink-3); padding: 0 8px 6px; }
nav a { font-size: 12.5px; color: var(--ink-2); padding: 5px 8px; border-radius: 7px; }
nav a:hover { background: var(--hover); text-decoration: none; }

main { min-width: 0; }

.sub { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-3); }
section { padding: 40px 32px; border-top: 1px dashed var(--line); }
.sh { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; margin-bottom: 16px; }
.sh .idx { font: 11px/18px var(--mono); color: var(--ink-3); }
.sh h2 { margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; }
.sh p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-3); }
.sh .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-card); padding: 16px; }
.inset { background: var(--canvas); border-radius: 14px; box-shadow: 0 0 0 1px var(--line); padding: 12px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--field); }
.seg button { border: 0; background: none; cursor: pointer; font-size: 11.5px; font-weight: 500; line-height: 18px; padding: 2px 8px; border-radius: 999px; color: var(--ink-3); display: inline-flex; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow-btn); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 12px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; background: var(--hover-2); color: var(--ink); }
.btn:hover { background: var(--line-strong); text-decoration: none; }
.btn.primary { background: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.danger { background: var(--red-tint); color: var(--red); }

input, select, textarea { background: var(--field); border: 0; border-radius: 8px; box-shadow: 0 0 0 1px var(--line-strong); font-size: 13px; height: 30px; padding: 0 10px; outline: none; min-width: 0; }
textarea { height: auto; padding: 8px 10px; font: 12px/18px var(--mono); resize: vertical; }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.chart { position: relative; }
.chart header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 2px 4px 8px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.picks { display: grid; gap: 2px; max-height: 520px; overflow: auto; margin: 8px -8px 0; }
.picks a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 7px; font: 12px var(--mono); color: var(--ink-2); }

dialog { border: 0; padding: 20px; border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: oklch(0% 0 0 / .3); }
dialog h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
dialog p { margin: 0 0 20px; font-size: 13px; color: var(--ink-2); }

@media (max-width: 900px) {

  aside { position: relative; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px; border-right: 0; border-bottom: 1px dashed var(--line); }
  .controls { position: static; order: 2; margin-left: auto; }
  nav { order: 3; width: 100%; display: flex; gap: 4px; }
  nav .group, .aside-foot { display: none; }
  .head { padding: 32px 20px 24px; }
  section { padding: 24px 20px; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .toolbar input { width: 100%; }
}

function t(key, vars) {
  let text = I18N[lang][key];
  if (text === undefined) {
    console.error(`missing i18n key ${key}`);
    text = key;
  }
  return vars ? text.replace(/\{(\w+)\}/g, (_, name) => vars[name]) : text;
}
const locale = () => (lang === 'zh' ? 'zh-CN' : 'en-US');
const nf = (n) => new Intl.NumberFormat(locale()).format(n);
const pct = (n) => new Intl.NumberFormat(locale(), { style: 'percent', maximumFractionDigits: 1 }).format(n);
const ms = (v) => (v == null ? '-' : v >= 1000 ? `${new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(v / 1000)} s` : `${nf(Math.round(v))} ms`);
const clock = (v, seconds) => new Intl.DateTimeFormat(locale(), { hour: '2-digit', minute: '2-digit', second: seconds ? '2-digit' : undefined, hour12: false }).format(v);
const stamp = (v) => new Intl.DateTimeFormat(locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(v);

function bytes(n) {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${new Intl.NumberFormat(locale(), { maximumFractionDigits: i > 2 ? 1 : 0 }).format(n)} ${units[i]}`;
}

function duration(span) {
  const s = Math.max(0, Math.floor(span / 1000));
  const parts = [['d', Math.floor(s / 86400)], ['h', Math.floor(s / 3600) % 24], ['m', Math.floor(s / 60) % 60], ['s', s % 60]];
  const first = parts.findIndex(([, n]) => n > 0);
  return parts.slice(first < 0 ? 3 : first, (first < 0 ? 3 : first) + 2).map(([unit, n]) => t(`dur.${unit}`, { n })).join(' ');
}

function ago(v) {
  if (v == null) return h('span', { class: 'muted' }, t('never'));
  const s = Math.round((v - Date.now()) / 1000);
  const [n, unit] = Math.abs(s) < 60 ? [s, 'second'] : Math.abs(s) < 3600 ? [Math.round(s / 60), 'minute'] : Math.abs(s) < 86400 ? [Math.round(s / 3600), 'hour'] : [Math.round(s / 86400), 'day'];
  return h('time', { datetime: new Date(v).toISOString(), title: stamp(v) }, new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' }).format(n, unit));
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? '' : value);
  }
  el.append(...children.flat(Infinity).filter((c) => c != null && c !== false));
  return el;
}

function svg(tag, attrs = {}, ...children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) if (value != null) el.setAttribute(key, value);
  el.append(...children);
  return el;
}

async function api(method, path, body, contentType = 'application/json') {
  const response = await fetch(path, {
    method,
    headers: body === undefined ? {} : { 'content-type': contentType },
    body: body === undefined || contentType !== 'application/json' ? body : JSON.stringify(body),
  });
  const text = await response.text();
  if (response.headers.get('content-type')?.startsWith('text/plain')) return text;
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw Object.assign(new Error(data?.error ?? `${response.status} ${response.statusText}`), { status: response.status });
  return data;
}

function confirmDialog(title, body, action) {

    const dialog = h('dialog', {},
      h('h3', {}, title), h('p', {}, body),
      h('form', { method: 'dialog', class: 'actions' },
        h('button', { class: 'btn', value: 'cancel', autofocus: true }, t('cancel')),

    dialog.addEventListener('close', () => { resolve(dialog.returnValue === 'ok'); dialog.remove(); });
    document.body.append(dialog);
    dialog.showModal();
  });
}

/** Sums minute buckets into bins: 1 h by minute, 6 h by 5 min, 24 h by 15 min. Latency bins take the median of minute medians. */
function binned(series, key, minutes) {
  const step = minutes === 60 ? 1 : minutes === 360 ? 5 : 15;
  const values = series[key].slice(-minutes);
  const out = [];
  for (let i = 0; i < values.length; i += step) {
    const chunk = values.slice(i, i + step);
    if (key === 'wakeP50Ms') {
      const present = chunk.filter((v) => v != null).sort((a, b) => a - b);
      out.push(present.length ? present[Math.floor(present.length / 2)] : null);
    } else out.push(chunk.reduce((a, b) => a + b, 0));
  }
  return { values: out, step };
}

function niceMax(v) {
  if (v <= 4) return 4;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

/** layers: [{ key, color, kind: 'area' | 'bar' | 'line', axis: 'left' | 'right' }] */
function chartCard(attrs, titleKey, layers) {
  const el = h('div', { class: 'inset chart', ...attrs });
  const tip = h('div', { class: 'tip', hidden: true });
  const plot = h('div', { style: 'position:relative' });
  let data = null;
  let hover = null;
  const draw = () => {
    if (!data) return;
    const width = Math.max(260, plot.clientWidth);
    const height = 150;
    const right = layers.some((l) => l.axis === 'right');
    const pad = { l: 34, r: right ? 46 : 8, t: 8, b: 20 };
    const binnedLayers = layers.map((l) => ({ ...l, ...binned(data.series, l.key, win) }));
    const count = binnedLayers[0].values.length;
    const step = binnedLayers[0].step;
    const start = data.series.start + (1440 - win) * 60000;
    const bw = (width - pad.l - pad.r) / count;
    const x = (i) => pad.l + bw * (i + 0.5);
    const maxOf = (axis) => niceMax(Math.max(0, ...binnedLayers.filter((l) => (l.axis ?? 'left') === axis).flatMap((l) => l.values.filter((v) => v != null))));
    const max = { left: maxOf('left'), right: right ? maxOf('right') : 1 };
    const y = (v, axis = 'left') => pad.t + (height - pad.t - pad.b) * (1 - v / max[axis]);
    const g = svg('svg', { viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': t(titleKey) });
    for (const f of [0, 0.5, 1]) {
      g.append(svg('line', { x1: pad.l, x2: width - pad.r, y1: y(max.left * f), y2: y(max.left * f), style: 'stroke:var(--line-soft)' }));
      g.append(svg('text', { x: pad.l - 6, y: y(max.left * f) + 4, 'text-anchor': 'end' }, nf(max.left * f)));
      if (right) g.append(svg('text', { x: width - pad.r + 6, y: y(max.right * f, 'right') + 4 }, ms(max.right * f)));
    }
    for (const f of [0, 1 / 3, 2 / 3, 1]) {
      const i = Math.min(count - 1, Math.round(f * (count - 1)));
      g.append(svg('text', { x: x(i), y: height - 4, 'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle' }, clock(start + i * step * 60000)));
    }
    for (const l of binnedLayers) {
      const axis = l.axis ?? 'left';
      if (l.kind === 'bar') {
        l.values.forEach((v, i) => v > 0 && g.append(svg('rect', { x: x(i) - Math.max(1, bw * 0.3), width: Math.max(2, bw * 0.6), y: y(v, axis), height: y(0) - y(v, axis), rx: 1, style: `fill:${l.color}` })));
        continue;
      }
      const points = l.values.map((v, i) => (v == null ? null : [x(i), y(v, axis)]));
      const runs = [];
      for (const p of points) if (p) (runs.at(-1)?.open ? runs.at(-1).pts.push(p) : runs.push({ open: true, pts: [p] })); else if (runs.at(-1)) runs.at(-1).open = false;
      for (const { pts } of runs) {
        const line = pts.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
        if (l.kind === 'area' && pts.length > 1) g.append(svg('path', { d: `${line}L${pts.at(-1)[0].toFixed(1)},${y(0)}L${pts[0][0].toFixed(1)},${y(0)}Z`, style: `fill:${l.color};fill-opacity:.1` }));
        if (pts.length === 1) g.append(svg('circle', { cx: pts[0][0], cy: pts[0][1], r: 2, style: `fill:${l.color}` }));
        g.append(svg('path', { d: line, style: `fill:none;stroke:${l.color};stroke-width:${l.kind === 'line' ? 1.5 : 2};stroke-linejoin:round${l.dash ? ';stroke-dasharray:3 3' : ''}` }));
      }
    }
    const cross = svg('line', { y1: pad.t, y2: height - pad.b, style: 'stroke:var(--ink-3);stroke-width:1', visibility: 'hidden' });
    g.append(cross);
    const show = (px) => {
      const i = Math.max(0, Math.min(count - 1, Math.floor((px - pad.l) / bw)));
      hover = px;
      cross.setAttribute('x1', x(i));
      cross.setAttribute('x2', x(i));
      cross.setAttribute('visibility', 'visible');
      const from = start + i * step * 60000;
      tip.replaceChildren(
        h('div', { class: 'mono' }, step === 1 ? clock(from) : `${clock(from)}–${clock(from + step * 60000)}`),
        ...binnedLayers.map((l) => h('div', {}, h('span', { style: `color:${l.color}` }, '● '), `${t(`s.${l.key}`)} `, h('span', { class: 'mono' }, l.key === 'wakeP50Ms' ? ms(l.values[i]) : nf(l.values[i] ?? 0)))));
      tip.hidden = false;
      const left = x(i) + 12;
      tip.style.left = `${left + tip.offsetWidth > width ? x(i) - tip.offsetWidth - 12 : left}px`;
      tip.style.top = '4px';
    };
    g.addEventListener('pointermove', (e) => show(e.clientX - g.getBoundingClientRect().left));
    g.addEventListener('pointerleave', () => { hover = null; tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
    plot.replaceChildren(g, tip);
    if (hover != null) show(hover);
  };
  new ResizeObserver(draw).observe(plot);
  const legend = h('span', { style: 'display:inline-flex;gap:10px;flex-wrap:wrap' });
  el.append(h('header', {}, h('b', {}, t(titleKey)), legend), plot);
  return {
    el,
    set(next) {
      data = next;
      legend.replaceChildren(...layers.map((l) => {
        const total = l.key === 'wakeP50Ms' ? null : binned(next.series, l.key, win).values.reduce((a, b) => a + b, 0);
        return h('span', { class: 'legend' }, h('i', { style: `background:${l.color}` }), t(`s.${l.key}`), total == null ? null : h('span', { class: 'mono' }, nf(total)));
      }));
      draw();
    },
  };
}

function attentionRows(m) {
  const deliveries = m.deliveries.recentFailures.map((d) => ({
    at: d.at, app: d.app, what: status('failed'), label: t('att.delivery'),
    detail: [t('att.deliveryDetail', { trigger: d.trigger, attempts: d.attempts }), d.reason && ` · ${d.reason}`],
  }));
  // A request wake failure is logged twice (wake-failed and the runtime's asleep); the runtime line is kept.
  const errors = m.events.filter((e) => e.error !== undefined && e.ev !== 'wake-failed').map((e) => ({
    at: e.t, app: e.app, what: h('span', { class: 'st red' }, e.ev), detail: String(e.error),
  }));
  return [...deliveries, ...errors].sort((a, b) => b.at - a.at).map((r) => ({

  }));
}

function eventTone(e) {
  if (e.error !== undefined || e.ev === 'delivery.failed') return 'red';
  return tone(e.ev.replace(/^delivery\./, ''));
}

function eventFields(e) {
  return Object.entries(e).filter(([k]) => !['t', 'ev', 'app'].includes(k))
    .map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' ');
}

  syncOwner();
  const submit = h('button', { class: 'btn primary', type: 'submit' }, t('f.submit'));

  const form = h('form', { class: 'card form', novalidate: true, onsubmit: async (event) => {
    event.preventDefault();
    general.textContent = '';
    for (const x of Object.values(f)) { x.error.hidden = true; x.control.removeAttribute('aria-invalid'); }
    let manifest;
    try {
      manifest = JSON.parse(f.manifest.control.value);
    } catch (error) {
      return fail('manifest', t('f.badJson', { msg: error.message }));
    }
    const name = f.name.control.value.trim();
    submit.disabled = true;
    submit.textContent = t('f.busy');
    try {
      const file = f.bundle.control.files[0];
      const bundle = file ? (await api('POST', '/api/bundles', file, 'application/x-tar')).bundle : null;
      const body = { image: f.image.control.value.trim() || null, manifest, bundle };
      if (!existing.has(name)) body.owner = f.owner.control.value.trim();
      await api('PUT', `${appPath(name)}/release`, body);
      location.hash = `#/apps/${encodeURIComponent(name)}`;
    } catch (error) {
      const field = !name ? 'name' : error.status === 400 || error.status === 404 ? FIELD_OF.find(([re]) => re.test(error.message))?.[1] ?? (error.status === 400 ? 'manifest' : null) : null;
      if (field) fail(field, error.message);
      else general.textContent = error.message;
    } finally {
      submit.disabled = false;
      submit.textContent = t('f.submit');
    }
  } },
    h('div', { class: 'fields' }, label('name'), label('image'), ownerField),
    label('manifest'),
    label('bundle'),
    h('div', { class: 'actions' }, submit),
    general);

  show(
    h('div', { class: 'head' }, h('div', { class: 'grow' }, h('h1', {}, prefill ? t('pub.titleFor', { name: prefill }) : t('pub.title')), h('p', { class: 'sub' }, t('pub.sub')))),
    h('section', {}, h('div', { class: 'split' }, form,
      h('div', { class: 'card' },
        h('div', { class: 'sh', style: 'margin:0' }, h('div', {}, h('h2', {}, t('pub.existing')), h('p', {}, t('pub.existingDesc')))),
        apps.length ? h('div', { class: 'picks' }, apps.map((a) => h('a', { href: `#/publish/${encodeURIComponent(a.name)}` }, h('span', {}, a.name), status(a.status))))
          : h('div', { class: 'empty' }, t('pub.none'))))),
  );
}

// Shell

function footer(startedAt) {
  document.getElementById('foot').textContent = startedAt ? t('aside.since', { time: stamp(startedAt) }) : '';
}

function shell() {
  const nav = document.querySelector('nav');
  const [, view] = location.hash.split('/');
  const current = view === 'apps' ? 'apps' : view === 'publish' ? 'publish' : 'overview';
  nav.replaceChildren(h('div', { class: 'group' }, t('nav.group')),
    ...[['overview', '#/'], ['apps', '#/apps'], ['publish', '#/publish']].map(([key, href]) => h('a', { href, 'aria-current': key === current ? 'page' : null }, t(`nav.${key}`))));
  document.getElementById('brand-sub').textContent = t('brand.sub');
  const theme = root.dataset.theme;
  document.querySelector('.controls').replaceChildren(
    segmented([['light', icon('sun'), t('theme.light')], ['dark', icon('moon'), t('theme.dark')]], theme, (value) => {
      store.set('pneuma-space-theme', value);
      root.dataset.theme = value;
      shell();
    }, 'theme'),
    segmented([['zh', '中'], ['en', 'EN']], lang, (value) => {
      store.set('pneuma-space-lang', value);
      lang = root.lang = value;
      route();
    }, 'language'));
}

async function route() {
  clearInterval(poller);
  poller = null;
  shell();
  const [, view, name] = location.hash.split('/');
  const target = name && decodeURIComponent(name);
  try {
    const update = view === 'apps' && target ? await detail(target)
      : view === 'apps' ? await projects()
        : view === 'publish' ? (await publish(target), null)
          : await overview();
    if (update) {
      await update();
      poller = setInterval(() => { if (!document.hidden) update().catch(() => {}); }, POLL_MS);
      document.onvisibilitychange = () => { if (!document.hidden) update().catch(() => {}); };
    }
  } catch (error) {
    show(h('div', { class: 'head' }, h('div', { class: 'grow' }, h('p', { class: 'msg err' }, t('err.load', { msg: error.message })), h('p', {}, h('a', { class: 'back', href: '#/apps' }, `← ${t('d.back')}`)))));
  }
}

addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', shell);
route();
</script>
</body>
</html>
