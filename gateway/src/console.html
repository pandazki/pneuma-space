<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PneumaSpace</title>
<script>
(() => {
  const root = document.documentElement;
  const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const media = matchMedia('(prefers-color-scheme: dark)');
  const apply = () => { root.dataset.theme = stored('pneuma-space-theme') ?? (media.matches ? 'dark' : 'light'); };
  apply();
  media.addEventListener('change', apply);
  const lang = stored('pneuma-space-lang') ?? navigator.language;
  root.lang = lang.startsWith('zh') ? 'zh' : 'en';
  root.dataset.nav = stored('pneuma-space-nav') === 'rail' ? 'rail' : 'wide';
})();
</script>

const POLICY_FIELDS = ['idle_seconds', 'ready_timeout_seconds', 'drain_timeout_seconds', 'connection_idle_seconds', 'trigger_timeout_seconds'];
const DB_BACKENDS = ['sqlite', 'postgres'];
const LEASE_KINDS = ['request', 'channel', 'trigger'];
const AWAKE_GATE = 20;
const COLD_START_GATE_MS = 3000;
const POLL_MS = 5000;
const WINDOWS = [60, 360, 1440];
const MANIFEST_EXAMPLE = { contract: 1, capabilities: { files: {}, db: {}, identity: {} } };
const TONE = {
  green: ['registered', 'awake', 'active', 'done', 'up', 'unquarantined'],
  orange: ['waking', 'draining', 'stopping', 'purging', 'due', 'delivering'],
  red: ['failed', 'down', 'quarantined', 'crashed', 'hung'],
};

const root = document.documentElement;
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
};
let lang = root.lang;
let win = Number(store.get('pneuma-space-window')) || 60;

function t(key, vars) {
  let text = I18N[lang][key];
  if (text === undefined) {
    console.error(`missing i18n key ${key}`);
    text = key;
  }
  return vars ? text.replace(/\{(\w+)\}/g, (_, name) => vars[name]) : text;
}
const locale = () => (lang === 'zh' ? 'zh-CN' : 'en-US');
const nf = (n) => new Intl.NumberFormat(locale()).format(n);
/** A count in the key's plural form: `key.one` or `key.other`. */
const plural = (key, n) => t(`${key}.${new Intl.PluralRules(locale()).select(n) === 'one' ? 'one' : 'other'}`, { n: nf(n) });
const pct = (n) => new Intl.NumberFormat(locale(), { style: 'percent', maximumFractionDigits: 1 }).format(n);
const ms = (v) => (v == null ? '-' : v >= 1000 ? `${new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(v / 1000)} s` : `${nf(Math.round(v))} ms`);
const clock = (v, seconds) => new Intl.DateTimeFormat(locale(), { hour: '2-digit', minute: '2-digit', second: seconds ? '2-digit' : undefined, hour12: false }).format(v);
const stamp = (v) => new Intl.DateTimeFormat(locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(v);

function bytes(n) {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${new Intl.NumberFormat(locale(), { maximumFractionDigits: i > 2 ? 1 : 0 }).format(n)} ${units[i]}`;
}

function duration(span) {
  const s = Math.max(0, Math.floor(span / 1000));
  const parts = [['d', Math.floor(s / 86400)], ['h', Math.floor(s / 3600) % 24], ['m', Math.floor(s / 60) % 60], ['s', s % 60]];
  const first = parts.findIndex(([, n]) => n > 0);
  // Seconds only under a minute: "10 min 35 s" reads as precision nobody asked for.
  const shown = first < 0 ? [parts[3]] : first === 2 ? [parts[2]] : parts.slice(first, first + 2);
  return shown.map(([unit, n]) => t(`dur.${unit}`, { n })).join(' ');
}

/** A relative time in the console's own units, ticking each second; with `key`, the phrase whose {ago} it fills. */
function ago(v, key = null) {
  if (v == null) return h('span', { class: 'muted' }, t('never'));
  const text = () => (v > Date.now() ? t('in', { d: duration(v - Date.now()) }) : since(v));
  return h('time', { datetime: new Date(v).toISOString(), title: stamp(v) }, ticking(() => (key ? t(key, { ago: text() }) : text())));
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? '' : value);
  }
  el.append(...children.flat(Infinity).filter((c) => c != null && c !== false));
  return el;
}

function svg(tag, attrs = {}, ...children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) if (value != null) el.setAttribute(key, value);
  el.append(...children.filter((c) => c != null && c !== false));
  return el;
}

async function api(method, path, body, contentType = 'application/json') {
  const response = await fetch(path, {
    method,
    headers: body === undefined ? {} : { 'content-type': contentType },
    body: body === undefined || contentType !== 'application/json' ? body : JSON.stringify(body),
  });
  const text = await response.text();
  if (response.headers.get('content-type')?.startsWith('text/plain')) return text;
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw Object.assign(new Error(data?.error ?? `${response.status} ${response.statusText}`), { status: response.status });
  return data;
}

/**
 * A list that opens under its trigger and closes on Escape, a pick or a click outside; arrows move between its buttons.
 * `build(close)` returns the list element.
 */
function popover(wrap, button, build) {
  let list = null;
  const outside = (e) => { if (!wrap.contains(e.target)) close(); };
  const keys = (e) => {
    if (e.key === 'Escape') { close(); button.focus(); e.preventDefault(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const all = [...list.querySelectorAll('button:not([disabled]):not([hidden])')];
      all[(all.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : all.length - 1)) % all.length]?.focus();
      e.preventDefault();
    }
  };
  function close() {
    list?.remove();
    list = null;
    button.setAttribute('aria-expanded', 'false');
    document.removeEventListener('pointerdown', outside, true);
    document.removeEventListener('keydown', keys, true);
  }
  button.addEventListener('click', () => {
    if (list) return close();
    list = build(close);
    wrap.append(list);
    button.setAttribute('aria-expanded', 'true');
    (list.querySelector('input') ?? list.querySelector('[aria-selected="true"]') ?? list.querySelector('button:not([disabled])'))?.focus();
    document.addEventListener('pointerdown', outside, true);
    document.addEventListener('keydown', keys, true);
  });
  return close;
}

const ALL = '*';

const offeredOf = ({ me, tenants }) => (me.platformAdmin ? [ALL, ...tenants] : tenants);

async function loadSession() {
  const me = await api('GET', '/api/me');
  const [tenants, plane] = await Promise.all([
    me.local ? [] : me.platformAdmin ? api('GET', '/api/tenants').then((list) => list.map((x) => x.name)) : Object.keys(me.roles).sort(),

// Live overview (ADR 0015): consecutive snapshots are diffed in the browser and the diff drives every animation.

const METRICS_MS = 2000;
const APPS_MS = 5000;
const SPAN_MS = 15 * 60_000;
const AHEAD_MS = 60_000;
const KEEP_EVENTS = 600;
const TAIL_ROWS = 300;
const EVENT_RING = 100;
const FRESH_ROWS = 40;
/** The awake timeline draws only the apps whose state changed most recently (ADR 0016). */
const TIMELINE_ROWS = 10;
const ACTIVE = ['waking', 'awake', 'draining', 'stopping'];
const INSTANCE_EVENTS = ['waking', 'awake', 'draining', 'stopping', 'asleep', 'removed'];
const MARKS = {
  publish: { test: (e) => e.ev === 'publish', color: 'var(--ink-2)' },
  wake: { test: (e) => e.ev === 'awake' && typeof e.ms === 'number', color: 'var(--accent)' },
  wakeFailed: { test: (e, model) => model.wakeFailures.has(e), color: 'var(--red)' },
  deliveryFailed: { test: (e) => e.ev === 'delivery.failed', color: 'var(--red)' },
};

/** Everything the overview knows, folded from snapshots: the event history by id and each app's state transitions. */
function liveModel() {
  return { startedAt: null, lastId: 0, horizon: 0, events: [], transitions: new Map(), wakeFailures: new WeakSet(), metrics: null, cluster: null, apps: [], appsAt: 0, rates: new Map() };
}

function absorbMetrics(model, m) {
  const initial = model.startedAt === null;
  // Events live in the platform store, so a restart loses none and only marks the header; a replica that started earlier is no restart.
  const restarted = !initial && m.gateway.startedAt > model.startedAt;
  model.startedAt = Math.max(model.startedAt ?? 0, m.gateway.startedAt);
  const fresh = m.events.filter((e) => e.id > model.lastId);
  // Ids may skip, so only a full answer of nothing but fresh events can hide older ones.
  const full = m.events.length >= EVENT_RING;
  const missed = !initial && full && fresh.length === m.events.length ? Math.max(0, fresh[0].id - model.lastId - 1) : 0;
  const lost = missed > 0;
  const reset = initial || restarted || lost;
  if (initial || lost) {
    model.horizon = full ? m.events[0].t : Math.min(m.events[0]?.t ?? Infinity, m.gateway.startedAt);
    for (const [name, list] of model.transitions) {
      const kept = list.filter((s) => s.t >= model.horizon);
      if (kept.length) model.transitions.set(name, kept); else model.transitions.delete(name);
    }
  }
  if (fresh.length) model.lastId = fresh.at(-1).id;
  for (const e of fresh) {
    if (!e.app || !INSTANCE_EVENTS.includes(e.ev)) continue;
    const list = model.transitions.get(e.app) ?? [];
    // As in metrics.ts: a failed `docker stop` after a drain also emits asleep with an error, but after stopping.
    const failed = e.ev === 'asleep' && e.error !== undefined && list.at(-1)?.state === 'waking';
    if (failed) model.wakeFailures.add(e);
    list.push({ state: e.ev === 'removed' ? 'none' : e.ev, t: e.t, ms: e.ms, error: e.error, failed });
    let old = 0;
    while (old < list.length - 1 && list[old + 1].t < e.t - SPAN_MS) old++;
    list.splice(0, old);
    model.transitions.set(e.app, list);
  }
  model.events.push(...fresh);
  model.events.splice(0, Math.max(0, model.events.length - KEEP_EVENTS));
  model.metrics = m;
  return { initial, fresh, missed, restarted, reset };
}

/** The listing is the authority for every known app's current state unless an event seen for the app is newer than the request. */
function absorbApps(model, apps, asked) {
  const before = new Map(model.apps.map((a) => [a.name, a]));
  const listed = new Map(apps.map((a) => [a.name, a]));
  for (const a of apps) {
    const prev = before.get(a.name);
    if (prev && model.appsAt) model.rates.set(a.name, Math.max(0, a.requests - prev.requests) / ((asked - model.appsAt) / 1000));
  }
  for (const name of new Set([...listed.keys(), ...model.transitions.keys()])) {
    const a = listed.get(name);
    const state = a?.instance ?? 'none';
    const list = model.transitions.get(name) ?? [];
    const last = list.at(-1);
    const t = a?.since ?? asked;
    if (last ? last.state === state || t < last.t : state === 'none') continue;
    list.push({ state, t });
    model.transitions.set(name, list);
  }
  model.apps = apps;
  model.appsAt = asked;
}

/** Before the ring's horizon nothing is known; an app's state before its first transition is known only when that transition is a wake. */
const knownFrom = (list, horizon) => (list[0].state === 'waking' ? Math.min(horizon, list[0].t) : list[0].t);

const stateOf = (model, name) => model.transitions.get(name)?.at(-1)?.state ?? 'none';

/** One band per awake period, from the wake to the stop; draining and stopping are its tail. */
function segments(list, from, now) {
  const out = [];
  let band = null;
  list.forEach((s, i) => {
    const end = list[i + 1]?.t ?? now;
    if (ACTIVE.includes(s.state)) {
      band ??= { state: 'awake', from: s.t, tail: null };
      if (s.state === 'draining' || s.state === 'stopping') band.tail ??= s.t;
      if (typeof s.ms === 'number') band.ms = s.ms;
      band.to = end;
      band.open = i === list.length - 1;
      return;
    }
    if (band) out.push(band);
    band = null;
    if (s.failed) out.push({ state: 'fail', from: s.t, to: s.t, error: s.error, t: s.t });
  });
  if (band) out.push(band);
  return out.filter((b) => b.to >= from).map((b) => ({ ...b, from: Math.max(from, b.from), tail: b.tail && Math.max(from, b.tail) }));
}

const since = (v) => t('ago', { d: duration(Date.now() - v) });

/** Text that changes with the clock alone; refreshed once a second instead of re-rendering. */
function ticking(fn) {
  const el = h('span', { 'data-tick': '' });
  el.tick = () => { el.textContent = fn(); };
  el.tick();
  return el;
}

/** replaceChildren that, like h(), flattens arrays and skips null and false. */
function fill(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
}

/** Removing the class later matters only under prefers-reduced-motion, where the highlight is static. */
function flash(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  clearTimeout(el.flashed);
  el.flashed = setTimeout(() => el.classList.remove(cls), 1600);
}

/** The live indicator of a polling page: on, paused by the operator, or offline after a failed poll. `lastKey` names the latest arrival. */
function liveHeader(lastKey, onResume) {
  const dot = h('span', { class: 'dot' });
  const text = h('span');
  const button = h('button', { class: 'btn', type: 'button', onclick: () => {
    mode = mode === 'paused' ? 'on' : 'paused';
    render();
    if (mode === 'on') onResume();
  } });
  const el = h('div', { class: 'live', 'data-live': 'on', role: 'status' }, dot, text, button);
  let mode = 'on';
  let last = null;
  let restartedAt = null;
  const render = () => {
    el.dataset.live = mode;
    fill(button, t(mode === 'paused' ? 'live.resume' : 'live.pause'));
    fill(text,
      h('b', {}, t(`live.${mode}`)),
      mode === 'on' ? [' · ', ticking(() => (last ? t(lastKey, { ago: since(last) }) : t('live.none')))] : null,
      restartedAt && Date.now() - restartedAt < 120_000 ? h('span', { class: 'note' }, ` · ${t('live.restarted', { time: clock(restartedAt, true) })}`) : null);
  };
  render();
  return {
    el,
    restarted(at) { restartedAt = at; },
    seen(at) { last = at ?? last; render(); },
    beat() { flash(dot, 'beat'); },
    /** A poll that skips while paused or while its previous run is still out. */
    guarded(fn) {

        if (mode === 'paused' || busy) return;
        busy = true;
        try {
          await fn();
          if (mode === 'offline') { mode = 'on'; render(); }
        } catch {
          mode = 'offline';
          render();
        } finally {
          busy = false;
        }
      };
    },
  };
}

/** Sums minute buckets into bins: 1 h by minute, 6 h by 5 min, 24 h by 15 min. A latency bin is the mean over its wakes, since means merge and medians do not. */
function binned(series, key, minutes) {
  const step = minutes === 60 ? 1 : minutes === 360 ? 5 : 15;
  const values = series[key].slice(-minutes);
  const wakes = series.wakes.slice(-minutes);
  const out = [];
  for (let i = 0; i < values.length; i += step) {
    if (key === 'wakeMeanMs') {
      let n = 0, total = 0;
      for (let j = i; j < Math.min(i + step, values.length); j++) if (values[j] != null) { n += wakes[j]; total += values[j] * wakes[j]; }
      out.push(n ? total / n : null);
    } else out.push(values.slice(i, i + step).reduce((a, b) => a + b, 0));
  }
  return { values: out, step };
}

function niceMax(v) {
  if (v <= 4) return 4;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

/** One crosshair for every chart on the page: hovering one draws the line on all. */

/** layers: [{ key, color, kind: 'area' | 'bar' | 'line', axis: 'left' | 'right' }]; marks: keys of MARKS drawn in the lane above the plot. */
function chartCard(attrs, titleKey, layers, marks, extra = () => null) {
  const el = h('div', { class: 'inset chart', ...attrs });

  let model = null;

  const id = `c${Math.random().toString(36).slice(2, 8)}`;
  const draw = () => {
    if (!model) return;
    const series = model.metrics.series;
    const width = Math.max(260, plot.clientWidth);
    const height = 160;
    const right = layers.some((l) => l.axis === 'right');
    const pad = { l: 34, r: right ? 46 : 8, t: 18, b: 20 };
    const bins = layers.map((l) => ({ ...l, ...binned(series, l.key, win) }));
    const count = bins[0].values.length;
    const step = bins[0].step;
    const start = series.start + (1440 - win) * 60000;
    const binMs = step * 60000;
    const done = Math.min(1, (Date.now() - (start + (count - 1) * binMs)) / binMs);
    const bw = (width - pad.l - pad.r) / count;
    const x = (i) => pad.l + bw * (i + 0.5);
    const maxOf = (axis) => niceMax(Math.max(0, ...bins.filter((l) => (l.axis ?? 'left') === axis).flatMap((l) => l.values.filter((v) => v != null))));
    const max = { left: maxOf('left'), right: right ? maxOf('right') : 1 };
    const y = (v, axis = 'left') => pad.t + (height - pad.t - pad.b) * (1 - v / max[axis]);
    const g = svg('svg', { viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': t(titleKey) });
    const defs = svg('defs');
    for (const [n, l] of bins.entries()) {
      defs.append(svg('pattern', { id: `${id}-${n}`, width: 4, height: 4, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
        svg('rect', { width: 4, height: 4, style: `fill:${l.color};fill-opacity:.12` }),
        svg('line', { x1: 0, y1: 0, x2: 0, y2: 4, style: `stroke:${l.color};stroke-width:1.6` })));
    }
    g.append(defs);
    for (const f of [0, 0.5, 1]) {
      g.append(svg('line', { x1: pad.l, x2: width - pad.r, y1: y(max.left * f), y2: y(max.left * f), style: 'stroke:var(--line-soft)' }));
      g.append(svg('text', { x: pad.l - 6, y: y(max.left * f) + 4, 'text-anchor': 'end' }, nf(max.left * f)));
      if (right) g.append(svg('text', { x: width - pad.r + 6, y: y(max.right * f, 'right') + 4 }, ms(max.right * f)));
    }
    for (const f of [0, 1 / 3, 2 / 3, 1]) {
      const i = Math.min(count - 1, Math.round(f * (count - 1)));
      g.append(svg('text', { x: x(i), y: height - 4, 'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle' }, clock(start + i * binMs)));
    }
    const lastX = x(count - 1) - bw / 2;
    g.append(svg('rect', { x: lastX, y: pad.t, width: Math.max(1, bw * done), height: height - pad.t - pad.b, style: 'fill:var(--stripe)' }));
    for (const [n, l] of bins.entries()) {
      const axis = l.axis ?? 'left';
      const v = l.values;
      if (l.kind === 'bar') {
        v.forEach((value, i) => value > 0 && g.append(svg('rect', {
          x: x(i) - Math.max(1, bw * 0.3), width: Math.max(2, bw * 0.6), y: y(value, axis), height: y(0) - y(value, axis), rx: 1,
          style: i === count - 1 ? `fill:url(#${id}-${n});stroke:${l.color};stroke-width:1` : `fill:${l.color}`,
        })));
        continue;
      }
      const solid = l.kind === 'area' ? count - 1 : count;
      const points = v.slice(0, solid).map((value, i) => (value == null ? null : [x(i), y(value, axis)]));
      const runs = [];
      for (const p of points) if (p) (runs.at(-1)?.open ? runs.at(-1).pts.push(p) : runs.push({ open: true, pts: [p] })); else if (runs.at(-1)) runs.at(-1).open = false;
      for (const { pts } of runs) {
        const line = pts.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
        if (l.kind === 'area' && pts.length > 1) g.append(svg('path', { d: `${line}L${pts.at(-1)[0].toFixed(1)},${y(0)}L${pts[0][0].toFixed(1)},${y(0)}Z`, style: `fill:${l.color};fill-opacity:.1` }));
        if (pts.length === 1) g.append(svg('circle', { cx: pts[0][0], cy: pts[0][1], r: 2, style: `fill:${l.color}` }));
        g.append(svg('path', { d: line, style: `fill:none;stroke:${l.color};stroke-width:${l.kind === 'line' ? 1.5 : 2};stroke-linejoin:round${l.dash ? ';stroke-dasharray:3 3' : ''}` }));
      }
      if (l.kind === 'area' && v[count - 1] > 0) {
        g.append(svg('rect', { x: x(count - 1) - Math.max(1, bw * 0.3), width: Math.max(2, bw * 0.6), y: y(v[count - 1], axis), height: y(0) - y(v[count - 1], axis), rx: 1, style: `fill:url(#${id}-${n});stroke:${l.color};stroke-width:1` }));
      }
    }
    const binOf = (time) => Math.floor((time - start) / binMs);
    const lane = new Map();
    for (const e of model.events) {
      const i = binOf(e.t);
      if (i < 0 || i >= count) continue;
      for (const kind of marks) if (MARKS[kind].test(e, model)) {
        const key = `${i}:${kind}`;
        lane.set(key, { i, kind, n: (lane.get(key)?.n ?? 0) + 1 });
      }
    }
    const offsets = { publish: 0, wake: 0, wakeFailed: 6, deliveryFailed: 6 };
    for (const { i, kind } of lane.values()) {
      const cx = x(i) + (marks.length > 1 ? offsets[kind] - 3 : 0);
      const color = MARKS[kind].color;
      if (kind === 'publish') {
        g.append(svg('line', { x1: x(i), x2: x(i), y1: pad.t, y2: height - pad.b, style: 'stroke:var(--ink-3);stroke-dasharray:2 3' }));
        g.append(svg('path', { d: `M${x(i)},${pad.t - 10}l3.5,3.5l-3.5,3.5l-3.5,-3.5Z`, style: `fill:${color}` }));
      } else if (kind === 'wake') g.append(svg('rect', { x: cx - 1, y: pad.t - 11, width: 2, height: 7, rx: 1, style: `fill:${color}` }));
      else g.append(svg('circle', { cx, cy: pad.t - 7, r: 2.6, style: `fill:${color}` }));
    }
    const line = svg('line', { y1: pad.t - 12, y2: height - pad.b, style: 'stroke:var(--ink-3);stroke-width:1', visibility: 'hidden' });
    g.append(line);
    cross = (i) => {
      if (i == null) return void line.setAttribute('visibility', 'hidden');
      line.setAttribute('x1', x(i));
      line.setAttribute('x2', x(i));
      line.setAttribute('visibility', 'visible');
    };
    const show = (i) => {
      const from = start + i * binMs;
      const here = marks.map((kind) => [kind, lane.get(`${i}:${kind}`)?.n ?? 0]).filter(([, n]) => n > 0);
      fill(tip,
        h('div', { class: 'mono' }, step === 1 ? clock(from) : `${clock(from)}–${clock(from + binMs)}`, i === count - 1 ? ` · ${t('ch.partial')}` : ''),
        ...bins.map((l) => h('div', {}, h('span', { style: `color:${l.color}` }, '● '), `${t(`s.${l.key}`)} `, h('span', { class: 'mono' }, l.key === 'wakeMeanMs' ? ms(l.values[i]) : nf(l.values[i] ?? 0)))),
        ...here.map(([kind, n]) => h('div', {}, h('span', { style: `color:${MARKS[kind].color}` }, '◆ '), `${t(`mk.${kind}`)} `, h('span', { class: 'mono' }, nf(n)))));
      tip.hidden = false;
      const left = x(i) + 12;
      tip.style.left = `${left + tip.offsetWidth > width ? x(i) - tip.offsetWidth - 12 : left}px`;
      tip.style.top = '4px';
    };
    const index = (e) => Math.max(0, Math.min(count - 1, Math.floor((e.clientX - g.getBoundingClientRect().left - pad.l) / bw)));
    g.addEventListener('pointermove', (e) => { const i = index(e); crosshair.at(i); show(i); });
    g.addEventListener('pointerleave', () => { tip.hidden = true; crosshair.at(null); });
    fill(plot, g, tip);
  };
  const chart = { cross: (i) => cross(i), observer: new ResizeObserver(draw) };
  crosshair.charts.add(chart);
  chart.observer.observe(plot);
  el.append(h('header', {}, h('b', {}, t(titleKey)), legend), plot, note);
  return {
    el,
    set(next) {
      model = next;
      fill(legend, ...layers.map((l) => {
        const total = l.key === 'wakeMeanMs' ? null : binned(next.metrics.series, l.key, win).values.reduce((a, b) => a + b, 0);
        return h('span', { class: 'legend' }, h('i', { style: `background:${l.color}` }), t(`s.${l.key}`), total == null ? null : h('span', { class: 'mono' }, nf(total)));
      }));
      fill(note, extra(next));
      note.hidden = !note.childNodes.length;
      draw();
    },
  };
}

// Heat (ADR 0024 item 3): hourly usage rows as a grid in local time.

const HEAT_MS = 60_000;
const HOUR_MS = 3_600_000;
const APP_HEAT_DAYS = 14;
const HEAT_PITCH = 19;
const HEAT_CELL = 16;

const localHour = (v) => { const d = new Date(v); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()} ${d.getHours()}`; };
const hourSpan = (hour) => `${String(hour).padStart(2, '0')}:00–${String((hour + 1) % 24).padStart(2, '0')}:00`;

function addUsage(map, key, b) {
  const sum = map.get(key) ?? { requests: 0, errors: 0, wakes: 0 };
  sum.requests += b.requests;
  sum.errors += b.errors;
  sum.wakes += b.wakes;
  map.set(key, sum);
}

/** Seven rows from Monday, each hour summed over every such weekday in the buckets. */
function weekRows(buckets) {
  const sums = new Map();
  for (const b of buckets) { const d = new Date(b.start); addUsage(sums, `${d.getDay()}:${d.getHours()}`, b); }
  const monday = new Date(2024, 0, 1);
  return Array.from({ length: 7 }, (_, r) => {
    const day = new Date(monday.getFullYear(), 0, 1 + r);
    const label = new Intl.DateTimeFormat(locale(), { weekday: 'short' }).format(day);
    const long = new Intl.DateTimeFormat(locale(), { weekday: 'long' }).format(day);
    return { label, cells: Array.from({ length: 24 }, (_, hour) => ({ ...(sums.get(`${day.getDay()}:${hour}`) ?? { requests: 0, errors: 0, wakes: 0 }), when: `${long} ${hourSpan(hour)}` })) };
  });
}

/** The last `days` local days, today on top; an hour still to come is null. */
function dayRows(buckets, days) {
  const sums = new Map();
  for (const b of buckets) addUsage(sums, localHour(b.start), b);
  const now = Date.now();
  const today = new Date();
  return Array.from({ length: days }, (_, r) => {
    const day = new Date(today.getFullYear(), today.getMonth(), today.getDate() - r);
    const label = new Intl.DateTimeFormat(locale(), { month: '2-digit', day: '2-digit' }).format(day);
    const date = new Intl.DateTimeFormat(locale(), { dateStyle: 'medium' }).format(day);
    return { label, cells: Array.from({ length: 24 }, (_, hour) => {
      const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hour).getTime();
      return start > now ? null : { ...(sums.get(localHour(start)) ?? { requests: 0, errors: 0, wakes: 0 }), when: `${date} ${hourSpan(hour)}` };
    }) };
  });
}

/** rows: [{ label, cells: 24 × ({ requests, errors, wakes, when } | null) }]; shade grows with the square root of requests against the busiest cell. */
function heatGrid(titleKey) {
  const tip = h('div', { class: 'tip', hidden: true });
  const plot = h('div', { style: 'position:relative;flex:0 1 auto;width:100%;max-width:var(--w)' });
  const side = h('div', { class: 'side' });
  const el = h('div', { class: 'heat' }, plot, side);
  const scale = h('span', { class: 'scale' }, t('heat.less'), [0, 0.25, 0.5, 0.75, 1].map((f) => h('i', { style: f ? `background:var(--accent);opacity:${(0.18 + 0.82 * Math.sqrt(f)).toFixed(2)}` : 'background:var(--line)' })), t('heat.more'));
  return {
    el,
    set(rows, note = null) {
      const left = 44;
      const top = 16;
      const width = left + 24 * HEAT_PITCH;
      const height = top + rows.length * HEAT_PITCH;
      const cells = rows.flatMap((r) => r.cells.filter(Boolean));
      const max = Math.max(0, ...cells.map((c) => c.requests));
      const g = svg('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': t(titleKey) });
      for (const hour of [0, 6, 12, 18]) g.append(svg('text', { x: left + hour * HEAT_PITCH, y: 10 }, String(hour).padStart(2, '0')));
      let on = null;
      rows.forEach((row, r) => {
        g.append(svg('text', { x: left - 8, y: top + r * HEAT_PITCH + HEAT_CELL - 4, 'text-anchor': 'end' }, row.label));
        row.cells.forEach((c, hour) => {
          const style = !c ? 'fill:none;stroke:var(--line);stroke-dasharray:2 2'
            : c.requests > 0 ? `fill:var(--accent);fill-opacity:${(0.18 + 0.82 * Math.sqrt(c.requests / max)).toFixed(2)}` : 'fill:var(--line)';
          const rect = svg('rect', { class: c ? 'c' : null, x: left + hour * HEAT_PITCH, y: top + r * HEAT_PITCH, width: HEAT_CELL, height: HEAT_CELL, rx: 3, style });
          if (c) rect.addEventListener('pointerenter', () => {
            on?.classList.remove('on');
            (on = rect).classList.add('on');
            fill(tip, h('div', { class: 'mono' }, c.when), h('div', {}, ['requests', 'errors', 'wakes'].map((k, i) => [i ? ' · ' : '', `${t(`s.${k}`)} `, h('span', { class: 'mono' }, nf(c[k]))])));
            tip.hidden = false;
            const box = rect.getBoundingClientRect();
            const base = plot.getBoundingClientRect();
            const x = box.right - base.left + 8;
            const flipped = box.left - base.left - tip.offsetWidth - 8;
            tip.style.left = `${x + tip.offsetWidth <= base.width ? x : flipped >= 0 ? flipped : Math.max(0, base.width - tip.offsetWidth)}px`;
            tip.style.top = `${x + tip.offsetWidth <= base.width || flipped >= 0 ? box.top - base.top - 4 : box.bottom - base.top + 6}px`;
          });
          g.append(rect);
        });
      });
      g.addEventListener('pointerleave', () => { tip.hidden = true; on?.classList.remove('on'); on = null; });
      plot.style.setProperty('--w', `${width}px`);
      fill(plot, g, tip);
      const total = cells.reduce((sum, c) => sum + c.requests, 0);
      const peak = cells.reduce((best, c) => (c.requests > (best?.requests ?? 0) ? c : best), null);
      fill(side,
        h('div', {}, t('heat.total'), h('b', {}, nf(total))),
        peak ? h('div', {}, t('heat.peak'), h('b', { style: 'font-size:13px' }, peak.when)) : h('div', { class: 'muted' }, t('heat.none')),
        scale, note);
    },
  };
}

// Attention

const SEEN_KEY = 'pneuma-space-seen';
const loadSeen = () => { try { return new Set(JSON.parse(store.get(SEEN_KEY) ?? '[]')); } catch { return new Set(); } };

function attentionItems(model, downSince) {
  const m = model.metrics;
  // The sampler refreshes recentFailures every 10 s; the event carries the same failure within one poll.
  const failed = [
    ...m.deliveries.recentFailures,
    ...model.events.filter((e) => e.ev === 'delivery.failed').map((e) => ({ app: e.app, trigger: e.trigger, attempts: e.attempt, reason: e.reason, at: e.t })),
  ];
  const items = [...new Map(failed.map((d) => [`d:${d.app}:${d.trigger}:${d.at}`, d])).entries()].map(([id, d]) => ({
    id, group: `d:${d.app}:${d.trigger}`, tone: 'red', at: d.at, app: d.app,
    what: t('att.delivery'), why: [t('att.deliveryDetail', { trigger: d.trigger, attempts: d.attempts }), d.reason ? ` · ${d.reason}` : ''].join(''),
  }));
  for (const e of model.events) {
    if (e.ev === 'crashed' || e.ev === 'hung') {
      items.push({ id: `e:${e.ev}:${e.app}:${e.t}`, group: `e:${e.ev}:${e.app}`, tone: 'red', at: e.t, app: e.app, what: t(`att.${e.ev}`), why: String(e.reason ?? e.ev) });
      continue;
    }
    if (e.error === undefined || e.ev === 'wake-failed' || (e.ev === 'asleep' && !model.wakeFailures.has(e))) continue;
    const wake = e.ev === 'asleep';
    items.push({ id: `e:${e.ev}:${e.app}:${e.t}`, group: `e:${e.ev}:${e.app}`, tone: 'red', at: e.t, app: e.app, what: wake ? t('att.wake') : h('span', { class: 'mono' }, e.ev), why: String(e.error) });
  }
  for (const a of model.apps) {
    if (a.quarantine) items.push({ id: `q:${a.name}:${a.quarantine.since}`, group: `q:${a.name}`, tone: 'red', at: a.quarantine.since, app: a.name, what: t('att.quarantine'), why: a.quarantine.reason });
  }
  for (const [name, at] of downSince) items.push({ id: `s:${name}:${at}`, group: `s:${name}`, tone: 'red', at, app: null, what: t('att.service', { name: t(`svc.${name}`) }), why: t('att.serviceDetail') });
  const p95 = m.wakes.last1h.p95Ms;
  if (p95 != null && p95 > COLD_START_GATE_MS) {
    const hour = Math.floor(Date.now() / 3_600_000) * 3_600_000;
    items.push({ id: `p95:${hour}`, group: 'p95', tone: 'orange', at: hour, app: null, what: t('att.p95'), why: t('att.p95Detail', { p95: ms(p95) }) });
  }
  const groups = new Map();
  for (const item of items.sort((a, b) => b.at - a.at)) {
    const first = groups.get(item.group);
    if (first) first.count++;
    else groups.set(item.group, { ...item, count: 1 });
  }
  return [...groups.values()];
}

function attentionInbox() {
  const list = h('div', { class: 'card inbox' });
  const all = h('button', { class: 'btn ghost small', type: 'button', onclick: () => { for (const i of items) seen.add(i.id); save(); paint(false); } }, t('att.allSeen'));
  const el = h('div', { 'data-section': 'attention' }, list);
  const seen = loadSeen();
  const downSince = new Map();
  let items = [];
  let known = null;
  let open = false;
  const save = () => store.set(SEEN_KEY, JSON.stringify([...seen].slice(-300)));
  const row = (i, fresh) => h('div', { class: `item ${i.tone}${seen.has(i.id) ? ' seen' : ''}${fresh ? ' enter' : ''}` },
    h('div', { class: 'what' }, i.what, i.app ? appLink(i.app) : null, i.count > 1 ? h('span', { class: 'chip' }, `×${nf(i.count)}`) : null),
    h('div', { class: 'side', style: 'grid-row: span 2' },
      h('span', { title: stamp(i.at) }, clock(i.at, true)),
      seen.has(i.id) ? null : h('button', { class: 'btn ghost small', type: 'button', 'aria-label': `${t('att.seen')}: ${typeof i.what === 'string' ? i.what : ''} ${i.app ?? ''}`, onclick: () => { seen.add(i.id); save(); paint(false); } }, t('att.seen'))),
    h('div', { class: 'why' }, i.why));
  const paint = (animate) => {
    const unseen = items.filter((i) => !seen.has(i.id));
    const done = items.filter((i) => seen.has(i.id));
    const fresh = (i) => animate && known !== null && !known.has(i.id);
    fill(list,
      unseen.length ? unseen.map((i) => row(i, fresh(i))) : h('div', { class: 'empty' }, t('empty.attention')),
      done.length ? h('div', { class: 'item', style: 'display:block;padding:8px 14px' },
        h('button', { class: 'btn ghost small', type: 'button', 'aria-expanded': String(open), onclick: () => { open = !open; paint(false); } }, open ? t('att.hideSeen') : t('att.showSeen', { n: done.length }))) : null,
      open ? done.map((i) => row(i, false)) : null);
    all.hidden = unseen.length === 0;
    known = new Set(items.map((i) => i.id));
  };
  return {
    el,
    action: all,
    render(model, animate) {
      for (const [name, s] of Object.entries(model.metrics.services)) {
        if (s.status === 'down' && !downSince.has(name)) downSince.set(name, model.metrics.gateway.lastFlushAt ?? Date.now());
        if (s.status !== 'down') downSince.delete(name);
      }
      items = attentionItems(model, downSince);
      paint(animate);
    },
  };
}

// Event tail

function eventTone(e) {
  if (e.error !== undefined || e.ev === 'delivery.failed') return 'red';
  return tone(e.ev.replace(/^delivery\./, ''));
}

function eventFields(e) {
  return Object.entries(e).filter(([k]) => !['id', 't', 'ev', 'app', 'replica'].includes(k))
    .map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' ');
}

const eventText = (e) => `${e.ev} ${e.app ?? ''} ${eventFields(e)}`.toLowerCase();

function eventRow(e) {
  return h('div', { class: 'ev', title: `#${e.id} · ${e.replica} · ${stamp(e.t)}` },
    h('span', { class: 'mono' }, clock(e.t, true)),
    h('span', { class: `st ${eventTone(e)}` }, h('span', { class: 'mono' }, e.ev)),
    e.app ? appLink(e.app) : h('span', { class: 'muted' }, '-'),
    h('span', { class: 'f', title: eventFields(e) }, eventFields(e)));
}

const eventMarks = (diff) => (diff.missed > 0 ? [t('tail.gap', { n: nf(diff.missed) })] : []);

// Folding (docs/console.md, Streams): a cron tick is seven events a minute, so healthy cycles of one app become one line.

const WAKE_FAMILY = new Set(['waking', 'awake', 'draining', 'stopping', 'asleep', 'memory-clamped']);
const DELIVERY_FAMILY = new Set(['delivery.due', 'delivery.delivering', 'delivery.done', 'delivery.failed']);
const PLATFORM_RUNS = new Set(['leader']);
const SLEEP_SIDE = new Set(['draining', 'stopping', 'asleep']);

/** A cycle that delivered is its trigger's, whether or not it woke the app; one that only woke and slept is a wake. */
function cycleKind(c) {
  const done = c.events.find((e) => e.ev === 'delivery.done');
  if (done) return `trigger:${done.trigger}`;
  return c.woke && c.slept ? 'wake' : null;
}

/**
 * Consumes events oldest first and answers keyed line operations: { key, item } puts the line on top, replacing the line
 * with that key; { remove: key } takes it away. An item is { kind: 'event', e }, { kind: 'open', app, events } for a cycle
 * in progress, or { kind: 'run', app, cycle, cycles, events } for consecutive healthy cycles of one kind.
 */
function eventFolder() {
  const open = new Map();
  const runs = new Map();
  const raw = (e) => ({ key: `e:${e.id}`, item: { kind: 'event', e, events: [e] } });
  const extend = (scope, cycle, events, ops) => {
    const run = runs.get(scope);
    const next = run && run.cycle === cycle
      ? { ...run, cycles: [...run.cycles, events], events: [...run.events, ...events] }
      : { kind: 'run', key: `r:${events[0].id}`, app: events[0].app ?? null, replica: events[0].replica, cycle, cycles: [events], events };
    runs.set(scope, next);
    ops.push({ key: next.key, item: next });
  };
  const close = (app, c, ops) => {
    open.delete(app);
    ops.push({ remove: c.key });
    const kind = cycleKind(c);
    if (c.bad || kind === null) {
      runs.delete(app);
      for (const e of c.events) ops.push(raw(e));
    } else extend(app, kind, c.events, ops);
  };
  return (e) => {
    const ops = [];
    if (!e.app) {
      const scope = `p:${e.ev}:${e.replica}`;
      for (const key of runs.keys()) if (key.startsWith('p:') && key.endsWith(`:${e.replica}`) && key !== scope) runs.delete(key);
      if (PLATFORM_RUNS.has(e.ev) && e.error === undefined) extend(scope, e.ev, [e], ops);
      else ops.push(raw(e));
      return ops;
    }
    if (!WAKE_FAMILY.has(e.ev) && !DELIVERY_FAMILY.has(e.ev)) {
      const c = open.get(e.app);
      if (c) close(e.app, { ...c, bad: true }, ops);
      runs.delete(e.app);
      ops.push(raw(e));
      return ops;
    }
    let c = open.get(e.app);
    if (c && e.ev === 'delivery.due' && c.pending.size === 0 && c.woke && !c.slept) {
      close(e.app, c, ops);
      c = undefined;
    }
    c ??= { key: `c:${e.id}`, events: [], pending: new Set(), woke: false, slept: false, bad: false };
    open.set(e.app, c);
    c.events.push(e);
    if (e.error !== undefined || e.ev === 'delivery.failed' || (e.ev === 'delivery.due' && Number(e.attempt) > 0)) c.bad = true;
    if (e.ev === 'delivery.due' || e.ev === 'delivery.delivering') c.pending.add(e.delivery);
    if (e.ev === 'delivery.done' || e.ev === 'delivery.failed') c.pending.delete(e.delivery);
    if (e.ev === 'waking') c.woke = true;
    if (e.ev === 'asleep') c.slept = true;
    const quiet = c.pending.size === 0 && (c.slept || (!c.woke && !c.events.some((x) => SLEEP_SIDE.has(x.ev)) && c.events.some((x) => x.ev === 'delivery.done')));
    if (quiet || c.bad) close(e.app, c, ops);
    else ops.push({ key: c.key, item: { kind: 'open', app: e.app, events: [...c.events] } });
    return ops;
  };
}

const mean = (list) => (list.length ? list.reduce((n, v) => n + v, 0) / list.length : null);

/** What a run line says after its count: the mean wake latency, or the mean delivery time while the app was already up. */
function runMeta(item) {
  const wakes = item.events.filter((e) => e.ev === 'awake' && typeof e.ms === 'number').map((e) => e.ms);
  if (wakes.length) return t('fold.meanWake', { ms: ms(mean(wakes)) });
  const spans = item.cycles.map((c) => {
    const from = c.find((e) => e.ev === 'delivery.delivering')?.t;
    const to = c.find((e) => e.ev === 'delivery.done')?.t;
    return from != null && to != null ? to - from : null;
  }).filter((v) => v != null);
  return spans.length ? t('fold.meanDelivery', { ms: ms(mean(spans)) }) : null;
}

/** The event stream of the overview and the realtime page: folded lines that expand to their events, the filter applied to the events. */
function eventStream({ keep, limit, attrs }) {
  const expanded = new Set();
  let match = () => true;
  const line = (entry) => {
    const item = entry.item;
    if (item.kind === 'event') return eventRow(item.e);
    const last = item.events.at(-1);
    const shown = item.events.filter((e) => match(e));
    const isOpen = expanded.has(entry.key);
    const toggle = () => {
      if (isOpen) expanded.delete(entry.key); else expanded.add(entry.key);
      entry.redraw().firstChild.focus({ preventScroll: true });
    };
    const state = last.ev.startsWith('delivery.') ? 'delivering' : last.ev === 'memory-clamped' ? 'waking' : last.ev;
    const label = item.kind === 'open'
      ? h('span', { class: `st ${tone(state)}` }, t(`st.${state}`))
      : h('span', { class: 'st green' }, item.cycle.startsWith('trigger:') ? t('fold.trigger', { name: item.cycle.slice(8) }) : t(`fold.${item.cycle}`), h('b', { class: 'num' }, `×${nf(item.cycles.length)}`));
    const meta = item.kind === 'run' ? [runMeta(item), item.cycles.length > 1 ? t('fold.since', { time: clock(item.events[0].t) }) : null].filter(Boolean).join(' · ') : t('fold.started', { d: duration(Date.now() - item.events[0].t) });
    const wrap = h('div', { class: `evx${isOpen ? ' open' : ''}` },
      h('div', { class: 'ev fold', role: 'button', tabindex: '0', 'aria-expanded': String(isOpen), title: t('fold.expand'),
        onclick: toggle, onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } } },
        h('span', { class: 'mono' }, clock(last.t, true)),
        label,
        item.app ? appLink(item.app) : h('span', { class: 'mono muted' }, item.replica ?? '-'),
        h('span', { class: 'f' }, meta, h('span', { class: 'caret', 'aria-hidden': 'true' }, '›'))),
      isOpen ? h('div', { class: 'evs' }, [...shown].reverse().map(eventRow)) : null);
    return wrap;
  };
  const stream = follow({ line, keep, limit, hold: EVENT_RING, empty: 'empty.events', newKey: 'tail.new', attrs });
  const fold = eventFolder();
  const opsOf = (events) => events.flatMap(fold);
  return {
    el: stream.el,
    get counts() { return stream.counts; },
    onChange: (fn) => stream.onChange(fn),
    setMatch(fn) { match = fn; stream.setMatch((item) => item.events.some((e) => fn(e))); },
    seed: (events) => stream.seed(opsOf(events)),
    push: (marks, events) => stream.push(marks, opsOf(events)),
  };
}

/**
 * A newest-on-top stream that follows arrivals (ADR 0015): while the pointer is over it or it is scrolled down, new
 * entries wait behind a pill, at most `hold` of them, the gateway's ring for that stream. Arrivals are keyed operations:
 * { key, item } puts a line on top and replaces the line with that key; { remove: key } drops one. A mark (a gap, a
 * restart) shows whatever the filter.
 */
function follow({ line, keep, limit, hold, empty, newKey, attrs = {}, head = null }) {
  const rows = h('div', { class: 'rows' });
  const pill = h('button', { class: 'pill', type: 'button', hidden: true, onclick: () => { rows.scrollTo({ top: 0 }); hovering = false; flush(); } });
  const el = h('div', { ...attrs, class: `card tailbox ${attrs.class ?? ''}` }, pill, head, rows);
  let entries = [];
  let pending = [];
  const nodes = new Map();
  let marks = 0;
  let dropped = 0;
  let match = () => true;
  let hovering = false;
  let changed = () => {};
  const paused = () => hovering || rows.scrollTop > 4;
  const shows = (entry) => entry.mark !== undefined || match(entry.item);
  const node = (entry) => {
    const n = entry.mark !== undefined ? h('div', { class: 'ev mark' }, entry.mark) : line(entry);
    nodes.set(entry.key, n);
    entry.redraw = () => {
      const was = nodes.get(entry.key);
      const next = node(entry);
      was?.replaceWith(next);
      return next;
    };
    return n;
  };
  const placeholder = () => h('div', { class: 'empty' }, t(entries.some((e) => e.item) ? 'empty.filtered' : empty));
  const rebuild = () => {
    nodes.clear();
    const shown = [];
    for (const entry of entries) {
      if (shown.length >= limit) break;
      if (shows(entry)) shown.push(node(entry));
    }
    fill(rows, shown.length ? shown : placeholder());
    changed();
  };
  /** Applies operations oldest first to the entry list; answers the entries put on top, newest first. */
  const apply = (ops) => {
    const added = [];
    for (const op of ops) {
      const key = op.remove ?? op.key;
      const at = entries.findIndex((x) => x.key === key);
      if (at >= 0) entries.splice(at, 1);
      nodes.get(key)?.remove();
      nodes.delete(key);
      if (op.remove === undefined) { entries.unshift(op); added.push(op); }
    }
    for (const gone of entries.splice(keep)) nodes.delete(gone.key);
    const kept = new Set(entries);
    return added.filter((x) => kept.has(x)).reverse();
  };
  const flush = () => {
    pill.hidden = true;
    const ops = pending.splice(0);
    if (dropped) ops.push({ key: `m:${++marks}`, mark: t('tail.dropped', { n: nf(dropped) }) });
    dropped = 0;
    if (ops.length) {
      for (const old of rows.querySelectorAll('.fresh')) old.classList.remove('fresh');
      const shown = apply(ops).filter(shows).slice(0, limit);
      // A batch held back by a pause arrives at once; flashing hundreds of rows says nothing.
      const fresh = shown.map((entry) => {
        const n = node(entry);
        if (shown.length <= FRESH_ROWS) n.classList.add('fresh');
        return n;
      });
      if (fresh.length) rows.querySelector(':scope > .empty')?.remove();
      rows.prepend(...fresh);
      while (rows.children.length > limit) rows.lastChild.remove();
      if (!rows.children.length) rows.append(placeholder());
    }
    changed();
  };
  const waiting = () => new Set(pending.filter((p) => p.item && match(p.item)).map((p) => p.key)).size;
  rows.addEventListener('pointerenter', () => { hovering = true; });
  rows.addEventListener('pointerleave', () => { hovering = false; if (!paused()) flush(); });
  rows.addEventListener('scroll', () => { if (!paused()) flush(); }, { passive: true });
  return {
    el,
    /** Lines shown, lines kept, and how many matching ones wait behind the pill. */
    get counts() {
      return { shown: rows.querySelectorAll(':scope > :not(.mark):not(.empty)').length, kept: entries.filter((e) => e.item).length, waiting: waiting() };
    },
    onChange(fn) { changed = fn; },
    setMatch(fn) { match = fn; rebuild(); },
    seed(ops) {
      apply(ops);
      rebuild();
    },
    push(newMarks, ops) {
      for (const mark of newMarks) pending.push({ key: `m:${++marks}`, mark });
      pending.push(...ops);
      if (!paused()) return flush();
      const keys = new Set(pending.filter((p) => p.item).map((p) => p.key));
      if (keys.size > hold) {
        const over = new Set([...keys].slice(0, keys.size - hold));
        dropped += over.size;
        pending = pending.filter((p) => !over.has(p.key));
      }
      const n = waiting();
      pill.hidden = !n && !dropped;
      pill.textContent = [`↑ ${t(newKey, { n: nf(n) })}`, dropped && t('tail.dropped', { n: nf(dropped) })].filter(Boolean).join(' · ');
      changed();
    },
  };
}

function eventTail() {
  const stream = eventStream({ keep: TAIL_ROWS, limit: TAIL_ROWS, attrs: { 'data-section': 'tail' } });
  const filter = h('input', { type: 'search', name: 'filter', placeholder: t('ev.filter'), 'aria-label': t('ev.filter'), oninput: () => {
    const needle = filter.value.trim().toLowerCase();
    stream.setMatch((e) => !needle || eventText(e).includes(needle));
  } });
  const state = h('span', { class: 'muted' });
  stream.onChange(() => { state.textContent = stream.counts.waiting ? t('tail.paused') : ''; });
  return {
    el: h('div', { 'data-section': 'events' }, h('div', { class: 'tailhead' }, filter, state), stream.el),
    seed: (events) => stream.seed(events),
    push: (diff) => stream.push(eventMarks(diff), diff.fresh),
  };
}

// Realtime (ADR 0016): the request ring and the event ring, read by cursor, under one filter.

const REQUESTS_MS = 1000;
const REQUEST_RING = 1000;
const REQUEST_PAGE = 1000;
const KEEP_REQUESTS = 5000;
const REQUEST_ROWS = 1000;
const RATE_WINDOW_MS = 10_000;
const HISTORY_S = 60;
const WATERFALL_MS = 30_000;
const FILTER_KEYS = ['app', 'kind', 'status', 'path', 'subject', 'cold', 'error'];
const FILTER_HINTS = ['app:', 'kind:', 'status:5xx', 'path:', 'subject:', 'cold:true', 'error:true'];

/** Whitespace-separated terms: `key:value` or a bare word matched as a substring. */
function parseFilter(text) {
  const terms = {};
  const words = [];
  const unknown = [];
  for (const token of text.toLowerCase().split(/\s+/).filter(Boolean)) {
    const [, key, value] = /^([a-z]+):(.*)$/.exec(token) ?? [];
    if (key === undefined) words.push(token);
    else if (!FILTER_KEYS.includes(key)) unknown.push(key);
    else if (value) (terms[key] ??= []).push(value);
  }
  return { terms, words, unknown };
}

/** Same as the Stats error count: a 5xx, or no answer at all. */
const requestFailed = (r) => r.status === 0 || r.status >= 500;
const lower = (v) => String(v ?? '').toLowerCase();
const statusIs = (status, v) => (/^[1-5]xx$/.test(v) ? Math.floor(status / 100) === Number(v[0]) : String(status) === v);
const requestText = (r) => `${r.app} ${r.kind} ${r.method} ${r.path} ${r.status} ${r.subject ?? ''} ${r.error ?? ''}`.toLowerCase();

const REQUEST_TERMS = {
  app: (r, v) => lower(r.app).startsWith(v),
  kind: (r, v) => r.kind === v,
  status: (r, v) => statusIs(r.status, v),
  path: (r, v) => lower(r.path).includes(v),
  subject: (r, v) => lower(r.subject).includes(v),
  cold: (r, v) => String(r.cold) === v,
  error: (r, v) => String(requestFailed(r)) === v,
};
const EVENT_TERMS = {
  app: (e, v) => lower(e.app).startsWith(v),
  error: (e, v) => String(eventTone(e) === 'red') === v,
};

/** Values of one key are alternatives; keys and bare words must all hold. A key the stream has no field for does not narrow it. */
function matcher(filter, table, text) {
  const terms = Object.entries(filter.terms).filter(([key]) => table[key]);
  return (item) => terms.every(([key, values]) => values.some((v) => table[key](item, v))) && filter.words.every((w) => text(item).includes(w));
}

function filterState() {
  const params = new URLSearchParams(location.hash.split('?')[1] ?? '');
  return { text: params.get('q') ?? '', errors: params.get('errors') === '1', hideStatic: params.get('static') === '0' };
}

function writeFilterState(state) {
  const params = new URLSearchParams();
  if (state.text.trim()) params.set('q', state.text.trim());
  if (state.errors) params.set('errors', '1');
  if (state.hideStatic) params.set('static', '0');
  const query = params.toString();
  history.replaceState(null, '', `#/realtime${query ? `?${query}` : ''}`);
}

const statusTone = (s) => (s === 0 || s >= 500 ? 'red' : s >= 400 ? 'orange' : s >= 300 ? 'muted' : s < 200 ? 'accent' : 'green');
const took = (v) => (v >= 60_000 ? `${new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(v / 60_000)} min` : ms(v));
const reach = (v) => Math.min(1, Math.log10(1 + v) / Math.log10(1 + WATERFALL_MS));
/** The path below the app's address, as the app's routes read it; the full path stays in the detail. */
/** Under path addressing a request path carries the app's address as its prefix; under subdomains it is already relative. */
function appRelative(r, apps) {
  const address = apps.find((a) => a.name === r.app)?.address;
  return address?.startsWith('/') && r.path.startsWith(address) ? r.path.slice(address.length - 1) : r.path;
}

function filterBar(state, onChange) {
  const input = h('input', {
    type: 'search', name: 'filter', value: state.text, placeholder: t('rt.placeholder'), 'aria-label': t('rt.filter'), spellcheck: 'false', autocomplete: 'off',
    oninput: () => { state.text = input.value; changed(); },
  });
  const clear = h('button', { class: 'btn', type: 'button', onclick: () => { input.value = state.text = ''; changed(); input.focus(); } }, t('rt.clear'));
  const toggle = (key, label) => {
    const button = h('button', { type: 'button', class: 'tog', 'aria-pressed': String(state[key]), onclick: () => {
      state[key] = !state[key];
      button.setAttribute('aria-pressed', String(state[key]));
      changed();
    } }, h('span', { class: 'ck' }, icon('check')), t(label));
    return button;
  };
  const warn = h('div', { class: 'fwarn', role: 'status' });
  const add = (term) => {
    const tokens = input.value.trim().split(/\s+/).filter(Boolean);
    if (!tokens.includes(term)) tokens.push(term);
    input.value = state.text = tokens.join(' ');
    changed();
    input.focus();
  };
  /** Makes `name` the only app term, or clears it when it already is. */
  const pickApp = (name) => {
    const tokens = input.value.trim().split(/\s+/).filter(Boolean);
    const apps = tokens.filter((x) => x.startsWith('app:'));
    const rest = tokens.filter((x) => !x.startsWith('app:'));
    input.value = state.text = (apps.length === 1 && apps[0] === `app:${name}` ? rest : [...rest, `app:${name}`]).join(' ');
    changed();
  };
  const changed = () => {
    clear.hidden = !state.text;
    const parsed = parseFilter(state.text);
    warn.textContent = parsed.unknown.length ? t('rt.unknown', { keys: parsed.unknown.join(', '), known: FILTER_KEYS.join(' ') }) : '';
    onChange(parsed);
  };
  const el = h('div', { class: 'card fbar', 'data-section': 'filter' },
    h('div', { class: 'fline' },
      h('label', { class: 'q' }, icon('search'), input),
      clear,
      h('span', { class: 'togs' }, toggle('errors', 'rt.errorsOnly'), toggle('hideStatic', 'rt.hideStatic'))),
    h('div', { class: 'fkeys' }, h('span', {}, t('rt.keys')), FILTER_HINTS.map((hint) => h('button', { type: 'button', onclick: () => add(hint) }, hint))),
    warn);
  return { el, add, pickApp, changed };
}

/** Three live numbers and a per-second histogram over the last minute, all over the records the filter keeps. */
function pulseStrip() {
  const cell = (key) => ({ key, v: h('div', { class: 'v' }), s: h('div', { class: 's' }) });
  const cells = [cell('rate'), cell('errors'), cell('sockets')];
  const bars = Array.from({ length: HISTORY_S }, () => {
    const ok = h('b', { class: 'ok' });
    const bad = h('b', { class: 'bad' });
    return { el: h('i', {}, ok, bad), ok, bad };
  });
  const top = h('span', { class: 'num' });
  const scope = h('span', { class: 'on' });
  const el = h('div', { class: 'card pulse', 'data-section': 'pulse' },
    cells.map((c) => h('div', { class: 'pn' }, h('div', { class: 'l' }, t(`rt.${c.key}`)), c.v, c.s)),
    h('div', { class: 'ph' },
      h('div', { class: 'l' }, t('rt.hist'), top, scope),
      h('div', { class: 'hist', 'aria-hidden': 'true' }, bars.map((b) => b.el)),
      h('div', { class: 'haxis' }, h('span', {}, t('rt.ago', { n: HISTORY_S })), h('span', {}, t('rt.ago', { n: HISTORY_S / 2 })), h('span', {}, t('tl.now')))));
  return {
    el,
    render(records, match, sockets, filtered) {
      const now = Date.now();
      const end = Math.floor(now / 1000);
      const bins = bars.map(() => ({ n: 0, bad: 0 }));
      let recent = 0;
      let failed = 0;
      for (let i = records.length - 1; i >= 0; i--) {
        const r = records[i];
        if (r.t < now - HISTORY_S * 1000) break;
        if (!match(r)) continue;
        const bin = bins[Math.min(HISTORY_S - 1, HISTORY_S - 1 - (end - Math.floor(r.t / 1000)))];
        if (bin) {
          bin.n++;
          if (requestFailed(r)) bin.bad++;
        }
        if (r.t >= now - RATE_WINDOW_MS) recent++;
        if (requestFailed(r)) failed++;
      }
      scope.textContent = filtered ? ` · ${t('rt.matching')}` : '';
      const [rate, errors, open] = cells;
      fill(rate.v, new Intl.NumberFormat(locale(), { maximumFractionDigits: 1, minimumFractionDigits: 1 }).format(recent / (RATE_WINDOW_MS / 1000)));
      fill(rate.s, t('rt.rateSub'));
      fill(errors.v, nf(failed));
      errors.v.classList.toggle('bad', failed > 0);
      fill(errors.s, t('rt.errorsSub'));
      fill(open.v, nf(sockets));
      fill(open.s, t('rt.socketsSub'));
      const max = niceMax(Math.max(...bins.map((b) => b.n)));
      top.textContent = ` · ${t('rt.peak', { n: nf(Math.max(...bins.map((b) => b.n))) })}`;
      bins.forEach((b, i) => {
        const bar = bars[i];
        bar.ok.style.height = `${((b.n - b.bad) / max) * 100}%`;
        bar.bad.style.height = `${(b.bad / max) * 100}%`;
        bar.el.classList.toggle('now', i === HISTORY_S - 1);
        bar.el.title = t('rt.histTip', { time: clock((end - (HISTORY_S - 1 - i)) * 1000, true), n: nf(b.n), e: nf(b.bad) });
      });
    },
  };
}

function realtime() {
  const show = claim();
  const filter = filterState();
  const model = liveModel();
  const page = { cursor: '', seeded: false, last: new Map(), missing: new Set(), records: [], parsed: parseFilter(filter.text) };
  const match = { request: () => true, event: () => true };
  const header = liveHeader('live.lastRequest', () => first());
  const pulse = pulseStrip();
  const column = (key) => h('span', { class: key }, t(`rt.c.${key}`));
  const requestHead = h('div', { class: 'rq hd', 'aria-hidden': 'true' }, ['tm', 'sc', 'mt', 'ap', 'pt', 'du', 'wf', 'sb'].map(column));

  const term = (text) => h('button', { type: 'button', class: 'term', title: t('rt.addFilter'), onclick: (e) => { e.stopPropagation(); bar.add(text); } }, `+ ${text}`);
  const detail = (r) => {
    const row = (key, ...value) => [h('dt', {}, t(`rt.f.${key}`)), h('dd', {}, value)];
    return h('div', { class: 'rqd' }, h('dl', {},

      row('app', appLink(r.app), term(`app:${r.app}`)),

      row('status', h('span', { class: `sc ${statusTone(r.status)}` }, r.status === 0 ? t('rt.noAnswer') : String(r.status)), term(`status:${r.status === 0 ? 0 : `${Math.floor(r.status / 100)}xx`}`)),
      row(r.kind === 'ws' ? 'open' : 'ms', took(r.ms)),
      row('wait', r.waitMs == null ? '-' : [ms(r.waitMs), h('span', { class: 'muted' }, t('rt.f.waitHint'))]),
      row('cold', r.cold ? [h('span', { class: 'cold' }, t('yes')), term('cold:true')] : t('no')),
      row('subject', r.subject ?? '-', r.subject ? term(`subject:${r.subject}`) : null),
      row('error', r.error ? h('span', { class: 'er' }, r.error) : '-')));
  };
  const requestLine = (entry) => {
    const r = entry.item;
    const failed = requestFailed(r);
    const rel = appRelative(r, model.apps);
    const wait = r.waitMs ?? 0;
    const width = reach(r.ms) * 100;
    const row = h('div', {
      class: `rq${failed ? ' failed' : ''}`, role: 'button', tabindex: '0', 'aria-expanded': String(Boolean(entry.open)),
      title: r.error ?? null,
      onclick: () => toggle(),
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } },
    },
      h('span', { class: 'tm' }, clock(r.t, true)),
      h('span', { class: `sc ${statusTone(r.status)}` }, r.status === 0 ? 'ERR' : String(r.status)),
      h('span', { class: 'mt' }, r.method),
      h('span', { class: 'ap' }, r.app),
      h('span', { class: 'pt' },
        r.kind === 'request' ? null : h('span', { class: `chip k ${r.kind}` }, r.kind),
        r.cold ? h('span', { class: 'cold' }, t('rt.cold', { ms: ms(r.waitMs) })) : null,
        h('span', { class: 'p' }, rel),
        r.error ? h('span', { class: 'er' }, r.error) : null),
      h('span', { class: `du${r.kind !== 'ws' && r.ms > COLD_START_GATE_MS ? ' slow' : ''}` }, took(r.ms)),
      h('span', { class: 'wf', title: r.waitMs == null ? took(r.ms) : `${t('rt.f.wait')} ${ms(r.waitMs)} · ${took(r.ms)}` },
        h('i', { class: `w${r.cold ? ' cold' : ''}`, style: `width:${r.ms ? (width * Math.min(wait, r.ms)) / r.ms : 0}%` }),
        h('i', { class: `r${failed ? ' bad' : r.kind === 'ws' ? ' ch' : ''}`, style: `width:${r.ms ? (width * (r.ms - Math.min(wait, r.ms))) / r.ms : 0}%` })),
      h('span', { class: 'sb' }, r.subject ?? ''));
    const wrap = h('div', { class: `rqx${entry.open ? ' open' : ''}` }, row, entry.open ? detail(r) : null);
    const toggle = () => {
      entry.open = !entry.open;
      entry.redraw().firstChild.focus({ preventScroll: true });
    };
    return wrap;
  };

  const requests = follow({ line: requestLine, keep: KEEP_REQUESTS, limit: REQUEST_ROWS, hold: REQUEST_RING, empty: 'empty.requests', newKey: 'rt.new', head: requestHead, attrs: { class: 'reqs', 'data-section': 'requests' } });
  const events = eventStream({ keep: KEEP_EVENTS, limit: TAIL_ROWS, attrs: { 'data-section': 'realtime-events' } });
  const count = (stream) => {
    const el = h('span', { class: 'cnt' });
    stream.onChange(() => {
      const { shown, kept, waiting } = stream.counts;
      fill(el, waiting ? h('span', { class: 'hold' }, t('tail.paused')) : null, t('rt.shown', { shown: nf(shown), kept: nf(kept) }));
    });
    return el;
  };
  const requestCount = count(requests);
  const eventCount = count(events);

  const sockets = () => {
    const names = page.parsed.terms.app;
    return model.apps.filter((a) => !names || names.some((v) => a.name.startsWith(v))).reduce((sum, a) => sum + (a.leases?.channel ?? 0), 0);
  };
  const filtered = () => Boolean(filter.text.trim() || filter.errors || filter.hideStatic);
  /** Apps passing the app terms and, when anything else narrows, owning a matching record or (for error) event in the window. */
  const appShows = () => {
    const { terms, words } = page.parsed;
    const narrowed = words.length > 0 || filter.errors || Object.keys(terms).some((k) => k !== 'app');
    const from = Date.now() - SPAN_MS;
    const owners = new Set();
    if (narrowed) {
      for (const r of page.records) if (r.t >= from && match.request(r)) owners.add(r.app);
      if (filter.errors || terms.error) for (const e of model.events) if (e.app && e.t >= from && match.event(e)) owners.add(e.app);
    }
    return (name) => (!terms.app || terms.app.some((v) => name.startsWith(v))) && (!narrowed || owners.has(name));
  };
  let shows = () => true;
  const lane = timeline({
    shows: (name) => shows(name),
    pick: { set: (name) => bar.pickApp(name), is: (name) => page.parsed.terms.app?.length === 1 && page.parsed.terms.app[0] === name },
  });
  const renderLane = (animate) => {
    shows = appShows();
    lane.render(model, animate);
  };
  const renderPulse = () => pulse.render(page.records, match.request, sockets(), filtered());
  const bar = filterBar(filter, (parsed) => {
    page.parsed = parsed;
    const effective = filter.errors ? { ...parsed, terms: { ...parsed.terms, error: ['true'] } } : parsed;
    const request = matcher(effective, REQUEST_TERMS, requestText);
    match.request = filter.hideStatic ? (r) => r.kind !== 'static' && request(r) : request;
    match.event = matcher(effective, EVENT_TERMS, eventText);
    requests.setMatch(match.request);
    events.setMatch(match.event);
    writeFilterState(filter);
    renderPulse();
    if (model.metrics) renderLane(false);
  });
  bar.changed();

  show(
    h('div', { class: 'head rt-head' }, h('div', { class: 'grow' }, h('h1', {}, t('rt.title')), h('p', { class: 'sub' }, t('rt.sub'))), header.el),
    h('div', { class: 'rt-top' }, pulse.el, bar.el),
    h('section', { class: 'rt-lane' }, sectionHead(1, 'sec.timeline', 'rt.timelineDesc'), lane.el),
    h('section', { class: 'rt-streams' }, h('div', { class: 'rt-grid' },
      h('div', {}, sectionHead(2, 'rt.requests', 'rt.requestsDesc', requestCount), requests.el),
      h('div', {}, sectionHead(3, 'rt.events', 'rt.eventsDesc', eventCount), events.el))),
  );

  const pollRequests = async () => {
    for (let round = 0; round < 3; round++) {
      const batch = await api('GET', `/api/requests?after=${encodeURIComponent(page.cursor)}&limit=${REQUEST_PAGE}`);
      page.cursor = batch.cursor;
      const marks = batch.missing.filter((name) => !page.missing.has(name)).map((name) => t('rt.missing', { replica: name }));
      page.missing = new Set(batch.missing);
      for (const replica of batch.reset) {
        page.last.delete(replica);
        marks.push(t('rt.reset', { replica }));
      }
      // Per replica and generation (ADR 0031), a seq past the next one means its ring overflowed between polls.
      for (const r of batch.records) {
        const last = page.last.get(r.replica);
        if (page.seeded && last !== undefined && r.seq > last + 1) marks.push(t('rt.gap', { n: nf(r.seq - last - 1), ring: nf(REQUEST_RING) }));
        page.last.set(r.replica, r.seq);
      }
      page.records.push(...batch.records);
      page.records.splice(0, Math.max(0, page.records.length - KEEP_REQUESTS));
      const ops = batch.records.map((r) => ({ key: `${r.replica}:${r.seq}:${r.t}`, item: r }));
      if (!page.seeded) requests.seed(ops);
      if (marks.length || (page.seeded && batch.records.length)) requests.push(marks, page.seeded ? ops : []);
      if (page.seeded && batch.records.length) header.beat();
      page.seeded = true;
      if (batch.records.length < REQUEST_PAGE) break;
    }
    header.seen(page.records.at(-1)?.t);
    renderPulse();
  };
  const pollMetrics = async () => {
    const m = await api('GET', '/api/metrics');
    const diff = absorbMetrics(model, m);
    if (diff.restarted) header.restarted(m.gateway.startedAt);
    if (diff.reset) absorbApps(model, await api('GET', '/api/apps'), Date.now());
    if (diff.initial) events.seed(diff.fresh);
    else events.push(eventMarks(diff), diff.fresh);
    renderLane(!diff.initial);
  };
  const pollApps = async () => {
    if (!model.metrics) return;
    absorbApps(model, await api('GET', '/api/apps'), Date.now());
    renderPulse();
    renderLane(true);
  };
  const polls = [pollMetrics, pollRequests, pollApps].map((fn) => header.guarded(fn));
  // The metrics poll loads the listing, whose addresses the first request rows need.
  const first = async () => { await polls[0](); await Promise.all([polls[1](), polls[2]()]); };
  return { loops: [[METRICS_MS, polls[0]], [REQUESTS_MS, polls[1]], [APPS_MS, polls[2]]], first };
}

/** Filter-chip order; a removed or purging app is 'removed' whatever its instance, and a quarantine outranks the instance state. */
const APP_BUCKETS = ['awake', 'asleep', 'quarantined', 'removed'];
const appBucket = (a) => (a.status !== 'registered' ? 'removed' : a.quarantine ? 'quarantined' : ACTIVE.includes(a.instance) ? 'awake' : 'asleep');
const appDot = (a) => (a.status !== 'registered' ? 'off' : a.quarantine ? 'down' : a.instance === 'awake' ? 'ready' : ACTIVE.includes(a.instance) ? 'starting' : 'off');
const BUCKET_DOT = { awake: 'ready', asleep: 'off', quarantined: 'down', removed: 'off' };
let appsFilter = { text: '', bucket: '', tenant: '' };
let removedOpen = false;
/** App name to its last SPARK_HOURS hourly request and error counts, fetched only for cards on screen. */
const SPARKS = new Map();
const SPARK_MS = 5 * 60_000;
const SPARK_HOURS = 24;

async function sparkOf(name) {
  const hit = SPARKS.get(name);
  if (hit && Date.now() - hit.at < SPARK_MS) return hit;
  const first = Math.floor(Date.now() / HOUR_MS) * HOUR_MS - (SPARK_HOURS - 1) * HOUR_MS;
  const { buckets } = await api('GET', `/api/usage?app=${encodeURIComponent(name)}&from=${first}`);
  const at = new Map(buckets.map((b) => [b.start, b]));
  const entry = { at: Date.now(), hours: Array.from({ length: SPARK_HOURS }, (_, i) => {
    const start = first + i * HOUR_MS;
    return { start, requests: at.get(start)?.requests ?? 0, errors: at.get(start)?.errors ?? 0 };
  }) };
  SPARKS.set(name, entry);
  return entry;
}

/** One bar per hour with its errors stacked red on top; empty slots until the buckets arrive. */
function sparkBars(hours) {
  const max = Math.max(1, ...(hours ?? []).map((b) => b.requests));
  const height = (n) => `height:max(2px, ${(n / max * 100).toFixed(1)}%)`;
  return (hours ?? Array.from({ length: SPARK_HOURS }, () => null)).map((b) => h('i', b ? { title: `${clock(b.start)} · ${t('ap.sparkTip', { requests: nf(b.requests), errors: nf(b.errors) })}` } : {},
    b?.errors ? h('b', { class: 'bad', style: height(b.errors) }) : null,
    b && b.requests > b.errors ? h('b', { style: height(b.requests - b.errors) }) : null));
}

function appStateLine(a) {
  if (a.status !== 'registered') return h('div', { class: 'aline muted' }, t(`st.${a.status}`));
  if (a.quarantine) return h('div', { class: 'aline red', title: stamp(a.quarantine.since) }, t('ap.quarantined', { reason: a.quarantine.reason }), ' · ', ticking(() => since(a.quarantine.since)));
  if (a.release != null && a.runtime == null) return h('div', { class: 'aline muted' }, t('ap.staticLine'));
  if (a.release == null) return h('div', { class: 'aline muted' }, t('tp.noRelease'));
  const span = a.since == null ? null : ticking(() => duration(Date.now() - a.since));
  return h('div', { class: `aline ${tone(a.instance)}` },
    a.instance === 'none' ? t('ap.never') : [t(`ap.in.${a.instance}`), ' ', span],
    a.instance === 'awake' && a.sleepsAt ? h('span', { class: 'muted' }, ' · ', ticking(() => (a.sleepsAt > Date.now() ? t('tl.sleepsIn', { d: duration(a.sleepsAt - Date.now() + 999) }) : t('tl.sleepingNow')))) : null,
    ACTIVE.includes(a.instance) && a.node ? h('span', { class: 'muted mono' }, ` · ${a.node}`) : null);
}

/** What needs the reader first: quarantined, then erroring, then awake, then the most recently used. */
const appRank = (a) => (appBucket(a) === 'quarantined' ? 0 : a.errors > 0 ? 1 : appBucket(a) === 'awake' ? 2 : 3);
const byLiveliness = (a, b) => appRank(a) - appRank(b) || (b.lastAccessAt ?? 0) - (a.lastAccessAt ?? 0) || a.name.localeCompare(b.name);

async function projects() {
  const show = claim();
  const count = h('p', { class: 'sub' });
  const chips = h('div', { class: 'fchips' });
  const body = h('div', { class: 'alist' });
  const search = h('input', { type: 'search', name: 'search', value: appsFilter.text, placeholder: t('ap.search'), 'aria-label': t('ap.search'), oninput: () => { appsFilter.text = search.value; paint(); } });
  let apps = [];
  let painted = '';
  const grouped = () => upstream() && session.scope === ALL;
  /** A member reads only the apps they own (ADR 0022 item 5), so the page says so rather than look like the whole team. */
  const mine = upstream() && session.scope !== ALL && session.scope !== null && !mayAdmin(session.scope);
  const visible = new IntersectionObserver((entries) => {
    for (const { isIntersecting, target } of entries) {
      if (!isIntersecting) continue;
      visible.unobserve(target);
      sparkOf(target.dataset.app).then(({ hours }) => fill(target, sparkBars(hours))).catch(() => {});
    }
  });

  const card = (a) => {
    const bucket = appBucket(a);
    const hit = SPARKS.get(a.name);
    const spark = h('div', { class: 'spark', 'data-app': a.name, 'aria-hidden': 'true' }, sparkBars(hit?.hours));
    if (bucket !== 'removed' && (!hit || Date.now() - hit.at >= SPARK_MS)) visible.observe(spark);
    return h('article', { class: `card acard ${bucket}`, onclick: (e) => { if (!e.target.closest('a, button')) location.hash = `#/apps/${encodeURIComponent(a.name)}`; } },
      h('div', { class: 'ah' }, h('i', { class: `pdot ${appDot(a)}` }), appLink(a.name), runtimeChip(a),
        grouped() && bucket === 'removed' ? h('span', { class: 'muted' }, a.tenant) : null,
        h('span', { class: 'rel num', title: t('d.release') }, a.release == null ? '' : `#${a.release}`)),
      appStateLine(a),
      bucket === 'removed' ? null : h('div', { class: 'aspark', role: 'img', 'aria-label': t('ap.sparkLabel', { requests: nf(a.requests), errors: nf(a.errors) }) }, spark,
        h('div', { class: 'acount' }, h('b', { class: 'num' }, nf(a.requests)), h('span', { class: 'muted' }, t('ap.req24')),
          a.errors ? h('span', { class: 'bad num' }, plural('ap.errors', a.errors)) : null)),
      h('div', { class: 'afoot' },
        a.capabilities.length ? h('span', { class: 'chips' }, a.capabilities.map(chip)) : h('span', { class: 'muted' }, t('routeOnly')),
        h('span', { class: 'muted', title: a.lastAccessAt == null ? null : stamp(a.lastAccessAt) }, t('ap.lastAccess'), ' ', a.lastAccessAt == null ? t('never') : ticking(() => since(a.lastAccessAt)))));
  };
  const cards = (list) => h('div', { class: 'agrid' }, list.map(card));
  /** Tenants with a quarantined or erroring app first, then the busiest. */
  const tenantGroups = (list) => [...Map.groupBy(list, (a) => a.tenant)].map(([tenant, mine]) => ({
    tenant, mine: [...mine].sort(byLiveliness), awake: mine.filter((a) => appBucket(a) === 'awake').length, requests: mine.reduce((n, a) => n + a.requests, 0),
    trouble: Math.min(...mine.map(appRank)),
  })).sort((a, b) => Number(a.trouble > 1) - Number(b.trouble > 1) || b.requests - a.requests || b.awake - a.awake || a.tenant.localeCompare(b.tenant));

  const paint = () => {
    const signature = JSON.stringify([apps, appsFilter, removedOpen]);
    if (signature === painted) return;
    painted = signature;
    visible.disconnect();
    const needle = appsFilter.text.trim().toLowerCase();
    const tenants = grouped() ? [...Map.groupBy(apps, (a) => a.tenant)].sort(([a], [b]) => a.localeCompare(b)) : [];
    // The tenant filter applies only while its chips are on screen to show and clear it.
    const tenant = tenants.length > 1 ? appsFilter.tenant : '';
    const inTenant = apps.filter((a) => !tenant || a.tenant === tenant);
    const byBucket = Map.groupBy(inTenant, appBucket);
    const fchip = (field, value, label, n, dot = null) => h('button', {
      type: 'button', class: 'fchip', 'aria-pressed': String(appsFilter[field] === value), onclick: () => { appsFilter[field] = appsFilter[field] === value ? '' : value; paint(); },
    }, dot, label, h('span', { class: 'n num' }, nf(n)));
    fill(chips,
      fchip('bucket', '', t('cl.f.all'), inTenant.length),
      APP_BUCKETS.filter((b) => byBucket.has(b) || appsFilter.bucket === b).map((b) => fchip('bucket', b, t(`ap.b.${b}`), byBucket.get(b)?.length ?? 0, h('i', { class: `pdot ${BUCKET_DOT[b]}` }))),
      tenants.length > 1 ? [h('span', { class: 'fsep', 'aria-hidden': 'true' }), tenants.map(([name, list]) => fchip('tenant', name, name, list.length))] : null);

    const shown = inTenant.filter((a) => (!needle || a.name.includes(needle) || a.tenant?.includes(needle)) && (!appsFilter.bucket || appBucket(a) === appsFilter.bucket)).sort(byLiveliness);
    const live = shown.filter((a) => appBucket(a) !== 'removed');
    const removed = shown.filter((a) => appBucket(a) === 'removed');
    const disclosure = () => {
      const el = h('details', { class: 'adisc', open: removedOpen }, h('summary', {}, t('ap.b.removed'), h('span', { class: 'n num' }, nf(removed.length)), h('span', { class: 'muted' }, t('ap.removedNote'))), cards(removed));
      el.addEventListener('toggle', () => { removedOpen = el.open; });
      return el;
    };
    fill(body,
      apps.length === 0 ? h('div', { class: 'card' }, h('div', { class: 'empty' }, t(mine ? 'apps.emptyMine' : 'apps.empty'), h('div', { style: 'margin-top:12px' }, h('a', { class: 'btn primary', href: '#/publish' }, t('apps.publish')))))
        : shown.length === 0 ? h('div', { class: 'card' }, h('div', { class: 'empty' }, t('empty.filtered'))) : null,
      live.length === 0 ? null : grouped() ? tenantGroups(live).map((g) => h('div', { class: 'agroup' },
        h('div', { class: 'tgh' }, h('b', { class: 'mono' }, g.tenant), h('span', { class: 'muted' }, plural('apps.count', g.mine.length), ' · ', t('ap.awakeN', { n: nf(g.awake) })),
          h('span', { class: 'muted num' }, t('ap.groupRequests', { n: nf(g.requests) }))),
        cards(g.mine))) : cards(live),
      removed.length === 0 ? null : appsFilter.bucket === 'removed' ? cards(removed) : disclosure());
  };

  show(
    h('div', { class: 'head' }, h('div', { class: 'grow' }, h('h1', {}, t('apps.title')), count, mine ? h('p', { class: 'sub' }, t('ap.mine')) : null), h('a', { class: 'btn primary', href: '#/publish' }, t('apps.publish'))),
    h('section', {}, h('div', { class: 'ifilter' }, chips, search), body),
  );
  return async function update() {
    apps = scoped(await api('GET', '/api/apps'));
    count.textContent = `${plural('apps.count', apps.length)} · ${t('ap.awakeN', { n: nf(apps.filter((a) => appBucket(a) === 'awake').length) })}`;
    paint();
  };
}

function logsPanel(name) {

      pre.scrollTop = pre.scrollHeight;

/** One beat per recent state change of the app, oldest on the left. */
function stateStrip(events, name) {
  const changes = events.filter((e) => e.app === name && INSTANCE_EVENTS.includes(e.ev));
  if (!changes.length) return null;
  return h('div', { class: 'beats', role: 'img', 'aria-label': t('d.recent') },
    changes.map((e, i) => {
      const failed = e.ev === 'asleep' && e.error !== undefined && changes[i - 1]?.ev === 'waking';
      return h('i', {
        class: failed ? 'fail' : e.ev,
        title: `${clock(e.t, true)} · ${failed ? t('mk.wakeFailed') : t(`st.${e.ev === 'removed' ? 'none' : e.ev}`)}${typeof e.ms === 'number' ? ` · ${ms(e.ms)}` : ''}`,
      });
    }).slice(-48),
    h('span', { class: 'muted' }, t('d.recent')));
}
