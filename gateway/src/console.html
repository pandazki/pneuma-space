// Topology (ADR 0018): the lane view and the graph view share one model, its polls and its fault rules.

const LANES = ['container', 'isolate', 'static'];
const SERVICES = ['redis', 'object', 'postgres', 'coturn', 'runner'];
/** Where an app's files and SQLite database live, by lane: Docker volumes, or the runner's volume (ADR 0017). */
const STORE_OF = { container: 'volumes', isolate: 'runner', static: null };
const CAP_SERVICE = { kv: 'redis', object: 'object', static: 'object', rtc: 'coturn' };
const CAP_NODES = ['files', 'db:sqlite', 'db:postgres', 'kv', 'object', 'static', 'rtc', 'ws', 'cron', 'identity'];
const GRAPH_SERVICES = ['volumes', 'runner', 'postgres', 'redis', 'object', 'coturn'];
const STAGES = ['ingress', 'identity', 'static', 'wake'];
/** The compose service and profile behind each probed service; the runner's profile comes from /api/health. */
const COMPOSE = { redis: ['redis', null], object: ['rustfs', null], postgres: ['postgres', 'postgres'], coturn: ['coturn', 'rtc'], runner: ['runner', 'isolate'] };
const GRAPH_CAP = 24;
const LANE_CAP = 12;
const FLOWS_PER_APP = 3;
const MAX_PARTICLES = 12;

/** The runtime lane an app runs in; null while it has no release (a first publish that has not finished). */
const laneOf = (a) => (a.release == null ? null : a.runtime ?? 'static');
const groupOf = (a) => laneOf(a) ?? 'unpublished';

/** The apps a lane draws: awake and transitional first, then quarantined, then by last access; the rest fold into one +N chip. */
const ACTIVE_STATES = new Set(['awake', 'waking', 'draining', 'stopping']);
const laneRank = (a) => (ACTIVE_STATES.has(a.instance) ? 0 : a.quarantine ? 1 : 2);
const laneShown = (apps) => [...apps]
  .sort((a, b) => laneRank(a) - laneRank(b) || (b.lastAccessAt ?? 0) - (a.lastAccessAt ?? 0) || a.name.localeCompare(b.name))
  .slice(0, LANE_CAP)
  .sort((a, b) => a.name.localeCompare(b.name));

/** Each declared capability as its graph node and the service it rests on; null rests inside the gateway. */
function needs(a) {
  const store = STORE_OF[laneOf(a)];
  return a.capabilities.map((kind) => {
    if (kind === 'db') return a.dbBackend === 'postgres' ? { cap: 'db:postgres', kind, service: 'postgres' } : { cap: 'db:sqlite', kind, service: store };
    if (kind === 'files') return { cap: kind, kind, service: store };
    return { cap: kind, kind, service: CAP_SERVICE[kind] ?? null };
  });
}

const passesOf = (a) => (laneOf(a) ? ['ingress', a.capabilities.includes('identity') && 'identity', a.capabilities.includes('static') && 'static', a.runtime && 'wake'].filter(Boolean) : []);

/** Every service an app cannot answer without: its capabilities' services, and the runner for an isolate app. */
function servicesOf(a) {
  const out = new Set(needs(a).map((n) => n.service).filter(Boolean));
  if (laneOf(a) === 'isolate') out.add('runner');
  return out;
}

function topoModel() {
  return { apps: [], health: null, services: {}, cursor: null, startedAt: null, last: null };
}

/** up, down or off from the last probe sample; unknown before the gateway's first sample, which is no fault. */
const svcStatus = (model, name) => (name === 'volumes' ? 'up' : model.services[name]?.status ?? 'unknown');
const unreachable = (model, name) => ['down', 'off'].includes(svcStatus(model, name));
const dependents = (model, name) => model.apps.filter((a) => servicesOf(a).has(name));
/** A service that is down, or off while an app needs it; an unused profile service that is off is normal. */
const svcFault = (model, name) => {
  const s = svcStatus(model, name);
  return s === 'down' || (s === 'off' && dependents(model, name).length > 0);
};
const blockedBy = (model, a) => [...servicesOf(a)].filter((s) => unreachable(model, s));
const laneDown = (model, lane) => lane === 'isolate' && unreachable(model, 'runner');

function fixFor(model, name) {
  const [service, profile] = COMPOSE[name];
  const p = name === 'runner' ? model.health?.runtimes.isolate.profile ?? profile : profile;
  return svcStatus(model, name) === 'off' ? planeT('tp.fixOff', { profile: p }) : planeT('tp.fixDown', { service });
}

const measureCtx = document.createElement('canvas').getContext('2d');
function textWidth(s, size, mono, weight = 400) {
  measureCtx.font = `${weight} ${size}px ${getComputedStyle(root).getPropertyValue(mono ? '--mono' : '--font')}`;
  return measureCtx.measureText(s).width;
}
function fit(s, size, mono, max, weight) {
  if (textWidth(s, size, mono, weight) <= max) return s;
  while (s.length > 1 && textWidth(`${s}…`, size, mono, weight) > max) s = s.slice(0, -1);
  return `${s}…`;
}

const tx = (x, y, s, cls = '', extra = {}) => svg('text', { x, y, class: cls, ...extra }, s);
const curve = (x1, y1, x2, y2) => {
  const dx = Math.max(24, (x2 - x1) / 2);
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
};
const titled = (el, text) => { el.prepend(svg('title', {}, text)); return el; };

/** A focusable SVG control: Enter and Space act like a click; its first rect carries the focus ring, its key survives a rebuild. */
function act(el, label, onPick, key) {
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', label);
  el.dataset.key = key;
  el.classList.add('act');
  el.addEventListener('click', (e) => { e.stopPropagation(); onPick(); });
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(); } });
  return el;
}

    svg('rect', { width: 8, height: 8, class: 'sbg' }), svg('rect', { width: 1, height: 8, class: 'sln' })));
}

/** The small text at a chip's right: no release yet, or, with `withNode` under Kubernetes, the node the app runs on. */
function chipNote(model, a, withNode) {
  if (laneOf(a) === null) return { text: t('tp.noRelease'), mono: false };
  return withNode && onCluster() && a.node ? { text: a.node, mono: true } : null;
}
const noteWidth = (note) => (note ? textWidth(note.text, 11.5, note.mono) + 8 : 0);

/** An app as a chip: state dot and name; quarantine and an unreachable service colour it. */
function appChip(model, a, x, y, w, withNode = false) {
  const blocked = blockedBy(model, a);
  const unpublished = laneOf(a) === null;
  const state = a.quarantine ? 'quarantined' : unpublished ? 'unpublished' : a.instance;
  const note = chipNote(model, a, withNode);
  const noteW = noteWidth(note);
  const g = svg('g', { class: `chipg${blocked.length ? ' fault' : ''}`, 'data-state': state, 'data-app': a.name },
    svg('rect', { x, y, width: w, height: 22, rx: 6, class: 'chipr' }),
    svg('circle', { cx: x + 10, cy: y + 11, r: 3, class: 'sdot' }),
    tx(x + 19, y + 15, fit(a.name, 11.5, true, w - 26 - noteW), 'm chipt'),
    note ? tx(x + w - 8, y + 15, fit(note.text, 11.5, note.mono, Math.max(24, w - 60)), `${note.mono ? 'm ' : ''}t3 small`, { 'text-anchor': 'end' }) : null);
  const why = [unpublished ? note.text : t(`st.${a.instance}`), a.node, a.quarantine && `${t('att.quarantine')}: ${a.quarantine.reason}`, ...blocked.map((s) => t('tp.needs', { name: t(`svc.${s}`), status: t(`st.${svcStatus(model, s)}`) }))];
  return titled(g, `${a.name} · ${why.filter(Boolean).join(' · ')}`);
}

const INFO = 16;
/** The circled "i" that opens a runtime's explanation; cy is its centre line. */
function infoButton(x, cy, kind, onPick, key) {
  const label = t('tp.explainFor', { kind });
  return act(titled(svg('g', { class: 'info', transform: `translate(${x},${cy - INFO / 2})` },
    svg('rect', { x: -3, y: -3, width: INFO + 6, height: INFO + 6, rx: (INFO + 6) / 2, class: 'hit' }),
    svg('circle', { cx: 8, cy: 8, r: 6.75 }),
    svg('path', { d: 'M8 7.5v3.75' }),
    svg('circle', { cx: 8, cy: 5.1, r: .9, class: 'dot' })), label), label, onPick, key);
}

function pillButton(x, y, label, onPick, key, cls = '') {
  const w = textWidth(label, 11.5, false, 500) + 18;
  const g = svg('g', { class: `pillb ${cls}` }, svg('rect', { x, y, width: w, height: 22, rx: 11 }), tx(x + 9, y + 15, label));
  return { el: act(g, label, onPick, key), w };
}

/** Lays chips out left to right, wrapping at `rowW`; each item brings its own width. */
function wrapChips(items, x0, rowW, y0) {
  let x = x0, y = y0;
  return items.map((item) => {
    const w = Math.min(rowW, item.w);
    if (x + w > x0 + rowW) { x = x0; y += 30; }
    const at = { ...item, x, y, w };
    x += w + 6;
    return at;
  });
}

function flowChips(model, apps, x0, rowW, y0, withNode = false) {
  return wrapChips(apps.map((a) => ({ a, w: Math.max(84, textWidth(a.name, 11.5, true) + 30 + noteWidth(chipNote(model, a, withNode))) })), x0, rowW, y0);
}

function serviceNode(model, name, x, y, w, hgt, label = planeT(`svc.${name}`)) {
  const s = model.services[name];
  const status = svcStatus(model, name);
  const fault = svcFault(model, name);
  const g = svg('g', { class: `svcn${fault ? ' fault' : ''}`, 'data-status': status, 'data-id': `svc:${name}` },
    svg('rect', { x, y, width: w, height: hgt, rx: 10, class: 'svcbox' }),
    tx(x + 12, y + 20, fit(label, 12.5, false, w - (name === 'volumes' ? 24 : 80), 600), 'svct'));
  if (name === 'volumes') {
    g.append(tx(x + 12, y + 36, fit(planeT('tp.unprobed'), 11, false, w - 24), 't3 small'));
    return g;
  }
  const st = t(`st.${status}`);
  const sw = textWidth(st, 11.5) + 12;
  g.append(svg('circle', { cx: x + w - 12 - sw + 3, cy: y + 16, r: 3, class: 'sdot' }), tx(x + w - 12, y + 20, st, 'svcs', { 'text-anchor': 'end' }));
  if (status === 'up') {
    g.append(tx(x + 12, y + 36, ms(s.latencyMs), 'small t3 m', { 'data-latency': name }));
    return g;
  }
  const second = status === 'unknown' ? t('tp.waiting') : status === 'off' && !fault ? t('tp.unused') : fixFor(model, name);
  g.append(titled(tx(x + 12, y + 36, fit(second, 11, false, w - 24), `small ${fault ? 'bad' : 't3'}`), second));
  return g;
}

// Lane view: callers, the gateway, one lane per runtime, the platform services.

function laneScene(model, width, shown, on) {
  const W = Math.max(1040, width);
  const top = 44;
  const gx = 160, gw = 236, sw = 196, sx = W - 16 - sw;
  const lx = gx + gw + 44, lw = sx - 104 - lx;
  const el = svg('svg', { class: 'topo-svg', width: W, role: 'group', 'aria-label': t('tp.lane.label') });
  const edges = svg('g');
  const nodes = svg('g');
  const labels = svg('g');
  const flows = svg('g', { class: 'flows' });
  const chips = new Map();
  const chip = (p) => {
    const el = act(appChip(model, p.a, p.x, p.y, p.w, true), p.a.name, () => on.open(p.a.name), `app:${p.a.name}`);
    chips.set(p.a.name, el);
    return el;
  };
  const head = (x, s) => tx(x, 20, s, 't3 small');
  nodes.append(head(16, t('tp.col.callers')), head(gx, t('tp.col.gateway')), head(lx, t('tp.col.runtimes')), head(sx, t('tp.col.services')));

  const byLane = Object.fromEntries(LANES.map((l) => [l, model.apps.filter((a) => laneOf(a) === l)]));
  const drawable = Object.fromEntries(LANES.map((l) => [l, shown.filter((a) => laneOf(a) === l)]));
  const laneBoxes = {};
  let y = top;
  for (const lane of LANES) {
    const all = byLane[lane];
    const apps = laneShown(drawable[lane]);
    const hidden = all.length - apps.length;
    const down = laneDown(model, lane);
    const g = svg('g', { class: `lane${down ? ' fault' : ''}`, 'data-id': `lane:${lane}` });
    const inner = lx + 14, innerW = lw - 28;
    const placed = flowChips(model, apps, inner, innerW, y + 44, true);
    const more = hidden ? (() => {
      const label = t('tp.more', { n: nf(hidden) });
      const w = textWidth(label, 11.5, true) + 20;
      const last = placed.at(-1);
      if (!last) return { label, w, x: inner, y: y + 44 };
      const fits = last.x + last.w + 6 + w <= inner + innerW;
      return { label, w, x: fits ? last.x + last.w + 6 : inner, y: fits ? last.y : last.y + 30 };
    })() : null;
    const lastChip = more ?? placed.at(-1);
    const chipsBottom = lastChip ? lastChip.y + 22 : y + 44 + 20;
    const quarantined = apps.filter((a) => a.quarantine);
    const qTop = chipsBottom + 10;
    const stripY = qTop + quarantined.length * 46 + (quarantined.length ? 2 : 0);
    const lh = stripY + 30 + 12 - y;
    g.append(svg('rect', { x: lx, y, width: lw, height: lh, rx: 14, class: 'box' }));
    if (down) g.append(svg('rect', { x: lx, y, width: lw, height: lh, rx: 14, class: 'downwash' }));
    const countText = down ? t('tp.unreachableShort') : plural('tp.apps', all.length);
    const countW = textWidth(countText, 11.5, !down);
    const nameW = textWidth(lane, 13, false, 600);
    const subX = lx + 14 + nameW + 6 + INFO + 10;
    g.append(svg('g', { class: 'lanet' },
      tx(lx + 14, y + 24, lane, 'lanen'),
      infoButton(lx + 14 + nameW + 6, y + 20, lane, () => on.explain(lane), `lane:${lane}`),
      textWidth(planeT(`tp.lane.${lane}.sub`), 11.5) <= lx + lw - 14 - countW - 16 - subX ? tx(subX, y + 24, planeT(`tp.lane.${lane}.sub`), 't3 small') : null),
      tx(lx + lw - 14, y + 24, countText, down ? 'bad small' : 't3 small m', { 'text-anchor': 'end' }));
    if (!apps.length && !more) g.append(tx(inner, y + 59, t('tp.noApps'), 't3 small'));
    for (const p of placed) g.append(chip(p));
    if (more) {
      const title = t('tp.moreTitle', { n: nf(hidden), cap: nf(LANE_CAP) });
      g.append(act(titled(svg('g', { class: 'chipg', 'data-state': 'more' },
        svg('rect', { x: more.x, y: more.y, width: more.w, height: 22, rx: 6, class: 'chipr' }),
        tx(more.x + more.w / 2, more.y + 15, more.label, 'm chipt', { 'text-anchor': 'middle' })), title), title, () => { location.hash = '#/apps'; }, `more:${lane}`));
    }
    quarantined.forEach((a, i) => {
      const qy = qTop + i * 46;
      const button = pillButton(0, qy, t('tp.lift'), () => on.lift(a.name), `lift:${a.name}`, 'danger');
      button.el.setAttribute('transform', `translate(${inner + innerW - button.w - 4},0)`);
      const meta = `×${a.quarantine.failures} · ${clock(a.quarantine.since, true)}`;
      g.append(svg('g', { class: 'qrow' },
        svg('rect', { x: inner, y: qy - 2, width: innerW, height: 42, rx: 8, class: 'qbg' }),
        svg('circle', { cx: inner + 12, cy: qy + 11, r: 3, class: 'qdot' }),
        tx(inner + 21, qy + 15, a.name, 'm small bad'),
        tx(inner + 29 + textWidth(a.name, 11.5, true), qy + 15, fit(t('att.quarantine'), 11.5, false, innerW - button.w - 50 - textWidth(a.name, 11.5, true), 500), 'small bad'),
        tx(inner + innerW - 10, qy + 32, meta, 'm t3 small', { 'text-anchor': 'end' }),
        titled(tx(inner + 21, qy + 32, fit(a.quarantine.reason, 11, false, innerW - 44 - textWidth(meta, 11.5, true)), 'small t2'), a.quarantine.reason)), button.el);
    });
    const kept = lane === 'static' ? t('tp.keep.static') : [planeT(`tp.keep.${lane}`), ...['files', 'db:sqlite'].map((cap) => {
      const n = all.filter((a) => needs(a).some((x) => x.cap === cap)).length;
      return n ? `${cap === 'files' ? 'files' : 'sqlite'} ${n}` : null;
    })].filter(Boolean).join(' · ');
    const engine = planeT(`tp.engine.${lane}`);
    const engineW = textWidth(engine, 11.5, false, 500) + 20;
    g.append(svg('rect', { x: inner, y: stripY, width: innerW, height: 30, rx: 8, class: 'strip' }),
      tx(inner + 10, stripY + 19, engine, 't2 small strong'),
      tx(inner + innerW - 10, stripY + 19, fit(kept, 11, true, innerW - engineW - 20), 'm t3 small', { 'text-anchor': 'end' }));
    nodes.append(g);
    laneBoxes[lane] = { y, h: lh, apps: all };
    y += lh + 16;
  }
  const unpublished = model.apps.filter((a) => laneOf(a) === null);
  if (unpublished.length) {
    const placed = flowChips(model, unpublished, lx + 14, lw - 28, y + 34, true);
    const uh = placed.at(-1).y + 22 + 12 - y;
    nodes.append(svg('g', { 'data-id': 'unpublished' }, svg('rect', { x: lx, y, width: lw, height: uh, rx: 14, class: 'unpub' }),
      tx(lx + 14, y + 22, t('tp.unpublished'), 'strong small t2'),
      tx(lx + 22 + textWidth(t('tp.unpublished'), 11.5, false, 600), y + 22, fit(t('tp.unpublishedSub'), 11.5, false, lw - 60 - textWidth(t('tp.unpublished'), 11.5, false, 600)), 't3 small')),
      ...placed.map(chip));
    y += uh + 16;
  }
  const bottom = y - 16;

  const rowsY = (i) => top + 52 + i * 36;
  const stages = ['ingress', 'identity', 'static', 'wake', 'scheduler', 'admin'];
  const gh = rowsY(stages.length - 1) + 30 - top;
  const gateway = svg('g', { 'data-id': 'gateway' }, svg('rect', { x: gx, y: top, width: gw, height: gh, rx: 14, class: 'box' }),
    tx(gx + 16, top + 26, t('svc.gateway'), 'lanen'));
  const port = { ingress: `:${model.health.ingressPort}`, admin: `:${location.port || (location.protocol === 'https:' ? 443 : 80)}` };
  stages.forEach((s, i) => {
    const ry = rowsY(i);
    gateway.append(svg('circle', { cx: gx + 20, cy: ry - 4, r: 2.5, class: 'stdot' }), tx(gx + 30, ry, t(`tp.stage.${s}`), 'small'),
      tx(gx + gw - 14, ry, port[s] ?? fit(t(`tp.stage.${s}.note`), 11, false, gw - 120), port[s] ? 'm small t2' : 't3 small', { 'text-anchor': 'end' }));
  });
  nodes.append(gateway);

  const caller = (cy, label, kind) => svg('g', { 'data-id': kind },
    svg('rect', { x: 16, y: cy - 14, width: 112, height: 28, rx: 14, class: 'box' }),
    svg('circle', { cx: 32, cy, r: 5.5, class: 'ring' }), tx(44, cy + 4, fit(label, 11.5, false, 78)));
  const ingressY = rowsY(0) - 4, adminY = rowsY(5) - 4;
  nodes.append(caller(ingressY, t('tp.visitor'), 'visitor'), caller(adminY, t('tp.operator'), 'operator'));
  const edge = (d, cls = '') => { const p = svg('path', { d, class: `edge ${cls}` }); edges.append(p); return p; };
  const visitorPath = edge(`M128,${ingressY} H${gx}`);
  edge(`M128,${adminY} H${gx}`);

  const lanePaths = {};
  for (const lane of LANES) {
    const from = rowsY(lane === 'static' ? 2 : 3) - 4;
    lanePaths[lane] = edge(curve(gx + gw, from, lx, laneBoxes[lane].y + 20), laneDown(model, lane) ? 'fault' : '');
  }

  const sh = 50;
  const span = Math.max(bottom - top, SERVICES.length * (sh + 12));
  const sy = (i) => top + (i * (span - sh)) / (SERVICES.length - 1);
  const svcY = Object.fromEntries(SERVICES.map((s, i) => [s, sy(i)]));
  SERVICES.forEach((s) => nodes.append(serviceNode(model, s, sx, svcY[s], sw, sh)));
  for (const lane of LANES) {
    const box = laneBoxes[lane];
    const kinds = new Map();
    for (const a of box.apps) for (const n of needs(a)) {
      if (!n.service || n.service === STORE_OF[lane]) continue;
      const k = kinds.get(n.service) ?? new Map();
      k.set(n.kind, (k.get(n.kind) ?? 0) + 1);
      kinds.set(n.service, k);
    }
    if (lane === 'isolate' && box.apps.length) kinds.set('runner', new Map([['apps', box.apps.length]]));
    const list = SERVICES.filter((s) => kinds.has(s));
    list.forEach((s, i) => {
      const y1 = box.y + 20 + ((i + 1) * (box.h - 40)) / (list.length + 1);
      const y2 = svcY[s] + sh / 2 + (LANES.indexOf(lane) - 1) * 7;
      edge(curve(lx + lw, y1, sx, y2), svcFault(model, s) || laneDown(model, lane) ? 'fault' : '');
      const label = [...kinds.get(s)].map(([k, n]) => (k === 'apps' ? plural('tp.apps', n) : `${k} ${n}`)).join(' · ');
      const lw2 = textWidth(label, 10.5, true) + 10;
      const mx = lx + lw + 14, my = y1;
      labels.append(svg('g', { class: `elabel${svcFault(model, s) ? ' fault' : ''}` }, svg('rect', { x: mx, y: my - 9, width: lw2, height: 18, rx: 5 }), tx(mx + 5, my + 4, label, 'm')));
    });
  }

  const H = Math.max(bottom, top + span) + 16;
  el.setAttribute('height', H);
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.append(stripeDefs(), edges, nodes, labels, flows);
  return {
    el,
    flow(name) {
      const a = model.apps.find((x) => x.name === name);
      if (!a || !laneOf(a)) return;
      const moved = particle(flows, [visitorPath, lanePaths[laneOf(a)]]);
      const chip = chips.get(name);
      if (chip) setTimeout(() => glow(chip, 'hit'), moved ? 900 : 0);
    },
  };
}

// Graph view: five fixed columns, one node per app, every edge the app's own.

function graphScene(model, width, shown, hidden, on) {
  const W = Math.max(1040, width);
  const top = 56, row = 28, groupHead = 30;
  const gx = 152, gw = 272, bandW = (gw - 16) / STAGES.length;
  const ax = gx + gw + 28, aw = 172;
  const sw = 164, sx = W - 16 - sw;
  const cw = 138, cx = sx - 64 - cw;
  const el = svg('svg', { class: 'topo-svg graph', width: W, role: 'group', 'aria-label': t('tp.graph.label') });
  const under = svg('g');
  const edges = svg('g');
  const nodes = svg('g');
  const flows = svg('g', { class: 'flows' });
  const head = (x, s) => tx(x, 20, s, 't3 small');
  nodes.append(head(16, t('tp.col.callers')), head(gx, t('tp.col.gateway')), head(ax, t('tp.col.apps')), head(cx, t('tp.col.capabilities')), head(sx, t('tp.col.services')));
  /** Every drawn element keyed for selection: which apps it belongs to, or which service or capability it is. */
  const parts = [];
  const tag = (el, meta) => { parts.push({ el, ...meta }); return el; };

  const rows = [];
  let y = top + 8;
  const groups = {};
  const groupList = [...LANES, ...(shown.some((a) => !laneOf(a)) ? ['unpublished'] : [])];
  for (const lane of groupList) {
    const apps = shown.filter((a) => groupOf(a) === lane);
    groups[lane] = { y, apps };
    y += groupHead;
    for (const a of apps) { rows.push({ a, y: y + row / 2 - 2 }); y += row; }
    if (!apps.length) y += 4;
    y += 10;
  }
  const appsBottom = y;
  const bandTop = top + 8, bandBottom = Math.max(appsBottom, top + 8 + 260);
  const boxY = bandBottom + 12;
  const H0 = boxY + 52;

  under.append(svg('rect', { x: gx, y: bandTop, width: gw, height: bandBottom - bandTop, rx: 14, class: 'box' }));
  const bandX = (i) => gx + 8 + i * bandW + bandW / 2;
  STAGES.forEach((s, i) => {
    under.append(tag(svg('g', { 'data-stage': s },
      svg('rect', { x: gx + 8 + i * bandW + 3, y: bandTop + 8, width: bandW - 6, height: bandBottom - bandTop - 16, rx: 9, class: i === 0 ? 'band ing' : 'band' }),
      tx(bandX(i), bandTop + 26, fit(t(`tp.stage.${s}`), 11.5, false, bandW - 10), 'small t2', { 'text-anchor': 'middle' })), { stage: s }));
  });
  const halfW = (gw - 10) / 2;
  const box = (x, label, note, id) => tag(svg('g', { 'data-id': id }, svg('rect', { x, y: boxY, width: halfW, height: 40, rx: 10, class: 'box' }),
    tx(x + 12, boxY + 17, label, 'small strong'), tx(x + 12, boxY + 32, fit(note, 11, true, halfW - 24), 't3 small m')), { node: id });
  nodes.append(box(gx, t('tp.stage.scheduler'), t('tp.stage.scheduler.note'), 'scheduler'),
    box(gx + halfW + 10, t('tp.stage.admin'), `:${location.port || 80}`, 'admin'));

  const callerY = { visitor: bandTop + 70, caller: bandTop + 120, operator: boxY + 20 };
  for (const [kind, cy] of Object.entries(callerY)) {
    nodes.append(tag(svg('g', { 'data-id': kind }, svg('rect', { x: 16, y: cy - 14, width: 116, height: 28, rx: 14, class: 'box' }),
      svg('circle', { cx: 32, cy, r: 5.5, class: 'ring' }), tx(44, cy + 4, fit(t(`tp.${kind}`), 11.5, false, 82))), { node: kind }));
  }
  const path = (d, cls, meta) => tag(svg('path', { d, class: `edge ${cls}` }), meta);
  const allNames = new Set(shown.map((a) => a.name));
  const visitorPath = path(curve(132, callerY.visitor, bandX(0) - 10, callerY.visitor), '', { apps: allNames });
  edges.append(visitorPath, path(curve(132, callerY.caller, bandX(0) - 10, callerY.caller), '', { apps: allNames }),
    path(`M132,${callerY.operator} H${gx + halfW + 10}`, '', { node: 'operator' }));

  const capY = {};
  const capSpan = Math.max(appsBottom - top - 30, CAP_NODES.length * 34);
  CAP_NODES.forEach((c, i) => { capY[c] = top + 12 + (i * capSpan) / (CAP_NODES.length - 1); });
  const svcSpan = Math.max(appsBottom - top - 50, GRAPH_SERVICES.length * 56);
  const svcY = Object.fromEntries(GRAPH_SERVICES.map((s, i) => [s, top + 8 + (i * svcSpan) / (GRAPH_SERVICES.length - 1)]));

  const byGroup = Object.fromEntries(groupList.map((lane) => [lane, svg('g')]));
  nodes.append(...Object.values(byGroup));
  for (const lane of groupList) {
    const { y: gy, apps } = groups[lane];
    const extra = hidden[lane] ?? 0;
    const down = laneDown(model, lane);
    const hit = down || apps.some((a) => blockedBy(model, a).length);
    if (lane === 'unpublished') {
      const label = `${t('tp.unpublished')}  ${nf(apps.length)}${extra ? `  +${nf(extra)}` : ''}`;
      byGroup[lane].append(tag(svg('g', { class: 'lanet', 'data-id': 'group:unpublished' }, tx(ax, gy + 18, label, 'grp')), { apps: new Set(apps.map((a) => a.name)), group: lane }));
      continue;
    }
    const label = `${lane}  ${nf(apps.length)}${extra ? `  +${nf(extra)}` : ''}`;
    const title = svg('g', { class: `lanet${hit ? ' fault' : ''}`, 'data-id': `group:${lane}` },
      tx(ax, gy + 18, label, 'grp m'),
      infoButton(ax + textWidth(label, 11.5, true) + 6, gy + 14, lane, () => on.explain(lane), `group:${lane}`),
      down ? tx(ax + aw, gy + 18, t('tp.unreachableShort'), 'bad small', { 'text-anchor': 'end' }) : null);
    byGroup[lane].append(tag(title, { apps: new Set(apps.map((a) => a.name)), group: lane }));
    if (!apps.length) byGroup[lane].append(tx(ax, gy + groupHead + 6, t('tp.noApps'), 't3 small'));
  }
  const appPaths = new Map();
  const appNodes = new Map();
  for (const { a, y: ry } of rows) {
    const g = act(appChip(model, a, ax, ry - 11, aw), a.name, () => on.pick({ app: a.name }), `app:${a.name}`);
    g.setAttribute('data-id', `app:${a.name}`);
    appNodes.set(a.name, tag(g, { apps: new Set([a.name]) }));
    byGroup[groupOf(a)].append(g);
    if (!laneOf(a)) continue;
    const fault = blockedBy(model, a).length > 0;
    const passes = passesOf(a);
    const fx = bandX(0) - 10, fy = callerY.visitor;
    const lanePath = path(`M${fx},${fy} C${fx + 14},${fy} ${fx - 4},${ry} ${fx + 14},${ry} H${ax}`, fault ? 'fault' : '', { apps: new Set([a.name]) });
    edges.append(lanePath);
    appPaths.set(a.name, lanePath);
    for (const s of passes) edges.append(tag(svg('circle', { cx: bandX(STAGES.indexOf(s)), cy: ry, r: 3.5, class: 'pass' }), { apps: new Set([a.name]) }));
    if (a.capabilities.includes('cron')) {
      edges.append(path(`M${bandX(3) + 6},${boxY} V${ry + 6} Q${bandX(3) + 6},${ry} ${bandX(3) + 12},${ry}`, 'cron', { apps: new Set([a.name]) }));
    }
    for (const n of needs(a)) edges.append(path(curve(ax + aw, ry, cx, capY[n.cap]), n.service && svcFault(model, n.service) ? 'fault' : '', { apps: new Set([a.name]), cap: n.cap }));
  }
  const isolateApps = new Set(groups.isolate.apps.map((a) => a.name));
  if (isolateApps.size) {
    const gy = groups.isolate.y + 13;
    const ry = top - 14;
    edges.append(path(`M${ax + aw},${gy} C${ax + aw + 30},${gy} ${ax + aw + 10},${ry} ${ax + aw + 40},${ry} H${cx + cw + 10} C${sx - 30},${ry} ${sx - 40},${svcY.runner + 22} ${sx},${svcY.runner + 22}`, `group${laneDown(model, 'isolate') ? ' fault' : ''}`, { apps: isolateApps, service: 'runner' }));
  }

  const declarers = (cap) => shown.filter((a) => needs(a).some((n) => n.cap === cap));
  for (const c of CAP_NODES) {
    const who = declarers(c);
    const services = new Set(who.map((a) => needs(a).find((n) => n.cap === c).service).filter(Boolean));
    const fault = [...services].some((s) => svcFault(model, s));
    const [kind, engine] = c.split(':');
    const label = engine ? `db · ${engine === 'sqlite' ? 'SQLite' : 'PostgreSQL'}` : kind;
    const g = act(svg('g', { class: `capn${fault ? ' fault' : ''}${who.length ? '' : ' idle'}`, 'data-id': `cap:${c}` },
      svg('rect', { x: cx, y: capY[c] - 12, width: cw, height: 24, rx: 6, class: 'chipr' }),
      tx(cx + 9, capY[c] + 4, label, 'm chipt'), tx(cx + cw - 9, capY[c] + 4, who.length ? nf(who.length) : '·', 'm t3', { 'text-anchor': 'end' })), label, () => on.pick({ cap: c }), `cap:${c}`);
    nodes.append(tag(g, { cap: c, apps: new Set(who.map((a) => a.name)) }));
    for (const s of services) {
      const apps = new Set(who.filter((a) => needs(a).find((n) => n.cap === c).service === s).map((a) => a.name));
      edges.append(path(curve(cx + cw, capY[c], sx, svcY[s] + 20), svcFault(model, s) ? 'fault' : '', { apps, cap: c, service: s }));
    }
  }
  for (const s of GRAPH_SERVICES) {
    const g = act(serviceNode(model, s, sx, svcY[s], sw, 44), t(`svc.${s}`), () => on.pick({ service: s }), `svc:${s}`);
    nodes.append(tag(g, { service: s, apps: new Set(shown.filter((a) => servicesOf(a).has(s)).map((a) => a.name)) }));
  }

  const H = Math.max(H0, top + 8 + svcSpan + 52, top + 12 + capSpan + 20) + 12;
  el.setAttribute('height', H);
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.append(stripeDefs(), under, edges, nodes, flows);

  /** Selection reads the graph: an app lights its path, a capability its declarers, a service its dependents. */
  const select = (sel) => {
    el.classList.toggle('picking', Boolean(sel));
    if (!sel) { for (const p of parts) p.el.classList.remove('lit'); return; }
    const apps = sel.app ? new Set([sel.app])
      : sel.cap ? new Set(declarers(sel.cap).map((a) => a.name))
        : new Set(shown.filter((a) => servicesOf(a).has(sel.service)).map((a) => a.name));
    const caps = new Set(shown.filter((a) => apps.has(a.name)).flatMap((a) => needs(a).filter((n) => !sel.service || n.service === sel.service).map((n) => n.cap)));
    if (sel.cap) { caps.clear(); caps.add(sel.cap); }
    const services = new Set(shown.filter((a) => apps.has(a.name)).flatMap((a) => needs(a).filter((n) => caps.has(n.cap)).map((n) => n.service)).filter(Boolean));
    if (sel.service) services.add(sel.service);
    if (sel.app && laneOf(shown.find((a) => a.name === sel.app) ?? {}) === 'isolate') services.add('runner');
    const stages = new Set(shown.filter((a) => apps.has(a.name)).flatMap(passesOf));
    for (const p of parts) {
      const mine = p.apps && [...p.apps].some((n) => apps.has(n));
      const lit = p.node === 'visitor' || p.node === 'caller' ? apps.size > 0
        : p.stage ? stages.has(p.stage)
          : p.node === 'scheduler' ? shown.some((a) => apps.has(a.name) && a.capabilities.includes('cron'))
            : p.group ? mine
              : p.cap && p.service ? mine && caps.has(p.cap) && services.has(p.service)
                : p.cap && p.el.tagName === 'path' ? mine && caps.has(p.cap)
                  : p.cap ? caps.has(p.cap)
                    : p.service ? services.has(p.service) && (p.el.tagName !== 'path' || mine)
                      : Boolean(mine);
      p.el.classList.toggle('lit', lit);
    }
  };
  return {
    el,
    select,
    flow(name) {
      const lanePath = appPaths.get(name);
      if (!lanePath) return;
      const moved = particle(flows, [visitorPath, lanePath]);
      const chip = appNodes.get(name);
      if (chip) setTimeout(() => glow(chip, 'hit'), moved ? 900 : 0);
    },
  };
}

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/** flash() for SVG, which has no offsetWidth to restart an animation with. */
function glow(el, cls) {
  el.classList.remove(cls);
  void el.getBoundingClientRect();
  el.classList.add(cls);
  clearTimeout(el.glowed);
  el.glowed = setTimeout(() => el.classList.remove(cls), 1600);
}

/** A packet along consecutive paths (ADR 0015: motion only for something that happened); none under reduced motion or past the cap. */
function particle(layer, paths, delay = 0) {
  if (layer.childElementCount >= MAX_PARTICLES) return false;
  for (const p of paths) glow(p, 'hot');
  if (reduced()) return false;
  const g = svg('g', { class: 'pk', opacity: 0 }, svg('circle', { r: 7, class: 'halo' }), svg('circle', { r: 3.5 }));
  layer.append(g);
  const lengths = paths.map((p) => p.getTotalLength());
  const total = lengths.reduce((s, n) => s + n, 0);
  const duration = 420 * paths.length;
  let start = null;
  const step = (now) => {
    if (!g.isConnected) return;
    start ??= now + delay;
    const f = (now - start) / duration;
    if (f >= 1) return g.remove();
    if (f >= 0) {
      let d = (1 - (1 - f) ** 2) * total;
      let i = 0;
      while (i < lengths.length - 1 && d > lengths[i]) { d -= lengths[i]; i++; }
      const pt = paths[i].getPointAtLength(d);
      g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
      g.setAttribute('opacity', 1);
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return true;
}

const TOPO_VIEWS = ['lane', 'graph'];
let topoView = TOPO_VIEWS.includes(store.get('pneuma-space-topology')) ? store.get('pneuma-space-topology') : 'lane';

function topology() {
  const show = claim();
  const model = topoModel();
  const header = liveHeader('live.lastRequest', () => refresh());
  const banner = h('div', { class: 'card faults', role: 'alert' });
  const sceneBox = h('div', { class: 'inset topo', 'data-section': 'topology' });
  const panel = h('div');
  const pickBar = h('div', { class: 'pickbar' });
  const errBox = h('div', { class: 'msg err pickbar', role: 'alert' });
  let errTimer = 0;
  const clearError = () => { clearTimeout(errTimer); fill(errBox); };
  const showError = (message) => { clearError(); fill(errBox, message); errTimer = setTimeout(clearError, 10_000); };
  let explained = null;
  let selection = null;
  let filter = '';
  let scene = null;
  let painted = '';
  let faultsPainted = '';
  const live = () => ({ ...model, apps: model.apps.filter((a) => a.status === 'registered') });
  const filterInput = h('input', { type: 'search', name: 'filter', placeholder: t('apps.filter'), 'aria-label': t('apps.filter'), oninput: () => { filter = filterInput.value.trim().toLowerCase(); paint(); } });
  const tools = h('div', { class: 'topo-tools' });
  const secHead = h('div');
  const renderChrome = () => {
    fill(secHead, sectionHead(1, `tp.sec.${topoView}`, `tp.sec.${topoView}Desc`));
    fill(tools, h('div', {}, filterInput, h('span', { class: 'muted' }, t(`tp.${topoView}Hint`, { n: topoView === 'graph' ? GRAPH_CAP : LANE_CAP })), segmented(TOPO_VIEWS.map((v) => [v, t(`tp.view.${v}`)]), topoView, (v) => {
      topoView = v;
      store.set('pneuma-space-topology', v);
      selection = null;
      renderChrome();
      paint();
    }, t('tp.view'))));
  };
  renderChrome();

  const lift = async (name) => {
    clearError();
    try {
      await api('POST', `${appPath(name)}/unquarantine`);
      model.apps = await api('GET', '/api/apps');
      paint();
    } catch (error) {
      showError(error.message);
    }
  };
  const on = {
    open: (name) => { location.hash = `#/apps/${encodeURIComponent(name)}`; },
    explain: (kind) => {
      clearError();
      explained = explained === kind ? null : kind;
      fill(panel, explained ? explainPanel(model, explained) : null);
      if (explained) panel.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
    },
    lift,
    pick: (sel) => {
      clearError();
      const same = selection && JSON.stringify(selection) === JSON.stringify(sel);
      selection = same ? null : sel;
      scene?.select?.(selection);
      renderPick();
    },
  };
  const renderPick = () => {
    if (topoView !== 'graph' || !selection) return fill(pickBar);
    const local = live();
    if (selection.app) {
      const a = local.apps.find((x) => x.name === selection.app);
      if (!a) return fill(pickBar);
      return fill(pickBar,
        appLink(a.name), runtimeChip(a), laneOf(a) ? status(a.instance) : null,
        a.quarantine ? [h('span', { class: 'st red' }, `${t('att.quarantine')} · ${a.quarantine.reason}`), h('button', { class: 'btn', type: 'button', onclick: () => lift(a.name) }, t('tp.lift'))] : null,
        blockedBy(local, a).map((s) => h('span', { class: 'st red' }, t('tp.needs', { name: t(`svc.${s}`), status: t(`st.${svcStatus(local, s)}`) }))),
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => on.pick(selection) }, t('tp.clear')));
    }
    const label = selection.cap ?? t(`svc.${selection.service}`);
    const n = selection.cap ? local.apps.filter((a) => needs(a).some((x) => x.cap === selection.cap)).length : dependents(local, selection.service).length;
    fill(pickBar, h('b', { class: 'mono' }, label), h('span', { class: 'muted' }, plural('tp.dependents', n)),
      h('button', { class: 'btn ghost small', type: 'button', onclick: () => on.pick(selection) }, t('tp.clear')));
  };

  /** An old scene with packets in flight stays on top, invisible except its packets, until they land. */
  const retire = (old) => {
    if (!old.querySelector('.pk')) return old.remove();
    const at = scene.el.getBoundingClientRect(), box = sceneBox.getBoundingClientRect();
    old.classList.add('retired');
    old.setAttribute('inert', '');
    old.setAttribute('aria-hidden', 'true');
    old.style.left = `${at.left - box.left + sceneBox.scrollLeft}px`;
    old.style.top = `${at.top - box.top + sceneBox.scrollTop}px`;
    setTimeout(() => old.remove(), 2000);
  };

  /** Rebuilds the scene only when its structure changed; per-sample numbers change in place. */
  const paint = () => {
    if (!model.health) return;
    const local = live();
    const faults = faultsOf(local);
    const faultSig = JSON.stringify([faults, model.health.runtimes.isolate.profile]);
    if (faultSig !== faultsPainted) {
      faultsPainted = faultSig;
      fill(banner, faultItems(local, faults));
    }
    const registered = local.apps;
    const width = sceneBox.clientWidth - 24;
    const matching = registered.filter((a) => !filter || a.name.includes(filter));
    let shown = matching;
    const hidden = {};
    if (topoView === 'graph') {
      shown = [...matching].sort((a, b) => (b.lastAccessAt ?? 0) - (a.lastAccessAt ?? 0) || a.name.localeCompare(b.name)).slice(0, GRAPH_CAP).sort((a, b) => a.name.localeCompare(b.name));
      for (const a of registered) if (!shown.includes(a)) hidden[groupOf(a)] = (hidden[groupOf(a)] ?? 0) + 1;
    }
    const signature = JSON.stringify([topoView, width, filter, hidden, model.health, SERVICES.map((s) => svcStatus(model, s)),
      shown.map((a) => [a.name, a.release, a.runtime, a.instance, a.quarantine, a.capabilities, a.dbBackend, a.node])]);
    if (signature !== painted) {
      painted = signature;
      const focused = sceneBox.contains(document.activeElement) ? document.activeElement.dataset.key : null;
      const old = scene?.el;
      scene = topoView === 'graph' ? graphScene(local, width, shown, hidden, on) : laneScene(local, width, shown, on);
      sceneBox.prepend(scene.el);
      if (old) retire(old);
      if (focused) {
        const find = (key) => scene.el.querySelector(`[data-key="${CSS.escape(key)}"]`);
        (find(focused) ?? find(focused.replace(/^lift:/, 'app:')))?.focus({ preventScroll: true });
      }
      if (selection) scene.select?.(selection);
      renderPick();
      if (explained) fill(panel, explainPanel(model, explained));
    }
    for (const el of sceneBox.querySelectorAll('[data-latency]')) el.textContent = ms(model.services[el.dataset.latency]?.latencyMs);
  };
  const resize = new ResizeObserver(() => (sceneBox.isConnected ? paint() : resize.disconnect()));
  resize.observe(sceneBox);

  show(
    h('div', { class: 'head' }, h('div', { class: 'grow' }, h('h1', {}, t('tp.title')), h('p', { class: 'sub' }, t('tp.sub'))), header.el),
    h('section', { class: 'topo-sec' }, secHead, banner, tools, pickBar, errBox, sceneBox, panel),
  );

  const loadApps = async () => {
    const [apps, health] = await Promise.all([api('GET', '/api/apps'), api('GET', '/api/health')]);
    model.apps = apps;
    model.health = health;
  };
  const loadMetrics = async () => {
    const m = await api('GET', '/api/metrics');
    if (model.startedAt !== null && m.gateway.startedAt > model.startedAt) header.restarted(m.gateway.startedAt);
    model.startedAt = Math.max(model.startedAt ?? 0, m.gateway.startedAt);
    model.services = m.services;
  };

  const pollRequests = header.guarded(async () => {
    if (!scene) return;
    const seeding = model.cursor === null;
    const { records, cursor } = await api('GET', `/api/requests?after=${encodeURIComponent(model.cursor ?? '')}&limit=${REQUEST_RING}`);
    model.cursor = cursor;
    if (records.length) model.last = records.at(-1).t;
    header.seen(model.last);
    if (seeding || !records.length) return;
    header.beat();
    const counts = new Map();
    for (const r of records) counts.set(r.app, (counts.get(r.app) ?? 0) + 1);
    for (const [name, n] of counts) {
      for (let i = 0; i < Math.min(n, FLOWS_PER_APP); i++) setTimeout(() => scene.flow(name), i * 220);
    }
  });
  const refresh = header.guarded(async () => {
    await Promise.all([loadApps(), loadMetrics()]);
    paint();
    await pollRequests();
  });
  return {
    loops: [[APPS_MS, header.guarded(async () => { await loadApps(); paint(); })], [METRICS_MS, header.guarded(async () => { await loadMetrics(); paint(); })], [REQUESTS_MS, pollRequests]],
    first: refresh,
  };
}

// Cluster (ADR 0026): one sample, shaped by what the operator asks of it in turn: is the platform healthy, what is off and what fixes it, what runs where, this app.

const ZONE_LABELS = ['topology.kubernetes.io/zone', 'node.kubernetes.io/instance-type'];
const RESTARTABLE = ['gateway', 'runner'];
/** The health board's order: the platform's own processes, then what they depend on. */
const COMPONENTS = ['gateway', 'runner', 'postgres', 'redis', 'object', 'store', 'coturn', 'registry'];
/** Stuck sorts first: it is what the operator came for. */
const BUCKETS = ['stuck', 'waking', 'awake', 'draining', 'stopping'];
const TRANSIT = ['waking', 'draining', 'stopping'];
/** Past the default wake and drain timeouts (15 s, 30 s) with room to spare; an app that raised its own timeouts can show here early. */
const STUCK_MS = 60_000;
/** A warning on an object that is ready again stays this long after its last occurrence; on a gone object, never. */
const WARNING_MS = 5 * 60_000;
/** Kubernetes reasons the console says in words; any other shows as its code. */
const REASONS = ['Unhealthy', 'FailedScheduling', 'BackOff', 'FailedMount', 'FailedCreate', 'Evicted', 'OOMKilled', 'ImagePullBackOff', 'ErrImagePull'];
const reasonText = (r) => (REASONS.includes(r) ? t(`cl.reason.${r}`) : r);

const roleOf = (w) => (w.role === 'rustfs' ? 'object' : w.role);
const podLabel = (name) => name.replace(/^pneuma-space-/, '');
const forTick = (v) => h('time', { datetime: new Date(v).toISOString(), title: stamp(v) }, ticking(() => duration(Date.now() - v)));
const handle = (id) => (id && /^[0-9a-f]{64}$/.test(id) ? id.slice(0, 12) : podLabel(id ?? '-'));

function cluster() {
  const show = claim();
  const header = liveHeader('cl.sampled', () => refresh());
  const host = hostCard();
  let view = null;
  let metrics = null;
  /** App name to its listing, fresher than the 15 s sample: the state shown after an operation comes from here. */
  let live = new Map();
  /** Object key ('workload:', 'node:', 'app:') to { busy } or the outcome { error } / { note }. */
  const ops = new Map();
  /** App name to the limits set here that apply from its next wake. */
  const nextWake = new Map();
  /** Pod name to when it was first seen not ready; a Pod never seen ready counts from its start. */
  const unready = new Map();
  const wasReady = new Set();
  /** Disclosures the operator opened: 'pods:<workload>', 'others:<node>', 'class:<name>', 'raw'. */
  const opened = new Set();
  const filter = { bucket: '', tenant: '' };
  const k8s = () => (view?.plane ?? session.plane) === 'kubernetes';

  const parts = { health: h('div', { class: 'board' }), attention: h('div'), placement: h('div'), filters: h('div', { class: 'fchips' }), instances: h('div', { class: 'ilist' }), storage: h('div') };
  const search = h('input', { type: 'search', name: 'search', placeholder: t('cl.f.search'), 'aria-label': t('cl.f.search'), oninput: () => paint() });
  const head = h('div', { class: 'head' });
  const sections = h('div', { class: 'cl' });

  const pods = () => view.workloads.flatMap((w) => w.pods);
  const trackPods = () => {
    const now = Date.now();
    for (const p of pods()) {
      if (p.ready) { unready.delete(p.name); wasReady.add(p.name); } else if (!unready.has(p.name)) unready.set(p.name, wasReady.has(p.name) ? now : p.startedAt ?? now);
    }
  };
  const podState = (p) => (p.ready ? 'ready' : Date.now() - (unready.get(p.name) ?? Date.now()) < STUCK_MS ? 'starting' : 'down');
  const stuck = (i) => TRANSIT.includes(i.state) && i.since != null && Date.now() - i.since > STUCK_MS;

  const painted = new Map();
  /** A part is rebuilt only when what it shows changed, never under an open menu or a field being typed in, so the polls keep hover, focus and edits. */
  const repaint = (name, shown, build) => {

  /** An outcome's `until` says when the state it reports is gone; the note then clears itself. */

    try {

  const restartPod = async (pod) => {

  const attentionItems = (rows) => {

    const where = k8s() ? [i.node, i.pod && handle(i.pod)].filter(Boolean) : [i.runtime === 'isolate' ? t('svc.runner') : i.pod && handle(i.pod)].filter(Boolean);
    const placing = where.length === 0 && i.state === 'waking';
    return h('div', { class: `irow${stuck(i) ? ' stuck' : ''}`, 'data-app': i.app },
      h('i', { class: `pdot ${stuck(i) ? 'down' : i.state === 'awake' ? 'ready' : 'starting'}`, title: t(`st.${i.state}`) }),
      h('div', { class: 'iname' }, appLink(i.app), i.runtime ? h('span', { class: 'chip runtime' }, i.runtime) : null, h('span', { class: 'muted' }, i.tenant)),
      h('div', { class: 'iwhere mono', title: [i.node, i.pod].filter(Boolean).join(' → ') }, where.length ? where.flatMap((w, n) => [n ? h('span', { class: 'muted' }, '→') : null, h('span', {}, w)]) : h('span', { class: 'muted' }, t(placing ? 'cl.placing' : 'cl.unplaced')),
        i.restarts ? h('span', { class: 'st orange' }, t('cl.restarts', { n: nf(i.restarts) })) : null),
      h('div', { class: 'isince num', title: t('cl.sinceTitle', { state: t(`st.${i.state}`), at: stamp(i.since) }) }, ticking(() => duration(Date.now() - i.since))),
      h('div', { class: 'leases', title: t('cl.leasesTitle') }, LEASE_KINDS.map((k) => h('span', { class: (i.leases?.[k] ?? 0) > 0 ? 'on' : null }, t(`cl.lease.${k}`), h('b', { class: 'num' }, nf(i.leases?.[k] ?? 0))))),
      h('div', { class: 'ilim' }, placing ? null : [i.runtime === 'isolate' ? null : limitChip(i, 'cpu_millis'), limitChip(i, 'memory_mb')],
        volumes.map((v) => h('span', { class: 'chip vol', title: [v.name, v.storageClass, v.phase].filter(Boolean).join(' · ') }, t('cl.vol', { size: v.sizeGb == null ? '-' : t('cl.gib', { n: nf(v.sizeGb) }) })))),
      h('div', { class: 'iact' }, spin(key),
        tenantAdmin ? quiet(t('cl.stop'), () => lifecycle(i, 'stop'), t('cl.stopFor', { app: i.app }), busy(key)) : null,
        tenantAdmin ? quiet(t('cl.restart'), () => lifecycle(i, 'restart'), t('cl.restartFor', { name: i.app }), busy(key)) : null,
        isPlatformAdmin() ? killMenu(i) : null),
      outcome(key));
  };
  const paintInstances = (rows) => {
    const needle = search.value.trim().toLowerCase();
    const shown = rows.filter((i) => (!filter.bucket || bucketOf(i) === filter.bucket) && (!filter.tenant || i.tenant === filter.tenant)
      && (!needle || [i.app, i.tenant, i.node, i.pod].some((f) => f && f.toLowerCase().includes(needle))));
    const volumes = Map.groupBy(view.volumes, (v) => v.app);
    repaint('instances', [shown, shown.map(stuck), [...ops], [...nextWake], view.volumes], () => (shown.length === 0
      ? h('div', { class: 'card' }, h('div', { class: 'empty' }, t(rows.length ? 'empty.filtered' : 'empty.cl.instances')))
      : BUCKETS.map((b) => {
        const mine = shown.filter((i) => bucketOf(i) === b);
        return mine.length ? h('div', { class: `igroup ${b}`, 'data-bucket': b },
          h('div', { class: 'igh' }, h('span', { class: `st ${b === 'stuck' ? 'red' : tone(b)}` }, t(b === 'stuck' ? 'cl.f.stuck' : `st.${b}`)), h('span', { class: 'num muted' }, nf(mine.length))),
          mine.map((i) => instanceRow(i, volumes.get(i.app) ?? []))) : null;
      })));
  };

  const storage = () => {
    if (view.volumes.length === 0) return h('div', { class: 'card' }, h('div', { class: 'empty' }, t('empty.cl.volumes')));
    const classes = [...Map.groupBy(view.volumes, (v) => v.storageClass ?? '')].sort(([a], [b]) => a.localeCompare(b));
    return h('div', { class: 'card slist' }, classes.map(([name, list]) => disclosure(`class:${name}`,
      [h('b', { class: name ? 'mono' : null }, name || planeT('svc.volumes')), h('span', { class: 'muted' }, plural('cl.vols', list.length)),
        h('span', { class: 'num' }, t('cl.gib', { n: nf(list.reduce((n, v) => n + (v.sizeGb ?? 0), 0)) }))],
      h('div', { class: 'vlist' }, [...list].sort((a, b) => a.app.localeCompare(b.app)).map((v) => h('div', { class: 'vline' },
        appLink(v.app), h('span', { class: 'mono muted' }, v.name), h('span', { class: 'num' }, v.sizeGb == null ? '-' : t('cl.gib', { n: nf(v.sizeGb) })),
        v.phase ? h('span', { class: `st ${v.phase === 'Bound' ? 'green' : 'orange'}` }, v.phase) : null))))));
  };

  let layout = '';
  const paintLayout = () => {
    const shape = `${k8s()}`;
    if (shape === layout) return;
    layout = shape;
    painted.clear();
    fill(head, h('div', { class: 'grow' }, h('h1', {}, planeT('nav.cluster')), h('p', { class: 'sub' }, planeT('cl.sub'))), header.el);
    const section = (n, key, body, ...end) => h('section', { 'data-section': key }, sectionHead(n, planeKey(`cl.sec.${key}`), planeKey(`cl.sec.${key}Desc`), ...end), body);
    fill(sections,
      section(1, 'health', parts.health),
      section(2, 'attention', parts.attention),
      section(3, 'placement', parts.placement),
      section(4, 'instances', [h('div', { class: 'ifilter' }, parts.filters, search), parts.instances]),
      section(5, 'storage', parts.storage));
  };

  const paint = () => {
    if (!view) return;
    for (const [key, op] of ops) if (op.until?.()) ops.delete(key);
    const rows = instances();
    paintLayout();
    const podStates = pods().map((p) => [p.name, podState(p)]);
    repaint('health', [view.workloads, podStates, [...ops], [...opened], view.scaleMax], () => ordered().map(card));
    const items = attentionItems(rows);
    repaint('attention', [items.map((i) => [i.tone, i.at, i.why, i.object]), opened.has('raw'), view.warnings.length], () => attention(items));
    if (k8s()) {
      repaint('placement', [view.nodes, view.workloads, rows.map((i) => [i.app, i.state, i.node, i.since, stuck(i)]), podStates, [...ops], [...opened]], () => h('div', { class: 'nodes' }, view.nodes.length ? view.nodes.map((n) => frame(n, rows)) : h('div', { class: 'card' }, h('div', { class: 'empty' }, t('ov.waiting')))));
    } else {
      if (parts.placement.firstChild !== host.el) fill(parts.placement, host.el);
      if (metrics) host.render(metrics, null);
    }
    paintFilters(rows);
    paintInstances(rows);
    repaint('storage', [view.volumes, [...opened]], storage);
  };

  const loadApps = async () => {
    const apps = await api('GET', '/api/apps');
    const before = JSON.stringify([...live.values()].map((a) => [a.name, a.instance]));
    live = new Map(apps.map((a) => [a.name, a]));
    return before !== JSON.stringify(apps.map((a) => [a.name, a.instance]));
  };
  const loadCluster = async () => {
    view = await api('GET', '/api/cluster');
    if (view.plane === 'docker') metrics = await api('GET', '/api/metrics');
    trackPods();
    header.seen(view.sampledAt);
  };
  const load = () => Promise.all([loadCluster(), loadApps()]);
  const refresh = header.guarded(async () => { await load(); paint(); });
  /** A lifecycle change seen in the listing fetches the sample again, for the node and Pod it moved to. */
  const pollApps = header.guarded(async () => {
    if (!view) return;
    if (await loadApps()) { header.beat(); await loadCluster(); }
    paint();
  });

  fill(head, h('div', { class: 'grow' }, h('h1', {}, planeT('nav.cluster')), h('p', { class: 'sub' }, planeT('cl.sub'))), header.el);
  show(head, sections);
  return { loops: [[CLUSTER_MS, refresh], [APPS_MS, pollApps]], first: refresh };
}

const NAV = [['overview', '#/'], ['realtime', '#/realtime'], ['topology', '#/topology'], ['cluster', '#/cluster'], ['team', '#/team'], ['apps', '#/apps'], ['publish', '#/publish']];
const PLATFORM_VIEWS = ['overview', 'realtime', 'topology', 'cluster'];
const allowed = (key) => (PLATFORM_VIEWS.includes(key) ? isPlatformAdmin() : key === 'team' ? upstream() : session !== null);

/** The page a hash shows: an unknown view is the overview, and a page the caller may not see is the project list. */
function viewOf(hash) {
  const [, view] = hash.split('?')[0].split('/');
  const key = NAV.some(([k]) => k === view) ? view : 'overview';
  return allowed(key) ? key : 'apps';
}
function shell() {
  const current = viewOf(location.hash);
  topbar();
  document.querySelector('nav').replaceChildren(h('div', { class: 'group' }, t('nav.group')),
    ...NAV.filter(([key]) => allowed(key)).map(([key, href]) => {
      const label = planeT(`nav.${key}`);
      return h('a', { href, 'aria-current': key === current ? 'page' : null, 'aria-label': label }, icon(`nav-${key}`), h('span', { class: 'label' }, label));
    }));
  document.getElementById('brand-sub').textContent = t('brand.sub');
  const theme = root.dataset.theme;
  const setTheme = (value) => {
    store.set('pneuma-space-theme', value);
    root.dataset.theme = value;
    shell();
  };
  const setLang = (value) => {
    store.set('pneuma-space-lang', value);
    lang = root.lang = value;
    route();
  };
  const toTheme = theme === 'dark' ? 'light' : 'dark';
  const toLang = lang === 'zh' ? 'en' : 'zh';
  const themeLabel = t(toTheme === 'dark' ? 'theme.toDark' : 'theme.toLight');
  const langLabel = t(toLang === 'zh' ? 'lang.toZh' : 'lang.toEn');
  document.querySelector('.controls').replaceChildren(
    segmented([['light', icon('sun'), t('theme.light')], ['dark', icon('moon'), t('theme.dark')]], theme, setTheme, 'theme'),
    segmented([['zh', '中'], ['en', 'EN']], lang, setLang, 'language'));
  document.querySelector('.rail-controls').replaceChildren(
    h('button', { class: 'ibtn', type: 'button', title: themeLabel, 'aria-label': themeLabel, onclick: () => setTheme(toTheme) }, icon(theme === 'dark' ? 'moon' : 'sun')),
    h('button', { class: 'ibtn', type: 'button', title: langLabel, 'aria-label': langLabel, onclick: () => setLang(toLang) },
      h('span', { class: 'glyph', 'aria-hidden': 'true' }, lang === 'zh' ? [h('b', {}, '中'), '/EN'] : ['中/', h('b', {}, 'EN')])));
  for (const [selector, key] of [['.collapse', 'nav.collapse'], ['.expand', 'nav.expand']]) {
    const button = document.querySelector(selector);
    button.replaceChildren(icon('panel'));
    button.title = t(key);
    button.setAttribute('aria-label', t(key));
  }
  navState();
}

/** The collapse toggle changes attributes only, so the labels and rows transition instead of being rebuilt. */
function navState() {
  const rail = root.dataset.nav === 'rail';
  for (const a of document.querySelectorAll('nav a')) a.title = rail ? a.getAttribute('aria-label') : '';
  document.querySelector('.brand').tabIndex = rail ? -1 : 0;
  for (const [selector, to] of [['.collapse', 'rail'], ['.expand', 'wide']]) {
    const button = document.querySelector(selector);
    const shown = rail === (to === 'wide');
    button.setAttribute('aria-hidden', String(!shown));
    button.tabIndex = shown ? 0 : -1;
    button.onclick = () => {
      root.dataset.nav = to;
      store.set('pneuma-space-nav', to);
      navState();
      document.querySelector(to === 'rail' ? '.expand' : '.collapse').focus({ preventScroll: true });
    };
  }
}

/** Each loop runs only while the tab is visible and stops when the route changes. */
function every(loops, gen) {
  const run = (ms, fn) => setTimeout(async () => {
    if (gen !== generation) return;
    if (!document.hidden) await fn().catch(() => {});
    run(ms, fn);
  }, ms);
  for (const [ms, fn] of loops) run(ms, fn);
  document.onvisibilitychange = () => { if (!document.hidden && gen === generation) for (const [, fn] of loops) fn().catch(() => {}); };
}

async function route() {
  const gen = ++generation;
  document.onvisibilitychange = null;
  crosshair.reset();
  try {
    session ??= await loadSession();
  } catch (error) {
    if (gen !== generation) return;
    shell();
    return fill(main(), h('div', { class: 'head' }, h('p', { class: 'msg err' }, t('err.load', { msg: error.message }))));
  }
  if (gen !== generation) return;
  shell();
  const [, , name] = location.hash.split('?')[0].split('/');
  const view = viewOf(location.hash);
  const target = name && decodeURIComponent(name);
  try {
    const live = view === 'apps' && target ? await detail(target)
      : view === 'apps' ? await projects()
        : view === 'publish' ? (await publish(target), null)
          : view === 'team' ? (await team(), null)
            : view === 'realtime' ? realtime()
              : view === 'topology' ? topology()
                : view === 'cluster' ? cluster()
                : await overview();
    if (gen !== generation) return;
    if (typeof live === 'function') {
      await live();
      if (gen === generation) every([[POLL_MS, live]], gen);
    } else if (live) {
      await live.first();
      if (gen === generation) every(live.loops, gen);
    }
  } catch (error) {
    if (gen === generation) fill(main(), h('div', { class: 'head' }, h('div', { class: 'grow' }, h('p', { class: 'msg err' }, t('err.load', { msg: error.message })), h('p', {}, h('a', { class: 'btn ghost small', href: '#/apps' }, `← ${t('d.back')}`)))));
  }
}

setInterval(() => { if (!document.hidden) for (const el of document.querySelectorAll('[data-tick]')) el.tick?.(); }, 1000);
addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', shell);
route();
</script>
