apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes
  - ingress.yaml
patches:
  - target: { kind: ConfigMap, name: pneuma-space-gateway, namespace: pneuma-space }
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pneuma-space-gateway
        namespace: pneuma-space
      data:
        PNEUMA_SPACE_IDENTITY: hosted
        PNEUMA_SPACE_HOSTED_DEVELOPMENT: "false"
        PNEUMA_SPACE_HOSTED_CONTROL_ORIGIN: https://console.example.com
        PNEUMA_SPACE_APPS_ORIGIN: https://*.apps.example.net
        PNEUMA_SPACE_HOSTED_GITHUB_CLIENT_ID: REPLACE_ME_GITHUB_CLIENT_ID
        PNEUMA_SPACE_HOSTED_ALLOWED_SUBJECTS: REPLACE_ME_GITHUB_NUMERIC_IDS
        PNEUMA_SPACE_HOSTED_SIGNUP_LIMIT: "20"
  - target: { kind: Secret, name: pneuma-space-secrets, namespace: pneuma-space }
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pneuma-space-secrets
        namespace: pneuma-space
      stringData:
        PNEUMA_SPACE_HOSTED_GITHUB_CLIENT_SECRET: REPLACE_ME_GITHUB_CLIENT_SECRET
