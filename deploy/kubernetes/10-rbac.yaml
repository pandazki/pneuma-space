apiVersion: v1
kind: ServiceAccount
metadata:
  name: pneuma-space-gateway
  namespace: pneuma-space
  labels:
    app.kubernetes.io/part-of: pneuma-space
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pneuma-space-gateway
  namespace: pneuma-space-apps
  labels:
    app.kubernetes.io/part-of: pneuma-space
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pneuma-space-gateway
  namespace: pneuma-space-apps
  labels:
    app.kubernetes.io/part-of: pneuma-space
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pneuma-space-gateway
subjects:
  - kind: ServiceAccount
    name: pneuma-space-gateway
    namespace: pneuma-space
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pneuma-space-gateway
  namespace: pneuma-space
  labels:
    app.kubernetes.io/part-of: pneuma-space
rules:
  # delete: the cluster page restarts gateway and runner Pods; the gateway checks the role label, RBAC cannot (ADR 0026 item 5).
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [pneuma-space-gateway]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames: [pneuma-space-runner]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pneuma-space-gateway
  namespace: pneuma-space
  labels:
    app.kubernetes.io/part-of: pneuma-space
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pneuma-space-gateway
subjects:
  - kind: ServiceAccount
    name: pneuma-space-gateway
    namespace: pneuma-space
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pneuma-space-gateway-nodes
  labels:
    app.kubernetes.io/part-of: pneuma-space
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pneuma-space-gateway-nodes
  labels:
    app.kubernetes.io/part-of: pneuma-space
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pneuma-space-gateway-nodes
subjects:
  - kind: ServiceAccount
    name: pneuma-space-gateway
    namespace: pneuma-space
---
# Instance Pods run as this account; it has no rules and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pneuma-space-app
  namespace: pneuma-space-apps
  labels:
    app.kubernetes.io/part-of: pneuma-space
automountServiceAccountToken: false
