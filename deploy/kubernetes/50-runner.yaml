# isolate runners (ADR 0019 item 8). Scale up only: an app whose home replica is removed stays unavailable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pneuma-space-runner
  namespace: pneuma-space
  labels:
    app.kubernetes.io/part-of: pneuma-space
    pneuma-space.role: runner
spec:
  serviceName: runner
  replicas: 2
  selector:
    matchLabels:
      pneuma-space.role: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pneuma-space
        pneuma-space.role: runner
    spec:
      automountServiceAccountToken: false
      # Workers inherit this process's environment, so it carries nothing beyond the runner's own settings.
      enableServiceLinks: false
      imagePullSecrets:
        - name: pneuma-space-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    pneuma-space.role: runner
      containers:
        - name: runner
          image: pneuma-space-gateway
          command:
            - node
            - --disable-warning=ExperimentalWarning
            - --disable-warning=SecurityWarning
            - --permission
            - --allow-fs-read=/data
            - --allow-fs-read=/gateway
            - --allow-fs-write=/data
            - --allow-worker
            - src/runner.ts
          env:
            - name: PNEUMA_SPACE_RUNNER_PORT
              value: "8082"
            - name: PNEUMA_SPACE_RUNNER_WORKER_HEAP_MB
              value: "256"
            - name: PNEUMA_SPACE_RUNNER_WORKER_OFFHEAP_MB
              value: "256"
            - name: PNEUMA_SPACE_RUNNER_STUCK_LIMIT
              value: "3"
          ports:
            - name: control
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: control
            periodSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: pneuma-space
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: pneuma-space
  labels:
    app.kubernetes.io/part-of: pneuma-space
spec:
  clusterIP: None
  selector:
    pneuma-space.role: runner
  ports:
    - name: control
      port: 8082
      targetPort: control
