<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static site</title>
<script>
try { var theme = localStorage.getItem('pneuma-space-theme'), lang = localStorage.getItem('pneuma-space-lang'); } catch (e) {}
document.documentElement.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.lang = lang || (/^zh/i.test(navigator.language) ? 'zh' : 'en');
</script>
<style>
:root {
  --page: oklch(98.5% .001 286.376);
  --canvas: oklch(96.1% .002 247.84);
  --surface: oklch(100% 0 0);
  --inset: oklch(97.9% .002 247.839);
  --hover: oklch(97% .002 247.839);
  --hover-2: oklch(93.3% .003 247.86);
  --ink: oklch(24.7% .006 258.361);
  --ink-2: oklch(50.6% .01 264.477);
  --ink-3: oklch(69.5% .009 264.505);
  --line: oklch(94.6% .003 264.542);
  --line-strong: oklch(91.2% .005 258.326);
  --line-soft: oklch(96.6% .002 264.542);
  --field: oklch(96.1% .001 286.375);
  --stripe: oklch(40.5% 0 0 / .075);
  --stripe-bg: oklch(97% 0 0);
  --accent: oklch(62.6% .205 254.947);
  --accent-ink: oklch(55.6% .187 255.617);
  --accent-tint: oklch(96% .019 252.878);
  --green: oklch(60.3% .155 150.883);
  --green-tint: oklch(95.8% .017 159.118);
  --orange: oklch(68.9% .179 49.902);
  --orange-tint: oklch(96.4% .021 67.581);
  --red: oklch(62.1% .192 23.042);
  --red-tint: oklch(95.6% .017 17.462);
  --tip-bg: oklch(27.2% .008 264.435);
  --tip-fg: oklch(97.6% .002 247.839);
  --shadow-xs: 0 1px 2px oklch(0% 0 0 / .05);
  --shadow-sm: 0 1px 2px oklch(0% 0 0 / .06), 0 2px 6px oklch(0% 0 0 / .04);
  --shadow-card: 0 0 0 1px var(--line), var(--shadow-sm);
  --shadow-btn: 0 0 0 1px var(--line-strong), var(--shadow-xs);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --page: oklch(20.9% .004 264.477);
  --canvas: oklch(23.1% .004 264.487);
  --surface: oklch(26% .006 271.191);
  --inset: oklch(24.3% .004 264.492);
  --hover: oklch(28.9% .006 271.22);
  --hover-2: oklch(31.8% .007 274.747);
  --ink: oklch(96.4% .002 247.839);
  --ink-2: oklch(73.1% .008 260.731);
  --ink-3: oklch(54.1% .01 264.484);
  --line: oklch(30.8% .006 258.354);
  --line-strong: oklch(35.6% .007 264.474);
  --line-soft: oklch(27.8% .006 258.354);
  --field: oklch(29.3% .006 271.223);
  --stripe: oklch(100% 0 0 / .055);
  --stripe-bg: oklch(22.6% .004 264.485);
  --accent: oklch(68% .173 253.301);
  --accent-ink: oklch(78.8% .113 248.33);
  --accent-tint: oklch(68% .173 253.301 / .16);
  --green: oklch(70.5% .154 153.814);
  --green-tint: oklch(70.5% .154 153.814 / .14);
  --orange: oklch(74.6% .156 55.642);
  --orange-tint: oklch(74.6% .156 55.642 / .14);
  --red: oklch(66.6% .18 21.433);
  --red-tint: oklch(66.6% .18 21.433 / .14);
  --tip-bg: oklch(96.4% .002 247.839);
  --tip-fg: oklch(24.7% .006 258.361);
  --shadow-btn: 0 0 0 1px oklch(100% 0 0 / .1), 0 1px 2px oklch(0% 0 0 / .3);
  --shadow-card: 0 0 0 1px oklch(100% 0 0 / .11), 0 1px 2px oklch(0% 0 0 / .2), 0 2px 6px oklch(0% 0 0 / .2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font: 14px/21px var(--font); letter-spacing: -.01em; color: var(--ink);
  -webkit-font-smoothing: antialiased;
  background: repeating-linear-gradient(-45deg, transparent 0 7px, var(--stripe) 7px 8px) var(--stripe-bg);
}
h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
code { font: 12px var(--mono); }
.frame { max-width: 960px; margin: 40px auto; background: var(--page); box-shadow: var(--shadow-card); border-radius: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 28px 32px; }
.controls { display: flex; gap: 8px; margin-left: auto; }
main > section { border-top: 1px dashed var(--line); padding: 40px 32px; }
section > header h2 { margin: 0; font-size: 13px; font-weight: 600; }
section > header h2::before { content: "01"; margin-right: 10px; font: 11px var(--mono); color: var(--ink-3); }
section > header p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-3); }
footer { border-top: 1px dashed var(--line); padding: 16px 32px; font-size: 12px; color: var(--ink-3); }
@media (max-width: 900px) {
  .frame { margin: 0; min-height: 100vh; border-radius: 0; }
  .top { padding: 16px 20px; }
  main > section { padding: 24px 20px; }
  footer { padding: 16px 20px; }
}
.seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--field); }
.seg > button {
  display: inline-flex; align-items: center; padding: 2px 8px; border: 0; border-radius: 999px;
  font: 500 11.5px/18px var(--font); color: var(--ink-3); background: none; cursor: pointer;
}
.seg > button:hover { color: var(--ink); }
:root[lang="zh"] [data-lang="zh"], :root[lang="en"] [data-lang="en"],
:root[data-theme="light"] [data-theme-set="light"], :root[data-theme="dark"] [data-theme-set="dark"] {
  color: var(--ink); background: var(--surface); box-shadow: var(--shadow-btn);
}
.seg svg { width: 13px; height: 13px; }
.badge {
  position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-btn);
  font: 11px var(--mono); color: var(--ink-2);
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div class="frame">
<header class="top">
<h1 data-t="title"></h1>
<div class="controls">
<div class="seg" role="group"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
<div class="seg" role="group"><button type="button" data-theme-set="light" data-t-label="light"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg></button><button type="button" data-theme-set="dark" data-t-label="dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg></button></div>
</div>
</header>
<main>
<section>
<header><h2 data-t="hello"></h2><p data-t="intro"></p></header>
</section>
</main>
<footer data-t="footer"></footer>
</div>
<div class="badge">pneuma-space-example-site</div>
<script>
const dict = {
  en: { title: 'Static site', hello: 'Hello', intro: 'Served by PneumaSpace without a container. Edit site/ and publish again.', light: 'Light', dark: 'Dark', footer: 'Runs on PneumaSpace' },
  zh: { title: '静态站点', hello: '你好', intro: '由 PneumaSpace 直接提供，不启动容器。修改 site/ 后重新发布即可。', light: '浅色', dark: '深色', footer: '运行于 PneumaSpace' },
};
const root = document.documentElement;
const media = matchMedia('(prefers-color-scheme: dark)');
const save = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };
function render() {
  const t = dict[root.lang];
  document.title = t.title;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t[el.dataset.t];
  for (const el of document.querySelectorAll('[data-t-label]')) el.ariaLabel = t[el.dataset.tLabel];
}
render();
media.addEventListener('change', () => { try { if (localStorage.getItem('pneuma-space-theme')) return; } catch (e) {} root.dataset.theme = media.matches ? 'dark' : 'light'; });
document.addEventListener('click', (event) => {
  const lang = event.target.closest('[data-lang]')?.dataset.lang;
  const theme = event.target.closest('[data-theme-set]')?.dataset.themeSet;
  if (lang) { root.lang = lang; save('pneuma-space-lang', lang); render(); }
  if (theme) { root.dataset.theme = theme; save('pneuma-space-theme', theme); }
});
</script>
</body>
</html>
