# Every default credential below is for a single trusted machine only; override it in .env for anything else.
# Host ports and the network name are variables so a second stack (the acceptance suite) can run beside this one.
name: pneuma-space

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    # Every request and lifecycle event is a stdout line (ADR 0024 item 5); the log driver bounds what the host keeps.
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }
    depends_on:
      rustfs: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      retries: 30
    ports:
      - "127.0.0.1:${PNEUMA_SPACE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${PNEUMA_SPACE_ADMIN_PORT:-8081}:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
    environment:
      PNEUMA_SPACE_NETWORK: ${PNEUMA_SPACE_NETWORK:-pneuma-space}
      PNEUMA_SPACE_HTTP_PORT: ${PNEUMA_SPACE_HTTP_PORT:-8080}
      PNEUMA_SPACE_OBJECT_ROOT_USER: ${PNEUMA_SPACE_OBJECT_ROOT_USER:-pneuma-local}
      PNEUMA_SPACE_OBJECT_ROOT_PASSWORD: ${PNEUMA_SPACE_OBJECT_ROOT_PASSWORD:-pneuma-local-secret}
      PNEUMA_SPACE_OBJECT_PUBLIC_ENDPOINT: ${PNEUMA_SPACE_OBJECT_PUBLIC_ENDPOINT:-http://127.0.0.1:${PNEUMA_SPACE_OBJECT_PORT:-9000}}
      PNEUMA_SPACE_RTC_SECRET: ${PNEUMA_SPACE_RTC_SECRET:-pneuma-local-rtc}
      PNEUMA_SPACE_RTC_PUBLIC_HOST: ${PNEUMA_SPACE_RTC_PUBLIC_HOST:-127.0.0.1}
      PNEUMA_SPACE_REDIS_PASSWORD: ${PNEUMA_SPACE_REDIS_PASSWORD:-pneuma}
      PNEUMA_SPACE_POSTGRES_PASSWORD: ${PNEUMA_SPACE_POSTGRES_PASSWORD:-pneuma-local}
      PNEUMA_SPACE_VOLUME_SIZE: ${PNEUMA_SPACE_VOLUME_SIZE:-1Gi}
      # Empty is the default: local identity, path addressing, no /metrics port (docs/app-contract.md).
      PNEUMA_SPACE_IDENTITY: ${PNEUMA_SPACE_IDENTITY:-}
      PNEUMA_SPACE_IDENTITY_HEADER: ${PNEUMA_SPACE_IDENTITY_HEADER:-}
      PNEUMA_SPACE_IDENTITY_JWKS_URL: ${PNEUMA_SPACE_IDENTITY_JWKS_URL:-}
      PNEUMA_SPACE_IDENTITY_KEYS_FILE: ${PNEUMA_SPACE_IDENTITY_KEYS_FILE:-}
      PNEUMA_SPACE_IDENTITY_ISSUER: ${PNEUMA_SPACE_IDENTITY_ISSUER:-}
      PNEUMA_SPACE_IDENTITY_AUDIENCE: ${PNEUMA_SPACE_IDENTITY_AUDIENCE:-}
      PNEUMA_SPACE_CONSOLE_AUDIENCE: ${PNEUMA_SPACE_CONSOLE_AUDIENCE:-}
      PNEUMA_SPACE_IDENTITY_USER_CLAIM: ${PNEUMA_SPACE_IDENTITY_USER_CLAIM:-}
      PNEUMA_SPACE_IDENTITY_NAME_CLAIMS: ${PNEUMA_SPACE_IDENTITY_NAME_CLAIMS:-}
      PNEUMA_SPACE_IDENTITY_GROUPS_CLAIM: ${PNEUMA_SPACE_IDENTITY_GROUPS_CLAIM:-}
      PNEUMA_SPACE_IDENTITY_LOGIN_URL: ${PNEUMA_SPACE_IDENTITY_LOGIN_URL:-}
      PNEUMA_SPACE_IDENTITY_LOGOUT_URL: ${PNEUMA_SPACE_IDENTITY_LOGOUT_URL:-}
      PNEUMA_SPACE_IDENTITY_STRIP_COOKIES: ${PNEUMA_SPACE_IDENTITY_STRIP_COOKIES:-}
      PNEUMA_SPACE_PLATFORM_ADMINS: ${PNEUMA_SPACE_PLATFORM_ADMINS:-}
      PNEUMA_SPACE_APPS_ORIGIN: ${PNEUMA_SPACE_APPS_ORIGIN:-}
      PNEUMA_SPACE_METRICS_PORT: ${PNEUMA_SPACE_METRICS_PORT:-}
      PNEUMA_SPACE_HOSTED_CONTROL_ORIGIN: ${PNEUMA_SPACE_HOSTED_CONTROL_ORIGIN:-}
      PNEUMA_SPACE_HOSTED_DEVELOPMENT: ${PNEUMA_SPACE_HOSTED_DEVELOPMENT:-}
      PNEUMA_SPACE_HOSTED_DEVELOPMENT_USERS: ${PNEUMA_SPACE_HOSTED_DEVELOPMENT_USERS:-}
      PNEUMA_SPACE_HOSTED_GITHUB_CLIENT_ID: ${PNEUMA_SPACE_HOSTED_GITHUB_CLIENT_ID:-}
      PNEUMA_SPACE_HOSTED_GITHUB_CLIENT_SECRET: ${PNEUMA_SPACE_HOSTED_GITHUB_CLIENT_SECRET:-}
      PNEUMA_SPACE_HOSTED_ALLOWED_SUBJECTS: ${PNEUMA_SPACE_HOSTED_ALLOWED_SUBJECTS:-}
      PNEUMA_SPACE_HOSTED_SIGNUP_LIMIT: ${PNEUMA_SPACE_HOSTED_SIGNUP_LIMIT:-20}
    networks: [pneuma-space]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PNEUMA_SPACE_OBJECT_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${PNEUMA_SPACE_OBJECT_ROOT_USER:-pneuma-local}
      RUSTFS_SECRET_KEY: ${PNEUMA_SPACE_OBJECT_ROOT_PASSWORD:-pneuma-local-secret}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      retries: 30
    networks: [pneuma-space]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass is ignored once an aclfile is loaded, so the default user's password is rewritten into the file at every start.
    command:
      - sh
      - -c
      - >-
        touch /data/users.acl && sed -i "/^user default /d" /data/users.acl &&
        echo "user default on >$$PNEUMA_SPACE_REDIS_PASSWORD ~* &* +@all" >> /data/users.acl &&
        exec redis-server --appendonly yes --aclfile /data/users.acl
    environment:
      PNEUMA_SPACE_REDIS_PASSWORD: ${PNEUMA_SPACE_REDIS_PASSWORD:-pneuma}
    volumes:
      - redis-data:/data
    networks: [pneuma-space]

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PNEUMA_SPACE_POSTGRES_PASSWORD:-pneuma-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [pneuma-space]

  # One process for every isolate app (ADR 0017). The OS caps are the backstop for what a worker's resourceLimits do not bound.
  runner:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    profiles: [isolate]
    restart: unless-stopped
    command:
      - node
      - --disable-warning=ExperimentalWarning
      - --disable-warning=SecurityWarning
      - --permission
      - --allow-fs-read=/data
      - --allow-fs-read=/gateway
      - --allow-fs-read=/shared
      - --allow-fs-write=/data
      - --allow-worker
      - src/runner.ts
    mem_limit: ${PNEUMA_SPACE_RUNNER_MEMORY:-2g}
    pids_limit: ${PNEUMA_SPACE_RUNNER_PIDS:-512}
    environment:
      PNEUMA_SPACE_RUNNER_WORKER_HEAP_MB: ${PNEUMA_SPACE_RUNNER_WORKER_HEAP_MB:-256}
      PNEUMA_SPACE_RUNNER_WORKER_OFFHEAP_MB: ${PNEUMA_SPACE_RUNNER_WORKER_OFFHEAP_MB:-256}
      PNEUMA_SPACE_RUNNER_STUCK_LIMIT: ${PNEUMA_SPACE_RUNNER_STUCK_LIMIT:-3}
    volumes:
      - runner-data:/data
    networks: [pneuma-space]

  coturn:
    image: coturn/coturn:4.6
    profiles: [rtc]
    restart: unless-stopped
    command:
      - --use-auth-secret
      - --static-auth-secret=${PNEUMA_SPACE_RTC_SECRET:-pneuma-local-rtc}
      - --realm=pneuma
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --no-cli
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"
    networks: [pneuma-space]

networks:
  pneuma-space:
    name: ${PNEUMA_SPACE_NETWORK:-pneuma-space}

volumes:
  gateway-data:
  rustfs-data:
  redis-data:
  postgres-data:
  runner-data:
